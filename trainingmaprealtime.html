<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>P.U.M.A. - Mappa Real Time</title>
  <link rel="icon" type="image/jpeg" href="https://gesaddvvf.github.io/PUMA/images/puma.jpg">
  <!-- Google Fonts: Comfortaa -->
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    body {
      font-family: 'Comfortaa', cursive;
      background-color: #1e1e1e;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
    }

    /* Header a barra: titolo + pulsanti, in flusso normale (non più overlay fisso) */
    #page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      background-color: #1e1e1e;
      border-bottom: 1px solid #444;
      padding: 10px 16px;
      box-sizing: border-box;
      flex-shrink: 0;
    }
    #page-header h1 {
      font-size: 16px;
      color: #ffd700;
      margin: 0 0 2px 0;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #page-header .puma-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }
    #page-header .subtitle-divider {
      color: #666;
    }
    #page-header h2 {
      font-size: 13px;
      color: #ccc;
      font-weight: normal;
      margin: 0;
    }
    #page-header #today-date {
      color: #ffd700;
      font-weight: bold;
      text-transform: capitalize;
    }

    /* Layout principale: mappa + pannello dettagli, sotto l'header */
    #app-container {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: row;
    }
    #map {
      flex: 1 1 auto;
      height: 100%;
      min-width: 0;
      position: relative;
    }
    #details-panel {
      width: 360px;
      flex-shrink: 0;
      height: 100%;
      overflow-y: auto;
      background-color: #1e1e1e;
      border-left: 1px solid #444;
      padding: 16px;
      box-sizing: border-box;
    }
    #details-empty {
      color: #888;
      font-size: 13px;
      padding-top: 8px;
    }
    #details-content { display: none; }
    #details-content h3 {
      color: #ffd700;
      font-size: 15px;
      margin: 0 0 10px 0;
    }

    /* Su schermi stretti (tablet/mobile): mappa sopra, dettagli sotto */
    @media (max-width: 900px) {
      #app-container {
        flex-direction: column;
      }
      #map {
        height: 55%;
        width: 100%;
        flex: none;
      }
      #details-panel {
        width: 100%;
        height: 45%;
        border-left: none;
        border-top: 1px solid #444;
      }
    }

    table {
      font-family: 'Comfortaa', cursive;
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }
    td {
      padding: 4px 8px;
      border: 1px solid #444;
    }
    tr:nth-child(even) { background-color: #2a2a2a; }
    tr:nth-child(odd) { background-color: #1f1f1f; }
    td.value { font-weight: bold; text-align: right; color: #ffd700; }
    td.value.nominativi-cell { text-align: left; }
    td.key { text-align: left; color: #f0f0f0; }

    .popup-btn {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 5px;
      padding: 10px 0;
      font-size: 16px;
      background-color: #ffd700; 
      color: #1e1e1e;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
    }

    .tel-link {
      color: #f0f0f0;
      text-decoration: none;
      border-bottom: 1px dotted #999;
      cursor: pointer;
    }
    .tel-link:hover { color: #ffd700; border-bottom-color: #ffd700; }

    details.nominativi-list summary {
      cursor: pointer;
      color: #ffd700;
      outline: none;
      font-weight: bold;
    }
    details.nominativi-list summary:hover { text-decoration: underline; }
    .nominativi-content {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .persona-item {
      background-color: #2a2a2a;
      border-left: 3px solid #ffd700;
      border-radius: 3px;
      padding: 6px 10px;
      font-size: 12px;
      line-height: 1.6;
    }
    .persona-nome {
      display: block;
      font-weight: bold;
      color: #f0f0f0;
    }
    .persona-cf {
      display: inline-block;
      font-family: monospace;
      color: #999;
      margin-right: 12px;
    }

    #nav-buttons {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .nav-btn {
      display: inline-block;
      background-color: #2a2a2a;
      color: #ffd700;
      border: 1px solid #ffd700;
      border-radius: 4px;
      padding: 8px 14px;
      font-family: 'Comfortaa', cursive;
      font-weight: bold;
      font-size: 13px;
      text-decoration: none;
      transition: background-color 0.15s, color 0.15s;
    }
    .nav-btn:hover {
      background-color: #ffd700;
      color: #1e1e1e;
    }

    /* Zoom mappa spostato a metà altezza, sul lato sinistro */
    .leaflet-top.leaflet-left {
      top: 50%;
      transform: translateY(-50%);
    }

    /* Alone pulsante attorno al marker dell'addestramento selezionato.
       L'animazione è su un div INTERNO, non sul wrapper che Leaflet posiziona,
       per non entrare in conflitto con il transform usato per il posizionamento. */
    .marker-highlight-wrapper.leaflet-div-icon {
      background: transparent;
      border: none;
    }
    .marker-highlight-pulse {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,215,0,0.35) 0%, rgba(255,215,0,0.15) 55%, rgba(255,215,0,0) 70%);
      box-shadow: 0 0 0 2px rgba(255,215,0,0.75);
      animation: pulse-highlight 1.6s ease-in-out infinite;
    }
    @keyframes pulse-highlight {
      0%   { transform: scale(0.8); opacity: 0.9; }
      50%  { transform: scale(1.2); opacity: 0.45; }
      100% { transform: scale(0.8); opacity: 0.9; }
    }

    /* Header a colonna e pulsanti a tutta larghezza su schermi stretti, per non sovrapporsi */
    @media (max-width: 700px) {
      #page-header {
        flex-direction: column;
      }
      #nav-buttons {
        width: 100%;
      }
      .nav-btn {
        flex: 1;
        text-align: center;
      }
    }
  </style>
</head>
<body>
<header id="page-header">
  <div>
    <h1><img class="puma-icon" src="https://gesaddvvf.github.io/PUMA/images/puma.jpg" alt="PUMA">PUMA <span class="subtitle-divider">–</span> Piattaforma Unificata Monitoraggio Addestramenti</h1>
    <h2>Mappa addestramenti odierni <span id="today-date"></span></h2>
  </div>
  <div id="nav-buttons">
    <a class="nav-btn" href="personaleodierno.html">Riepilogo Presenze Odierne ➡</a>
    <a class="nav-btn" href="https://sites.google.com/view/pumavvf/home-page">Homepage P.U.M.A.</a>
  </div>
</header>

<div id="app-container">
  <div id="map"></div>
  <div id="details-panel">
    <div id="details-empty">Seleziona un addestramento sulla mappa per vederne i dettagli.</div>
    <div id="details-content"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
// CSV del foglio Real_Time_Map
const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRfRKFf6aHC3asr7iNREmon_px3MLiLhbU78DDi-MucJx8sds6yX1e303P23wjR0IitnaNhFRNzDkzd/pub?gid=744101024&single=true&output=csv";

// Parametri opzionali dall'URL: ?lat=..&lng=..&zoom=.. per centrare la mappa su un punto specifico
const urlParams = new URLSearchParams(window.location.search);
const targetLat = parseFloat(urlParams.get('lat'));
const targetLng = parseFloat(urlParams.get('lng'));
const targetZoom = parseFloat(urlParams.get('zoom')) || 15;
const hasTarget = !isNaN(targetLat) && !isNaN(targetLng);

const map = L.map('map', {
    tap: true,
    touchZoom: true
}).setView(hasTarget ? [targetLat, targetLng] : [41.9, 12.5], hasTarget ? targetZoom : 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

// Forza Leaflet a ricalcolare le dimensioni quando la finestra/iframe cambia size
window.addEventListener('resize', function() {
  map.invalidateSize();
});
// Ricalcola anche subito dopo il caricamento, utile dentro iframe di Google Sites
setTimeout(function() { map.invalidateSize(); }, 300);

function getIconUrl(tipo) {
  tipo = tipo?.toLowerCase() || "";
  return "https://cdn-icons-png.flaticon.com/512/684/684908.png";
}

// Data odierna nell'intestazione
(function setTodayDate() {
  const oggi = new Date();
  const formatted = oggi.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('today-date').textContent = `– ${formatted}`;
})();

const detailsEmpty = document.getElementById('details-empty');
const detailsContent = document.getElementById('details-content');

// Alone pulsante attorno al marker dell'addestramento selezionato
let highlightMarker = null;
const highlightIcon = L.divIcon({
  className: 'marker-highlight-wrapper',
  html: '<div class="marker-highlight-pulse"></div>',
  iconSize: [48, 48],
  iconAnchor: [24, 24]
});

function highlightSelected(lat, lng) {
  if (highlightMarker) {
    map.removeLayer(highlightMarker);
  }
  highlightMarker = L.marker([lat, lng], {
    icon: highlightIcon,
    interactive: false,
    zIndexOffset: -1000,
    keyboard: false
  }).addTo(map);
}

// Cliccando un punto vuoto della mappa (non un marker) si deseleziona:
// toglie l'alone e riporta il pannello dettagli allo stato vuoto
function clearSelection() {
  if (highlightMarker) {
    map.removeLayer(highlightMarker);
    highlightMarker = null;
  }
  detailsContent.style.display = 'none';
  detailsContent.innerHTML = '';
  detailsEmpty.style.display = 'block';
  setTimeout(function() { map.invalidateSize(); }, 50);
}
map.on('click', clearSelection);

// Copia un numero di telefono negli appunti al click, con un piccolo feedback visivo
function copyPhone(el, number) {
  const original = el.innerHTML;
  const done = (ok) => {
    el.innerHTML = ok ? '✅ Copiato!' : '⚠️ Errore copia';
    setTimeout(() => { el.innerHTML = original; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(number).then(() => done(true)).catch(() => done(false));
  } else {
    try {
      const ta = document.createElement('textarea');
      ta.value = number;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done(true);
    } catch (e) {
      done(false);
    }
  }
}

// Genera un elemento cliccabile "copia numero" invece di un link "chiama"
function telSpan(num) {
  return `<span class="tel-link" onclick="copyPhone(this, '${num}')" title="Clicca per copiare il numero">📞 ${num}</span>`;
}

// Trasforma il testo grezzo "> Nome   CF: ...   Tel. ..." in un elenco di card leggibili
// (stessa logica usata nella tabella Riepilogo Presenze Odierne)
function renderNominativi(raw) {
  const lines = (raw || '').split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const persone = [];
  let current = null;

  lines.forEach(line => {
    if (line.startsWith('>')) {
      current = { nome: line.replace(/^>\s*/, ''), cf: '', tel: '' };
      persone.push(current);
    } else if (current) {
      const cfMatch = line.match(/^CF:\s*(.+)$/i);
      const telMatch = line.match(/^Tel\.?\s*(.+)$/i);
      if (cfMatch) current.cf = cfMatch[1].trim();
      else if (telMatch) current.tel = telMatch[1].trim();
    }
  });

  if (persone.length === 0) return `<div class="persona-item">${raw}</div>`;

  return persone.map(p => {
    const cfHtml = p.cf ? `<span class="persona-cf">CF: ${p.cf}</span>` : '';
    const telHtml = p.tel ? telSpan(p.tel) : '';
    return `<div class="persona-item"><span class="persona-nome">${p.nome}</span>${cfHtml}${telHtml}</div>`;
  }).join('');
}

// Mostra i dati dell'addestramento selezionato nel pannello laterale (invece che in un popup)
function showDetails(row, headers, lat, lng) {
  let html = `<h3>${row["Tipologia addestramento"] || "Addestramento"}</h3>`;
  html += `<button class="popup-btn" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}','_blank')">🚒 Naviga a</button>`;
  html += "<table>";
  headers.forEach(key => {
    if (row[key] !== undefined && row[key] !== "") {
      const keyLower = key.toLowerCase();

      if (keyLower.includes('nominativi')) {
        // Elenco nominativi come elenco espandibile di card leggibili
        const details = `<details class="nominativi-list"><summary>Mostra elenco</summary><div class="nominativi-content">${renderNominativi(row[key])}</div></details>`;
        html += `<tr><td class="key">${key}</td><td class="value nominativi-cell">${details}</td></tr>`;
      } else if (keyLower.includes('funzione comando')) {
        // Referente singolo (IC / Responsabile Tecnico Manovre): stessa card, sempre visibile
        html += `<tr><td class="key">${key}</td><td class="value nominativi-cell">${renderNominativi(row[key])}</td></tr>`;
      } else {
        let val = row[key];
        // Se la colonna contiene numeri tra parentesi, li rende cliccabili per copiarli
        val = val.replace(/\((\d+)\)/g, (match, num) => {
          return `(${telSpan(num)})`;
        });
        html += `<tr><td class="key">${key}</td><td class="value">${val}</td></tr>`;
      }
    }
  });
  html += "</table>";

  detailsContent.innerHTML = html;
  detailsEmpty.style.display = 'none';
  detailsContent.style.display = 'block';

  // Il pannello può aver cambiato dimensione alla mappa (specialmente su mobile): ricalcola
  setTimeout(function() { map.invalidateSize(); }, 50);
}


Papa.parse(sheetUrl, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results) {
    const data = results.data;
    if(data.length === 0) return;

    const markers = L.featureGroup();
    const headers = Object.keys(data[0]);
    let targetMarker = null;
    let targetMarkerDist = Infinity;
    let targetRowData = null;

    data.forEach(row => {
      const coordStr = row["Coordinate"];
      if(coordStr) {
        const [lat, lng] = coordStr.split(',').map(x => parseFloat(x.trim()));
        if(!isNaN(lat) && !isNaN(lng)) {

          const icon = L.icon({
            iconUrl: getIconUrl(row["Tipologia addestramento"]),
            iconSize: [32,32],
            iconAnchor: [16,32],
            popupAnchor: [0,-32]
          });

          const marker = L.marker([lat,lng], {icon: icon}).addTo(map);

          marker.on('click', function() {
            showDetails(row, headers, lat, lng);
            highlightSelected(lat, lng);
          });

          marker.on('mouseover', function() { this.setZIndexOffset(1000); });
          marker.on('mouseout', function() { this.setZIndexOffset(0); });

          markers.addLayer(marker);

          // Se è stato passato un punto target via URL, individua il marker più vicino
          if (hasTarget) {
            const dist = Math.hypot(lat - targetLat, lng - targetLng);
            if (dist < targetMarkerDist) {
              targetMarkerDist = dist;
              targetMarker = marker;
              targetRowData = row;
            }
          }
        }
      }
    });

    if (hasTarget) {
      // Centrato sul punto richiesto: non adattare la vista a tutti i marker
      map.setView([targetLat, targetLng], targetZoom);
      if (targetMarker && targetMarkerDist < 0.01) { // ~1km di tolleranza
        showDetails(targetRowData, headers, targetLat, targetLng);
        highlightSelected(targetLat, targetLng);
      }
    } else if (markers.getLayers().length > 0) {
      map.fitBounds(markers.getBounds().pad(0.2));
    }

    // Ricalcolo finale dopo aver caricato i marker (utile se l'iframe si è ridimensionato nel frattempo)
    setTimeout(function() { map.invalidateSize(); }, 100);
  }
});
</script>
</body>
</html>
