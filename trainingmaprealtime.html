<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mappa Leaflet da Google Sheet - Tema Scuro</title>
  <link rel="icon" type="image/jpeg" href="https://gesaddvvf.github.io/PUMA/images/puma.jpg">
  <!-- Google Fonts: Comfortaa -->
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    body {
      font-family: 'Comfortaa', cursive;
      background-color: #1e1e1e;
      color: #f0f0f0;
    }
    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100%;
      width: 100%;
    }

    table {
      font-family: 'Comfortaa', cursive;
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }
    td {
      padding: 4px 8px;
      border: 1px solid #444;
    }
    tr:nth-child(even) { background-color: #2a2a2a; }
    tr:nth-child(odd) { background-color: #1f1f1f; }
    td.value { font-weight: bold; text-align: right; color: #ffd700; }
    td.key { text-align: left; color: #f0f0f0; }

    .leaflet-popup-content-wrapper {
      max-height: 60vh;
      min-width: 300px;
      max-width: 90vw;
      overflow-y: auto;
      background-color: #2a2a2a;
      color: #f0f0f0;
    }
    .leaflet-popup-tip {
      background: #2a2a2a;
    }

    .popup-btn {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 5px;
      padding: 10px 0;
      font-size: 16px;
      background-color: #ffd700; 
      color: #1e1e1e;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
    }

    a.tel-link {
      color: #00ffff; /* colore link telefono */
      text-decoration: underline;
    }

    #nav-buttons {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      gap: 8px;
    }
    .nav-btn {
      display: inline-block;
      background-color: #2a2a2a;
      color: #ffd700;
      border: 1px solid #ffd700;
      border-radius: 4px;
      padding: 8px 14px;
      font-family: 'Comfortaa', cursive;
      font-weight: bold;
      font-size: 13px;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      transition: background-color 0.15s, color 0.15s;
    }
    .nav-btn:hover {
      background-color: #ffd700;
      color: #1e1e1e;
    }

    #header-overlay {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background-color: rgba(30, 30, 30, 0.9);
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      max-width: calc(100% - 24px);
      box-sizing: border-box;
    }
    #header-overlay h1 {
      font-size: 16px;
      color: #ffd700;
      margin: 0 0 2px 0;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #header-overlay .puma-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }
    #header-overlay .subtitle-divider {
      color: #666;
    }
    #header-overlay h2 {
      font-size: 13px;
      color: #ccc;
      font-weight: normal;
      margin: 0;
    }
    #header-overlay #today-date {
      color: #ffd700;
      font-weight: bold;
      text-transform: capitalize;
    }
  </style>
</head>
<body>
<div id="header-overlay">
  <h1><img class="puma-icon" src="https://gesaddvvf.github.io/PUMA/images/puma.jpg" alt="PUMA">PUMA <span class="subtitle-divider">–</span> Piattaforma Unificata Monitoraggio Addestramenti</h1>
  <h2>Mappa addestramenti odierni <span id="today-date"></span></h2>
</div>
<div id="nav-buttons">
  <a class="nav-btn" href="presenze-odierne.html">⬅ Torna alla tabella</a>
  <a class="nav-btn" href="https://sites.google.com/view/pumavvf/home-page">PUMA</a>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
// CSV del foglio Real_Time_Map
const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRfRKFf6aHC3asr7iNREmon_px3MLiLhbU78DDi-MucJx8sds6yX1e303P23wjR0IitnaNhFRNzDkzd/pub?gid=744101024&single=true&output=csv";

// Parametri opzionali dall'URL: ?lat=..&lng=..&zoom=.. per centrare la mappa su un punto specifico
const urlParams = new URLSearchParams(window.location.search);
const targetLat = parseFloat(urlParams.get('lat'));
const targetLng = parseFloat(urlParams.get('lng'));
const targetZoom = parseFloat(urlParams.get('zoom')) || 15;
const hasTarget = !isNaN(targetLat) && !isNaN(targetLng);

const map = L.map('map', {
    tap: true,
    touchZoom: true
}).setView(hasTarget ? [targetLat, targetLng] : [41.9, 12.5], hasTarget ? targetZoom : 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

// Forza Leaflet a ricalcolare le dimensioni quando la finestra/iframe cambia size
window.addEventListener('resize', function() {
  map.invalidateSize();
});
// Ricalcola anche subito dopo il caricamento, utile dentro iframe di Google Sites
setTimeout(function() { map.invalidateSize(); }, 300);

function getIconUrl(tipo) {
  tipo = tipo?.toLowerCase() || "";
  return "https://cdn-icons-png.flaticon.com/512/684/684908.png";
}

// Data odierna nell'intestazione
(function setTodayDate() {
  const oggi = new Date();
  const formatted = oggi.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('today-date').textContent = `– ${formatted}`;
})();

Papa.parse(sheetUrl, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results) {
    const data = results.data;
    if(data.length === 0) return;

    const markers = L.featureGroup();
    const headers = Object.keys(data[0]);
    let targetMarker = null;
    let targetMarkerDist = Infinity;

    data.forEach(row => {
      const coordStr = row["Coordinate"];
      if(coordStr) {
        const [lat, lng] = coordStr.split(',').map(x => parseFloat(x.trim()));
        if(!isNaN(lat) && !isNaN(lng)) {

          const icon = L.icon({
            iconUrl: getIconUrl(row["Tipologia addestramento"]),
            iconSize: [32,32],
            iconAnchor: [16,32],
            popupAnchor: [0,-32]
          });

          const marker = L.marker([lat,lng], {icon: icon}).addTo(map);

          // Pulsante in alto
          let popupContent = `<button class="popup-btn" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}','_blank')">🚒 Naviga a</button>`;

          // Tabella popup
          popupContent += "<table>";
          headers.forEach(key => {
            if(row[key] !== undefined) {
              let val = row[key];

              // Se la colonna contiene numeri tra parentesi, crea link "chiama" con +39
              // esempio: "Comando (12345)" diventa <a href="tel:+3912345">
              val = val.replace(/\((\d+)\)/g, (match, num) => {
                return `(<a class="tel-link" href="tel:+39${num}">${num}</a>)`;
              });

              popupContent += `<tr><td class="key">${key}</td><td class="value">${val}</td></tr>`;
            }
          });
          popupContent += "</table>";

          marker.bindPopup(popupContent);

          marker.on('mouseover', function() { this.setZIndexOffset(1000); });
          marker.on('mouseout', function() { this.setZIndexOffset(0); });

          markers.addLayer(marker);

          // Se è stato passato un punto target via URL, individua il marker più vicino
          if (hasTarget) {
            const dist = Math.hypot(lat - targetLat, lng - targetLng);
            if (dist < targetMarkerDist) {
              targetMarkerDist = dist;
              targetMarker = marker;
            }
          }
        }
      }
    });

    if (hasTarget) {
      // Centrato sul punto richiesto: non adattare la vista a tutti i marker
      map.setView([targetLat, targetLng], targetZoom);
      if (targetMarker && targetMarkerDist < 0.01) { // ~1km di tolleranza
        targetMarker.openPopup();
      }
    } else if (markers.getLayers().length > 0) {
      map.fitBounds(markers.getBounds().pad(0.2));
    }

    // Ricalcolo finale dopo aver caricato i marker (utile se l'iframe si è ridimensionato nel frattempo)
    setTimeout(function() { map.invalidateSize(); }, 100);
  }
});
</script>
</body>
</html>
