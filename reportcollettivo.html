  const firme = R.tipo === 'comando'
    ? [['Visto del ROP', R.R.rop], ['Visto del ROR', R.R.ror]]
    : [['Visto del ROR', R.R.ror], ...(R.R.fds.length ? [['Visto del Funzionario di settore', R.R.fds]] : [])];
  const voce = (k, v, x, yv) => { doc.setFont('helvetica', 'normal'); doc.text(k, x, yv, { align: 'right' }); if (v) { doc.setFont('helvetica', 'bold'); doc.text(testoPdf(v), x + 2.5, yv); } };
  doc.setFontSize(8);
  voce('Anno', String(R.y) + (c.anniPrima ? ` (ore ${periodoDi(c, R.y).replace('–', '-')})` : ''), 30, yy);
  if (firme[0]) { voce(firme[0][0], firme[0][1].map(senzaCf).join(', '), 175, yy); doc.setLineWidth(0.2); doc.line(177.5, yy + 1, W - M, yy + 1); }
  yy += 5.5;

  doc.setTextColor(110); doc.text('Generato da P.U.M.A.', W - M, yy, { align: 'right' }); doc.setTextColor(0);

        String(E.senza.length || ''), E.ore.tot ? fmtHM(E.ore.tot) : '-', String(E.collettivi.n || '-')];

      const wNome = doc.getTextWidth(testoPdf(E.nome));
      doc.setFontSize(7.5); doc.setFont('helvetica', 'normal'); doc.setTextColor(60);
      doc.text(testoPdf(`ROP: ${rop || 'non indicato'} - con corso ${E.con.length}: ${conteggi(E)} - senza corso ${E.senza.length}`), M + wNome + 4, y0);
      doc.setTextColor(0);
      tabella(corpo(E), y0 + 2);
    });
  }
  // Legenda delle manovre previste (codici usati nel dettaglio)
  if (c.previste.length) {
    let y0 = doc.lastAutoTable.finalY + 7;
    if (y0 > H - 30) { doc.addPage(); y0 = M + 5; }
    doc.setFontSize(9); doc.setFont('helvetica', 'bold'); doc.setTextColor(0);
    doc.text(testoPdf(`Manovre previste - ${c.tipologia} (${c.previste.length})`), M, y0);
    const righe = [];
    for (let i = 0; i < c.previste.length; i += 2) righe.push([c.previste[i], c.previste[i + 1]].flatMap(m => m ? [codiceMan(m), testoPdf(m.manovra)] : ['', '']));
    doc.autoTable({ startY: y0 + 2, margin: { left: M, right: M, top: M, bottom: 8 }, body: righe, theme: 'grid',
      styles: { font: 'helvetica', fontSize: 6.5, cellPadding: 0.8, lineColor: [150, 150, 150], lineWidth: 0.1, textColor: [0, 0, 0] },
      columnStyles: { 0: { cellWidth: 14, fontStyle: 'bold' }, 2: { cellWidth: 14, fontStyle: 'bold' } } });
  }
  const pagine = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pagine; i++) {
    doc.setPage(i);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(110);
    doc.text(testoPdf(`${R.nome} - ${c.tipologia} - Report collettivo ${R.y} - pag. ${i}/${pagine}`), W - M, H - 3, { align: 'right' });
    doc.setTextColor(0);
  }
  return doc;
}
pdfBtn.addEventListener('click', async () => {
  pdfBtn.disabled = true; const t = pdfBtn.textContent; pdfBtn.textContent = '⏳ PDF…';
  try { (await creaPdf()).save(nomeFilePdf(ULTIMO)); }
  catch (err) { console.error(err); alert('PDF non creato: ' + (err && err.message ? err.message : err)); }
  finally { pdfBtn.textContent = t; pdfBtn.disabled = !ULTIMO; }
});

/* =====================================================================
   INVIO VIA GMAIL → app web Apps Script "InvioReportCollettivo.gs"
   (gli indirizzi di ROP e ROR li trova lo script: la pagina non li vede)
   ===================================================================== */
const dlg = document.getElementById('invio-dlg');
const invStato = document.getElementById('inv-stato');
const invInvia = document.getElementById('inv-invia');
const invAltro = document.getElementById('inv-altro');
const statoInv = (txt, cls) => { invStato.textContent = txt; invStato.className = 'inv-stato' + (cls ? ' ' + cls : ''); };

function apriInvio() {
  const R = ULTIMO;
  if (!R) return;
  document.getElementById('inv-sotto').textContent = `Report collettivo ${R.y} · ${R.c.tipologia} · ${R.nome}, in PDF.`;
  const voce = (id, testo, nomi) => {
    const ok = nomi.length > 0;
    return `<label class="chk${ok ? '' : ' off'}"><input type="checkbox" id="${id}" ${ok ? 'checked' : 'disabled'}> <span>${testo}<small>${ok ? nomi.map(senzaCf).map(esc).join(', ') : 'non indicato in Responsabili per il settore ' + esc(R.c.categoria)}</small></span></label>`;
  };
  let h = '';
  if (R.tipo === 'comando') {
    h += voce('inv-rop', 'Responsabile Operativo Provinciale (ROP)', R.R.rop);
    h += voce('inv-ror', 'Responsabile Operativo Regionale (ROR)', R.R.ror);
  } else {
    h += voce('inv-ror', 'Responsabile Operativo Regionale (ROR)', R.R.ror);
    const ropC = R.R.rop;
    h += `<label class="chk${ropC.length ? '' : ' off'}"><input type="checkbox" id="inv-rop" ${ropC.length ? '' : 'disabled'}> <span>Anche ai ROP dei Comandi della Direzione<small>${ropC.length ? ropC.map(senzaCf).map(esc).join(', ') : 'nessun ROP indicato'}</small></span></label>`;
  }
  document.getElementById('inv-dest').innerHTML = h;
  invAltro.value = '';
  invInvia.disabled = !URL_INVIO_COLLETTIVO;
  if (!URL_INVIO_COLLETTIVO) statoInv("Invio non ancora attivo: manca l'indirizzo dello script di invio (URL_INVIO_COLLETTIVO).", 'ko');
  else if (!R.R.rop.length && !R.R.ror.length) statoInv('ROP e ROR non indicati: puoi inviarlo solo a un altro destinatario.', 'wip');
  else statoInv('');
  dlg.hidden = false;
}
function chiudiInvio() { if (!invInvia.dataset.busy) dlg.hidden = true; }

async function inviaReport() {
  const R = ULTIMO;
  const spunta = id => { const e = document.getElementById(id); return !!(e && e.checked && !e.disabled); };
  const rop = spunta('inv-rop'), ror = spunta('inv-ror');
  const altro = invAltro.value.trim().toLowerCase();
  if (!rop && !ror && !altro) return statoInv('Scegli almeno un destinatario.', 'ko');
  if (altro && !(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(altro) && DOMINI_INVIO.some(d => altro.endsWith('@' + d)))) {
    return statoInv('Indirizzo non ammesso: solo ' + DOMINI_INVIO.map(d => '@' + d).join(', ') + '.', 'ko');
  }
  invInvia.disabled = true; invInvia.dataset.busy = '1';
  try {
    statoInv('Preparo il PDF…', 'wip');
    const doc = await creaPdf();
    const pdf = doc.output('datauristring').split(',')[1];
    statoInv('Invio in corso…', 'wip');
    const r = await fetch(URL_INVIO_COLLETTIVO, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // richiesta semplice: niente preflight CORS
      body: JSON.stringify({ tipo: R.tipo, ente: R.nome, settore: R.c.categoria, tipologia: R.c.tipologia, anno: R.y, rop, ror, altro, nomeFile: nomeFilePdf(R), pdf })
    });
    const j = await r.json();
    if (j.ok) statoInv('Inviato a: ' + (j.destinatari || []).join(', '), 'ok');
    else statoInv(j.errore || 'Invio non riuscito.', 'ko');
  } catch (err) {
    console.error(err);
    statoInv('Invio non riuscito: ' + (err && err.message ? err.message : err), 'ko');
  } finally {
    delete invInvia.dataset.busy;
    invInvia.disabled = !URL_INVIO_COLLETTIVO;
  }
}
mailBtn.addEventListener('click', apriInvio);
invInvia.addEventListener('click', inviaReport);
document.getElementById('inv-annulla').addEventListener('click', chiudiInvio);
dlg.addEventListener('mousedown', e => { if (e.target === dlg) chiudiInvio(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !dlg.hidden) chiudiInvio(); });

function diagnostica() {
  return `<div class="note-box" style="border-color:#a33;margin:0 0 12px"><b>Diagnostica</b><br>
    Registrazioni: ${diag.reg?.righe} righe · ${diag.reg?.persone} persone · Piano: ${diag.piano?.validi} validi · Elenco_Filtrato: ${diag.elenco?.persone} persone ·
    Formazione: ${diag.formazione?.corsi} corsi · Manovre: ${diag.manovre?.righe} · Responsabili: ${esc(JSON.stringify(diag.resp || {}))}<br>
    Enti con personale: ${PER_ENTE.size} · senza Direzione: ${esc([...PER_ENTE.keys()].filter(k => !direzioneDi(k)).join(', ') || '—')}
  </div>`;
}

caricaDati();
