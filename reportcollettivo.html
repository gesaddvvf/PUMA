<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P.U.M.A. - Report collettivo</title>
  <link rel="icon" type="image/jpeg" href="https://gesaddvvf.github.io/PUMA/images/puma.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --gold: #ffd700;
      --arancio: #ef6c00;
      --anno-a: #4fc3f7;
      --ok: #66bb6a;
      --man: #fdd835;
      --quasi: #ffa726;
      --ko: #ef5350;
      --nd: #9e9e9e;
      --warn: #ffb74d;
    }
    * { scrollbar-width: thin; scrollbar-color: #555 #1e1e1e; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #1e1e1e; }
    ::-webkit-scrollbar-thumb { background-color: #555; border-radius: 5px; border: 2px solid #1e1e1e; }
    ::-webkit-scrollbar-thumb:hover { background-color: var(--gold); }

    html, body { height: 100%; margin: 0; padding: 0; }
    body { font-family: 'Comfortaa', cursive; background-color: #1e1e1e; color: #f0f0f0; display: flex; flex-direction: column; }

    /* ---------- HEADER ---------- */
    #page-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;
      background-color: #1e1e1e; border-bottom: 1px solid #444; padding: 10px 16px; box-sizing: border-box; flex-shrink: 0;
    }
    #page-header h1 { font-size: 16px; color: var(--gold); margin: 0 0 2px 0; font-weight: bold; display: flex; align-items: center; gap: 6px; }
    #page-header .puma-icon { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
    #page-header .subtitle-divider { color: #666; }
    #page-header h2 { font-size: 13px; color: #ccc; font-weight: normal; margin: 0; }
    #page-header h2 b { color: var(--gold); }
    #meta-info { font-size: 11.5px; color: #999; margin-top: 4px; }
    #nav-buttons { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
    .nav-btn {
      display: inline-block; background-color: #2a2a2a; color: var(--gold);
      border: 1px solid var(--gold); border-radius: 4px; padding: 8px 14px;
      font-family: 'Comfortaa', cursive; font-weight: bold; font-size: 13px;
      text-decoration: none; transition: background-color 0.15s, color 0.15s;
    }
    .nav-btn:hover { background-color: var(--gold); color: #1e1e1e; }
    button.nav-btn { cursor: pointer; }
    button.nav-btn:disabled { opacity: 0.6; cursor: wait; }
    #refresh-btn.nav-btn { background-color: #c62828; color: #fff; border-color: #c62828; }
    #refresh-btn.nav-btn:hover { background-color: #e53935; border-color: #e53935; color: #fff; }
    #refresh-btn.nav-btn:disabled { background-color: #7f1d1d; border-color: #7f1d1d; }
    /* Report Individuale / Collettivo: arancioni */
    #btn-report.nav-btn, #btn-collettivo.nav-btn { background-color: #ef6c00; color: #fff; border-color: #ef6c00; }
    #btn-report.nav-btn:hover, #btn-collettivo.nav-btn:hover { background-color: #fb8c00; border-color: #fb8c00; color: #fff; }

    /* ---------- FILTRI ---------- */
    #filters {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 8px 16px; border-bottom: 1px solid #444; background-color: #232323; font-size: 12.5px; flex-shrink: 0;
    }
    #filters label.lbl { color: #aaa; }
    #filters select {
      background: #1e1e1e; color: #f0f0f0; border: 1px solid #555; border-radius: 4px;
      padding: 6px 8px; font-family: 'Comfortaa', cursive; font-size: 12.5px; max-width: 100%;
    }
    #filters select:focus { outline: none; border-color: var(--arancio); }
    /* Comando / Direzione: si scrive e si sceglie dall'elenco */
    .combo { position: relative; display: inline-block; }
    #ente-input {
      width: 270px; max-width: 100%; box-sizing: border-box; background: #1e1e1e; color: #f0f0f0; border: 1px solid #555; border-radius: 4px;
      padding: 6px 26px 6px 8px; font-family: 'Comfortaa', cursive; font-size: 12.5px; font-weight: bold;
    }
    #ente-input:focus { outline: none; border-color: var(--arancio); }
    #ente-x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #999; cursor: pointer; font-size: 13px; padding: 2px 5px; }
    #ente-x:hover { color: #ffb74d; }
    .drop {
      position: absolute; top: 100%; left: 0; margin-top: 3px; width: max(100%, 330px); max-height: 380px; overflow-y: auto;
      background: #1e1e1e; border: 1px solid var(--arancio); border-radius: 4px; z-index: 200; box-shadow: 0 6px 18px rgba(0,0,0,.6);
    }
    .drop .head { position: sticky; top: 0; background: #2a2a2a; color: #ffb74d; font-size: 11px; font-weight: bold; padding: 5px 10px; border-bottom: 1px solid #444; text-transform: uppercase; letter-spacing: .03em; }
    .drop .opt { padding: 6px 10px 6px 16px; cursor: pointer; font-size: 12.5px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; gap: 10px; }
    .drop .opt small { color: #999; font-size: 11px; white-space: nowrap; }
    .drop .opt.act, .drop .opt:hover { background: #3a3020; }
    .drop .opt.sel { border-left: 3px solid var(--arancio); }
    .drop .opt.zero { color: #888; }
    .drop .vuoto { padding: 10px; color: #999; font-size: 12px; }
    @media (max-width: 700px) { .combo, #ente-input { width: 100%; } }
    #tip-select { min-width: 300px; }
    #anno-select { font-weight: bold; }
    .seg { display: inline-flex; border: 1px solid var(--arancio); border-radius: 4px; overflow: hidden; }
    .seg button {
      background: #1e1e1e; color: #ffb74d; border: none; padding: 6px 12px; font-family: 'Comfortaa', cursive;
      font-weight: bold; font-size: 12.5px; cursor: pointer;
    }
    .seg button + button { border-left: 1px solid var(--arancio); }
    .seg button.on { background: var(--arancio); color: #fff; }
    label.chk-f { display: inline-flex; align-items: center; gap: 6px; color: #ccc; cursor: pointer; }
    label.chk-f input { accent-color: var(--arancio); }
    .azioni { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .azioni button {
      background: #2a2a2a; color: #ffb74d; border: 1px solid var(--arancio); border-radius: 4px;
      padding: 6px 12px; font-family: 'Comfortaa', cursive; font-weight: bold; font-size: 12.5px; cursor: pointer;
    }
    .azioni button:hover { background: var(--arancio); color: #fff; }
    .azioni button:disabled { opacity: .4; cursor: default; background: #2a2a2a; color: #ffb74d; }

    @media (max-width: 700px) {
      #page-header { flex-direction: column; }
      #nav-buttons { width: 100%; }
      .nav-btn { flex: 1 1 40%; text-align: center; }
      #filters label.lbl, #meta-info { display: none; }
      #filters select { flex: 1 1 100%; }
      .azioni { margin-left: 0; width: 100%; }
      .azioni button { flex: 1 1 30%; }
      #filters { padding: 6px 10px; gap: 6px; }
    }

    /* ---------- CONTENUTO ---------- */
    #content { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; box-sizing: border-box; }
    .wrap { max-width: 1250px; margin: 0 auto; }
    .msg {
      margin: 40px auto; max-width: 600px; text-align: center; color: #ffb74d; border: 1px solid var(--arancio);
      border-radius: 6px; padding: 16px 20px; font-weight: bold; line-height: 1.6; background: #232323;
    }
    .msg small { display: block; color: #aaa; font-weight: normal; margin-top: 6px; }

    .ente-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .ente-head h3 { margin: 0; font-size: 20px; color: #ffb74d; }
    .ente-head h3 span { color: #f0f0f0; font-size: 15px; font-weight: normal; }
    .ente-head .sub { color: #bbb; font-size: 12.5px; margin-top: 5px; line-height: 1.7; }
    .ente-head .sub b { color: #f0f0f0; }
    .ente-head .sub .manca { color: #888; font-style: italic; }
    .ente-head .anno-big { font-size: 13px; color: #aaa; text-align: right; }
    .ente-head .anno-big b { font-size: 22px; color: var(--anno-a); display: block; }

    h4.sec { color: #ffb74d; font-size: 14px; margin: 22px 0 8px; border-bottom: 1px solid #444; padding-bottom: 5px; }
    h4.sec span { color: #999; font-weight: normal; font-size: 12px; }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .tile { background: #262626; border: 1px solid #3a3a3a; border-radius: 6px; padding: 10px 12px; border-top: 3px solid var(--tc, #3a3a3a); }
    .tile .k { color: #aaa; font-size: 11.5px; }
    .tile .v { font-size: 24px; font-weight: bold; color: #f0f0f0; margin: 4px 0 2px; }
    .tile .v small { font-size: 13px; color: #aaa; font-weight: normal; }
    .tile .p { font-size: 11.5px; color: #999; }

    .legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11.5px; color: #ccc; margin: 10px 0 4px; }
    .pallino { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; background: var(--sc, var(--nd)); }

    table { font-family: 'Comfortaa', cursive; border-collapse: collapse; width: 100%; font-size: 12px; }
    td, th { padding: 5px 7px; border: 1px solid #444; vertical-align: middle; }
    th { background: #2a2a2a; color: #ccc; font-weight: bold; text-align: center; font-size: 11.5px; }
    tbody tr:nth-child(even) td { background-color: #242424; }
    tbody tr:nth-child(odd) td { background-color: #1f1f1f; }
    td.c { text-align: center; }
    td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .table-scroll { overflow-x: auto; }
    .sub-n { display: block; color: #999; font-size: 10.5px; font-weight: normal; margin-top: 1px; }
    td.nome a { color: #f0f0f0; text-decoration: none; font-weight: bold; }
    td.nome a:hover { color: #ffb74d; text-decoration: underline; }
    td.nome .cf { display: block; color: #888; font-size: 10.5px; font-weight: normal; }
    tr.grp td { background: #6b6b6b !important; color: #fff; font-weight: bold; font-size: 12.5px; }
    tr.grp td span { font-weight: normal; color: #ddd; font-size: 11.5px; }
    tr.tot td { background: #303030 !important; font-weight: bold; }
    tr.persona td:first-child { border-left: 5px solid var(--sc, var(--nd)); }
    tr.persona:not(.st-na) td { background: color-mix(in srgb, var(--sc) 20%, #1e1e1e) !important; }
    .stato { font-weight: bold; white-space: nowrap; color: var(--sc, var(--nd)); }
    .bar { position: relative; height: 6px; background: #333; border-radius: 3px; overflow: hidden; min-width: 60px; margin-top: 3px; }
    .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--sc, var(--anno-a)); }
    .ok-t { color: var(--ok); font-weight: bold; }
    /* Dettaglio attività sotto ogni nominativo */
    tr.persona.apribile { cursor: pointer; }
    tr.persona.apribile td.nome::before { content: '▾ '; color: #ffb74d; }
    tr.persona.apribile.chiusa td.nome::before { content: '▸ '; }
    tr.det > td { background: #191919 !important; padding: 5px 10px 7px 30px; font-size: 11.5px; line-height: 1.55; color: #ccc; border-top: none; }
    tr.det > td:first-child { border-left: 5px solid var(--sc, #444); padding: 0; }
    .det-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 14px; }
    @media (max-width: 900px) { .det-grid { grid-template-columns: 1fr; } }
    .dh { color: #ffb74d; font-weight: bold; font-size: 11.5px; margin: 2px 0 4px; text-transform: uppercase; letter-spacing: .02em; }
    .dh span { color: #999; font-weight: normal; text-transform: none; }
    .dh.si { color: #4db6ac; } .dh.no { color: #e57373; margin-top: 8px; }
    table.dtab { font-size: 11px; width: 100%; }
    table.dtab td { border: none; border-bottom: 1px solid #2c2c2c; padding: 2px 6px 2px 0; background: transparent !important; vertical-align: top; }
    table.dtab td.dd { white-space: nowrap; color: #ddd; }
    table.dtab td.n { width: 38px; }
    table.dtab td.inf { color: #aaa; }
    table.dtab td.mm { white-space: normal; }
    table.dtab tr.prima td { color: #888; }
    .ty { display: inline-block; font-size: 10px; font-weight: bold; border-radius: 8px; padding: 0 6px; color: #1e1e1e; white-space: nowrap; }
    .ty-collettivo { background: #4fc3f7; } .ty-individuale { background: #ce93d8; } .ty-intervento { background: #ff8a65; } .ty-altro { background: #bdbdbd; }
    ul.ml { list-style: none; margin: 0; padding: 0; font-size: 11px; }
    ul.ml li { padding: 1px 0 1px 16px; position: relative; color: #ddd; }
    ul.ml li::before { position: absolute; left: 0; font-weight: bold; }
    ul.ml li.si::before { content: '✔'; color: #4db6ac; }
    ul.ml li.no::before { content: '✘'; color: #e57373; }
    ul.ml li b { color: #fff; margin-right: 3px; }
    ul.ml li i { color: #888; font-style: normal; font-size: 10.5px; }
    tr.det .vuoto { padding: 2px 0; font-size: 11px; }
    tr.det .riga b { color: #ffb74d; font-weight: bold; }
    tr.det .att { display: inline-block; margin-right: 12px; white-space: nowrap; }
    tr.det .att i { font-style: normal; color: #999; }
    tr.det .mc { display: inline-block; background: #333; border-radius: 3px; padding: 0 4px; margin: 0 2px 0 0; font-size: 10.5px; color: #eee; cursor: help; }
    tr.det .mc.manca { background: #5a2a2a; color: #f4b4b4; }
    tr.det .mc.gen { background: #3a3a3a; color: #bbb; font-style: italic; }
    ul.ml li.gen::before { content: '•'; color: #9e9e9e; }
    .sub-n.vari { color: #bdbdbd; font-style: italic; }
    details.legman { margin-top: 10px; font-size: 12px; color: #ccc; }
    details.legman summary { cursor: pointer; color: #ffb74d; }
    details.legman ul { columns: 2; margin: 6px 0 0; padding-left: 18px; }
    details.legman li { break-inside: avoid; margin-bottom: 2px; }
    .vuoto { color: #999; font-size: 12px; padding: 8px 0; }

    /* Direzione: riepilogo per Comando */
    table.riep tbody tr { cursor: pointer; }
    table.riep tbody tr:hover td { background: #3a3020 !important; }
    table.riep tr.tot { cursor: default; }
    .mini { display: flex; height: 9px; border-radius: 3px; overflow: hidden; background: #333; min-width: 90px; }
    .mini i { display: block; height: 100%; }
    .com-sez { margin-top: 26px; }
    .com-sez h4.sec { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 15px; }
    .com-sez h4.sec small { color: #bbb; font-weight: normal; font-size: 12px; }

    .note-box { background: #2a2620; border: 1px solid #5a4a20; border-radius: 4px; padding: 10px 12px; font-size: 12px; line-height: 1.6; color: #ddd; margin-top: 18px; }
    .note-box b { color: var(--warn); }
    .note-box ul { margin: 4px 0 0; padding-left: 18px; }

    /* Finestra di invio */
    .dlg-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .dlg-bg[hidden] { display: none; }
    .dlg { background: #232323; border: 1px solid var(--arancio); border-radius: 8px; padding: 18px 20px; width: 470px; max-width: 100%; box-sizing: border-box; font-size: 13px; line-height: 1.5; max-height: 92vh; overflow-y: auto; }
    .dlg h3 { margin: 0 0 6px; color: #ffb74d; font-size: 16px; }
    .dlg p { margin: 0 0 12px; color: #bbb; font-size: 12.5px; }
    .dlg label.chk { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; cursor: pointer; }
    .dlg label.chk input { accent-color: var(--arancio); margin-top: 3px; }
    .dlg label.chk small { display: block; color: #999; }
    .dlg label.chk.off { color: #777; cursor: default; }
    .dlg label.campo { display: block; margin: 4px 0 12px; }
    .dlg label.campo small { color: #999; }
    .dlg input[type=email] {
      display: block; width: 100%; box-sizing: border-box; margin-top: 4px; background: #1e1e1e; color: #f0f0f0;
      border: 1px solid #555; border-radius: 4px; padding: 7px 9px; font-family: 'Comfortaa', cursive; font-size: 13px;
    }
    .dlg input[type=email]:focus { outline: none; border-color: var(--arancio); }
    .inv-stato { min-height: 20px; font-size: 12.5px; margin-bottom: 10px; }
    .inv-stato.ok { color: var(--ok); }
    .inv-stato.ko { color: var(--ko); }
    .inv-stato.wip { color: #ffb74d; }
    .dlg-btn { display: flex; justify-content: flex-end; gap: 8px; }
    .dlg-btn button {
      background: #2a2a2a; color: #ffb74d; border: 1px solid var(--arancio); border-radius: 4px; padding: 7px 14px;
      font-family: 'Comfortaa', cursive; font-weight: bold; font-size: 12.5px; cursor: pointer;
    }
    .dlg-btn button.primario { background: var(--arancio); color: #fff; }
    .dlg-btn button:disabled { opacity: .45; cursor: default; }

    .logo { display: inline-block; width: 20px; height: 20px; vertical-align: middle; margin: -3px 6px -2px 0; }
    .logo svg { width: 100%; height: 100%; display: block; }
    .print-only { display: none; }

    /* ---------- STAMPA ---------- */
    @media print {
      :root { color-scheme: light !important; }
      @page { size: A4 landscape; margin: 6mm; }
      html, body, #content, .wrap, #report { background: #fff !important; color: #000 !important; height: auto; display: block; }
      #page-header, #filters, .dlg-bg, .solo-schermo, .ente-head { display: none !important; }
      .print-only { display: block; }
      #content { overflow: visible; padding: 0; }
      .wrap { max-width: none; }
      .table-scroll { overflow: visible !important; }
      .p-testa { text-align: center; margin-bottom: 3mm; }
      .p-testa img { height: 14mm; }
      .p-testa .e { font-weight: bold; font-size: 12px; line-height: 1.35; }
      .p-testa table { width: 100%; font-size: 9.5px; margin-top: 2mm; }
      .p-testa td { border: none !important; padding: 2px 6px; text-align: left; }
      .p-testa td.k { text-align: right; color: #333 !important; width: 15%; }
      .p-testa td.firma { border-bottom: 1px solid #000 !important; }
      table { font-size: 8.5px; }
      td, th { border: 1px solid #000 !important; color: #000 !important; background: #fff !important; padding: 2px 4px; }
      th { background: #eee !important; }
      tr.grp td { background: #999 !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      tr.persona:not(.st-na) td { background: var(--sc) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      tr.det > td { background: #fff !important; color: #000 !important; font-size: 7.5px; padding: 1px 4px 2px 12px; }
      .dh, .dh span, .dh.si, .dh.no, table.dtab td, ul.ml li, ul.ml li b, ul.ml li i, table.dtab tr.prima td { color: #000 !important; }
      .ty { background: none !important; color: #000 !important; padding: 0; border: 1px solid #999; }
      ul.ml li.si::before, ul.ml li.no::before { color: #000 !important; }
      .det-grid { grid-template-columns: 1.45fr 1fr !important; gap: 8px; }
      tr.det .mc { background: none !important; color: #000 !important; padding: 0; }
      tr.det .mc.manca { text-decoration: underline; }
      tr.persona.apribile td.nome::before { content: '' !important; }
      details.legman { display: block; } details.legman summary { color: #000; }
      details.legman ul { columns: 3; font-size: 8px; color: #000; }
      tr.grp td span, .sub-n, td.nome .cf { color: #333 !important; }
      td.nome a { color: #000 !important; }
      .stato { color: #000 !important; }
      .pallino, tr.persona td:first-child, .mini i, .bar i { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      tr.persona td:first-child { border-left: 4px solid var(--sc) !important; }
      .bar { display: none; }
      h4.sec { color: #000 !important; border-color: #000; }
      h4.sec span, h4.sec small { color: #333 !important; }
      .tile, .note-box { background: #fff !important; color: #000 !important; border-color: #999 !important; }
      .tile .v, .tile .k, .tile .p { color: #000 !important; }
      .legenda { color: #000 !important; }
      tr { break-inside: avoid; }
      .com-sez { break-inside: auto; }
    }
  </style>
</head>
<body>
<header id="page-header">
  <div>
    <h1><img class="puma-icon" src="https://gesaddvvf.github.io/PUMA/images/puma.jpg" alt="PUMA">PUMA <span class="subtitle-divider">–</span> Piattaforma Unificata Monitoraggio Addestramenti</h1>
    <h2>Report collettivo per tipologia: <b id="periodo-label">—</b></h2>
    <div id="meta-info">Dati caricati: <span id="last-update">—</span></div>
  </div>
  <div id="nav-buttons">
    <button class="nav-btn" id="refresh-btn" type="button">⟳ Aggiorna</button>
    <a class="nav-btn" href="https://sites.google.com/view/pumavvf/home-page" id="btn-home">Homepage P.U.M.A.</a>

<script>
/* =====================================================================

// Elenco_Filtrato: si leggono SOLO queste colonne (e-mail e cellulare non vengono letti)

};
// Colonne con le manovre svolte: tutte quelle "Attività addestrativa svolta (…)"
const REG_MANOVRE = /attivit[àa] addestrativa svolta\s*\(/i;
// Piano_Di_Sicurezza: colonne con le manovre previste
const PIANO_MANOVRE = /^manovre\b.*previste/i;

// Corsi che hanno TUTTI (in possesso anche se non scritti in Elenco_Filtrato)
const CORSI_DI_TUTTI = ['SAF (Speleo Alpino Fluviale) Competenze primarie', 'TPSS (Tecniche di Primo Soccorso Sanitario)'];
// Corsi da contare come un altro: tipologia registrata → tipologia del libretto
const CORSI_EQUIVALENTI = { 'SAF (Speleo Alpino Fluviale) SAF1A': 'SAF (Speleo Alpino Fluviale) Competenze primarie' };

// Registrazioni individuali che in realtà sono addestramenti di gruppo: si contano come collettivi
// (cercato nelle manovre svolte e nella descrizione, es. "Addestramento provinciale di gruppo (C)")
const RE_DI_GRUPPO = /addestramento\s+provinciale\s+di\s+gruppo/i;

// Registrazioni da scartare (prove)
const NOME_NON_REALE = /\b(test\d*|prova\d*|demo|esempio|fake)\b|^x+$|^-+$|^\.+$/i;   // anche TEST1, TEST2, TEST3…
// Durata massima credibile di un'attività (ore): oltre, l'orario è considerato sbagliato
const ORE_MAX = 168;
// Duplicati in Piano_Di_Sicurezza: stesso giorno + Comando + squadra + tipologia → resta l'ultimo inserito
const FILTRA_DUPLICATI = true;

/* ===================================================================== */
const URLP = new URLSearchParams(location.search);
const DEBUG = URLP.has('debug');
const ANNO_OGGI = new Date().getFullYear();
const MESI_BREVI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const csvUrl = gid => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const isNA = v => /^#?N\/[AD]$|^#(REF|VALUE|ERROR|NAME)!?/i.test((v || '').trim());
const val = v => { const t = String(v == null ? '' : v).trim(); return isNA(t) ? '' : t; };
const letterIdx = l => l.toUpperCase().split('').reduce((n, c) => n * 26 + c.charCodeAt(0) - 64, 0) - 1;
const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function normKey(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
}
function comandoKey(s) {
  let t = (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  t = t.replace(/vigili del fuoco|v\.?v\.?f\.?|\bcomando\b|\bprovinciale\b|\bdi\b|\bdel\b|\bdella\b|\bdei\b/g, ' ');
  t = t.replace(/[^a-z0-9]/g, '');
  // "Direzione Regionale Emilia-Romagna" = "Direzione Emilia Romagna" = "Direzione Interregionale …"
  if (t.includes('direzione')) t = 'direzione' + t.replace(/direzione|interregionale|regionale/g, '');
  return t;
}
function squadraKey(s) {
  return normKey((s || '').replace(/\bsquadra\b|\bsq\.?|\bteam\b/gi, ' ')) || 'nonindicata';
}
function nomeComando(s) {
  const t = (s || '').trim();
  if (!t) return '';
  if (/^(comando|direzione)/i.test(t)) return t;
  return 'Comando ' + t;
}

// "15/01/2026", "15/01/2026 08:30:00", "2026-01-15T08:30", "Date(2026,0,15,8,30,0)"
function parseDataOra(v) {
  const t = (v || '').trim();
  let m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[\sT,]+(\d{1,2})[:.](\d{2})(?:[:.](\d{2}))?)?/);
  if (m) {
    const y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
    return { d: new Date(y, +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)), ora: m[4] != null };
  }
  m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[\sT]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) return { d: new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)), ora: m[4] != null };
  m = t.match(/Date\((\d{4}),(\d{1,2}),(\d{1,2})(?:,(\d{1,2}),(\d{1,2})(?:,(\d{1,2}))?)?/);
  if (m) return { d: new Date(+m[1], +m[2], +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)), ora: m[4] != null };
  return null;
}
const parseData = v => { const r = parseDataOra(v); return r ? new Date(r.d.getFullYear(), r.d.getMonth(), r.d.getDate()) : null; };
const giornoKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtData = d => d.toLocaleDateString('it-IT', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtOra = d => d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

// Ore tra inizio e fine; null se mancano gli orari o la durata non è credibile
function oreTra(inizio, fine) {
  const a = parseDataOra(inizio), b = parseDataOra(fine);
  if (!a || !b || !a.ora || !b.ora) return null;
  const h = (b.d - a.d) / 3600000;
  return h > 0 && h <= ORE_MAX ? h : null;
}
// Ore in formato hh:mm, come nel libretto (12:00, 108:00)
function fmtHM(h) {
  if (h == null) return '—';
  const m = Math.round(h * 60);
  return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
}
const fmtH = h => h == null ? '—' : fmtHM(h) + ' h';

// "Ore Minime (in giorni)": durata di Google Sheets → 1 = 24 ore. Accetta anche "36:00:00".
function parseOreMin(v) {
  const t = val(v);
  if (!t) return null;
  let m = t.match(/^(\d+):(\d{2})(?::(\d{2}))?$/);
  if (m) return +m[1] + +m[2] / 60 + (m[3] ? +m[3] / 3600 : 0);
  m = t.replace(',', '.').match(/-?\d+(\.\d+)?/);
  if (!m) return null;
  const n = parseFloat(m[0]);
  return n > 0 ? n * 24 : null;
}
// "Collettive (in %)": "50%", "50", "0,5" → 0.5
function parsePct(v) {
  const t = val(v);
  if (!t) return null;
  const m = t.replace(',', '.').match(/\d+(\.\d+)?/);
  if (!m) return null;
  let n = parseFloat(m[0]);
  if (t.includes('%') || n > 1) n = n / 100;
  return n >= 0 && n <= 1 ? n : null;
}
const siNo = v => /^(si|sì|s|true|vero|x|1|yes)$/i.test(val(v));

/* =====================================================================
   PERSONE: "COGNOME NOME - CODICE FISCALE" → nome visibile + chiave
   ===================================================================== */
function separaNome(raw) {
  const t = val(raw).replace(/\s+/g, ' ');
  const m = t.match(RE_CF);
  const cf = m ? m[0].toUpperCase() : '';
  const nome = (m ? t.replace(m[0], ' ') : t).replace(/\s*[-–|,;]\s*$/, '').replace(/^\s*[-–|,;]\s*/, '').replace(/\s+/g, ' ').trim();
  return { nome, cf };
}
let NOME_A_CF = new Map();   // nome normalizzato → chiave CF (solo se il nome è unico)
function chiavePersona(nome, cf) {
  if (cf) return 'cf:' + cf;
  const k = normKey(nome);
  const c = NOME_A_CF.get(k);
  return c && c !== '*' ? c : 'n:' + k;
}
function persona(key, nome) {
  if (!PERSONE.has(key)) PERSONE.set(key, { key, grafie: new Map(), originali: new Map(), originaleElenco: '', comandi: new Map(), qualifica: '', corsiPossesso: new Set(), corsiTxt: [], inElenco: false, att: [] });
  const p = PERSONE.get(key);
  if (nome) p.grafie.set(nome, (p.grafie.get(nome) || 0) + 1);
  return p;
}

/* =====================================================================
   DATI
   ===================================================================== */
let PERSONE = new Map();   // chiave nome → { nome, comandi: Map, att: [] }
let CORSI = [];            // righe di Formazione (un corso = una Tipologia)
let CATEGORIE = [];        // colonna Categoria di Formazione, nell'ordine del foglio
let EQUIVALENTE = new Map(); // corso → corso con cui si conta (es. SAF1A → Competenze primarie)
let DI_TUTTI = [];           // corsi in possesso di tutti
const equivalente = c => (c && EQUIVALENTE.get(c)) || c;
let LOGHI = new Map();     // nome tipologia normalizzato → SVG del logo

// Loghi delle tipologie (gli stessi della Mappa Real Time); se non si caricano la pagina funziona lo stesso
const loghiPronti = fetch(LOGHI_URL, { cache: 'no-cache' })
  .then(r => r.ok ? r.json() : {})
  .then(d => Object.values(d).forEach(l => { if (l && l.svg) { LOGHI.set(normKey(l.nome), l.svg); if (l.sigla) LOGHI.set('sigla:' + normKey(l.sigla), l.svg); } }))
  .catch(err => console.warn('Loghi non caricati:', err));
function logoHtml(nome) {
  const svg = LOGHI.get(normKey(nome)) || LOGHI.get(normKey((nome || '').replace(/\(.*?\)/g, ' ')));
  return svg ? `<span class="logo" aria-hidden="true">${svg}</span>` : '';
}
let MANOVRE = [];          // righe di Manovre_PREVISTE
let MANOVRE_N = [];        // righe (N): attività generiche, non manovre previste
let colReg = {}, colPiano = {}, colElenco = {}, diag = {};

function scaricaCsv(gid, header) {
  return new Promise((resolve, reject) => {
    Papa.parse(csvUrl(gid) + '&_=' + Date.now(), {
      download: true, header, skipEmptyLines: true,
      complete: r => resolve(r.data), error: err => reject(err)
    });
  });
}

function elaboraFormazione(rows) {
  const hi = rows.findIndex(r => r.some(c => /^sigla$/i.test((c || '').trim())));
  const head = hi >= 0 ? rows[hi].map(c => (c || '').trim()) : [];
  const ix = re => head.findIndex(h => re.test(h));
  const c = {
    sigla: ix(/^sigla$/i), tipologia: ix(/^tipologia$/i), categoria: ix(/^categoria$/i), prof: ix(/corsi\s*\(profilazione\)/i),
    delta: ix(/delta anni/i), oreMin: ix(/ore minime/i), coll: ix(/collettive/i),
    soloReg: ix(/stampa solo registro/i), sovra: ix(/sovraordinazione/i)
  };
  const g = (r, k) => c[k] >= 0 ? val(r[c[k]]) : '';
  CORSI = [];
  rows.slice(hi + 1).forEach(r => {
    const sigla = g(r, 'sigla'), tipologia = g(r, 'tipologia');
    if (!tipologia) return;
    const corso = {
      id: CORSI.length, nome: tipologia, sigla, tipologia, categoria: g(r, 'categoria') || tipologia, prof: g(r, 'prof'),
      // "Delta anni per libretto": -1 = conta anche l'anno precedente, -2 = due anni prima… ; 0 o vuoto = solo l'anno scelto
      anniPrima: Math.max(0, -(parseInt(g(r, 'delta'), 10) || 0)),
      sovra: (() => { const n = parseFloat(g(r, 'sovra').replace(',', '.')); return isNaN(n) ? 999 : n; })(),
      oreMin: parseOreMin(g(r, 'oreMin')), collPct: parsePct(g(r, 'coll')),
      soloRegistro: siNo(g(r, 'soloReg')),
      // la Sigla NON identifica il corso (NBC = NBCR 0…3): si riconosce da Tipologia e da "Corsi (Profilazione)"
      keys: new Set([normKey(tipologia), normKey(g(r, 'prof'))].filter(k => k.length >= 2)),
      previste: []
    };
    CORSI.push(corso);
  });
  // Ordine dei corsi: Categoria (nell'ordine in cui compare in Formazione), poi Livello Sovraordinazione, poi Progressivo
  const ordCat = new Map();
  CORSI.forEach(x => { const k = normKey(x.categoria); if (!ordCat.has(k)) ordCat.set(k, ordCat.size); });
  CORSI.forEach(x => { x.ordine = ordCat.get(normKey(x.categoria)) * 1e6 + Math.min(x.sovra, 999) * 1e3 + x.id; });
  CATEGORIE = [...new Set(CORSI.map(x => x.categoria))];
  const perNome = n => CORSI.find(x => normKey(x.tipologia) === normKey(n));
  EQUIVALENTE = new Map();
  Object.entries(CORSI_EQUIVALENTI).forEach(([da, a]) => { const c1 = perNome(da), c2 = perNome(a); if (c1 && c2) EQUIVALENTE.set(c1, c2); });
  DI_TUTTI = CORSI_DI_TUTTI.map(perNome).filter(Boolean);
  diag.formazione = { intestazioni: hi + 1, corsi: CORSI.length, colonne: c };
}

function corsiDaSigla(t) {
  const k = normKey(t);
  if (!k) return [];
  const perSigla = [...new Set(CORSI.filter(c => normKey(c.sigla) === k).map(equivalente))];
  if (perSigla.length) return perSigla;
  const c = corsoDaChiave(k);
  return c ? [c] : [];
}
function corsoDaChiave(k) {
  return equivalente(CORSI.find(c => c.keys.has(k))) || null;
}

// Testo di manovra confrontabile: senza la lettera finale "(A)/(B)/(C)/(N)" e senza zeri iniziali (02 = 2)
const RE_LETTERA_MANOVRA = /\s*\(([A-Za-z])\)\s*$/;
const chiaveManovra = t => normKey(String(t || '').replace(RE_LETTERA_MANOVRA, '').replace(/\b0+(\d)/g, '$1'));
const chiaveTesto = t => normKey(String(t || '').replace(/\b0+(\d)/g, '$1'));

function elaboraManovre(rows) {
  MANOVRE = []; MANOVRE_N = [];
  let senzaCorso = 0, escluse = 0;
  rows.forEach(r => {
    const a = val(r[0]), uid = val(r[1]), cod = val(r[2]), ciclo = val(r[3]), man = val(r[4]), full = val(r[5]);
    if (!man && !full) return;
    if (/associazione/i.test(a) || /^manovra$/i.test(man)) return;   // intestazione
    const testo = full || [ciclo, cod, man].filter(Boolean).join(' ');
    // Lettera finale: (N) = attività generica, non è una manovra prevista (le ore contano);
    // (C) = fatta con qualunque addestramento collettivo del corso, o se scritta in un altro addestramento
    const lettera = ((testo.match(RE_LETTERA_MANOVRA) || man.match(RE_LETTERA_MANOVRA) || [])[1] || '').toUpperCase();
    const m = {
      corsoTxt: a, uid, codice: cod, ciclo, manovra: man || testo, testo, lettera,
      kFull: chiaveTesto(testo), kBase: chiaveManovra(testo), kMan: chiaveManovra(man),
      reUid: uid && uid.length >= 2 ? new RegExp('(^|[^A-Za-z0-9])' + escRe(uid) + '($|[^A-Za-z0-9])', 'i') : null,
      corsi: corsiDaSigla(a)
    };
    if (lettera === 'N') { escluse++; MANOVRE_N.push(m); return; }
    if (m.corsi.length) m.corsi.forEach(c => c.previste.push(m)); else senzaCorso++;
    MANOVRE.push(m);
  });
  diag.manovre = { righe: MANOVRE.length, senzaCorso, escluse };
}

// Colore fisso per ogni Categoria (bordi, intestazione e righe tipologia)
const COLORI_CATEGORIA = [
  [/^saf/, '#ff9800'], [/^ssa/, '#29b6f6'], [/^usar/, '#8d6e63'], [/^tpss/, '#e53935'],
  [/^oso/, '#7e57c2'], [/^tas/, '#43a047'], [/^cfbt/, '#c2185b'], [/^nbcr/, '#fdd835'],
  [/^apr/, '#26a69a'], [/^cinofil|k9/, '#9e9d24'], [/^patentiterrestr/, '#5c6bc0'],
  [/^macchinemovimento|^mmt/, '#78909c'], [/^patentinautic/, '#00838f'],
  [/^formazionegenerale/, '#bdbdbd'], [/^varie/, '#9e9e9e']
];
function coloreCategoria(nome) {
  const k = normKey(nome);
  const c = COLORI_CATEGORIA.find(([re]) => re.test(k));
  return c ? c[1] : '#9e9e9e';
}

// Livelli del raggruppamento: Settore (es. SAF) → Categoria → Tipologia
const categoriaDi = c => c.categoria;
const settoreDi = categoriaDi;      // i requisiti sono raggruppati per Categoria (colonna C)
const tipologiaDi = c => c.tipologia;
// Testo che è una Categoria (es. "SAF (Speleo Alpino Fluviale)") e non una Tipologia
function trovaCategoria(t) {
  const k = normKey(t), k2 = senzaParentesi(t);
  if (!k) return '';
  return CATEGORIE.find(c => normKey(c) === k) || CATEGORIE.find(c => k2.length >= 2 && senzaParentesi(c) === k2) || '';
}
const senzaParentesi = t => normKey((t || '').replace(/\(.*?\)/g, ' '));

// "SAF (Speleo Alpino Fluviale), TAS (Topografia Applicata al Soccorso)" → due categorie
function splitCategorie(t) {
  return val(t).split(/\n|;|,(?![^()]*\))/).map(v => v.trim()).filter(Boolean);
}
// Categoria di intervento → categoria del libretto e settori dei requisiti
function infoCategoria(cat) {
  const label = trovaCategoria(cat) || cat;
  return { cat, label, settori: new Set([label]) };
}

// Testo di tipologia → corsi di Formazione
function trovaCorsi(testo) {
  const out = new Set();
  const t = val(testo);
  if (!t) return out;
  const tutto = corsoDaChiave(normKey(t));
  if (tutto) { out.add(tutto); return out; }
  t.split(/\n|;|,/).map(v => v.trim()).filter(Boolean).forEach(v => {
    const k = normKey(v);
    let c = corsoDaChiave(k) || corsoDaChiave(normKey(v.replace(/\(.*?\)/g, ' ')));
    if (!c) {
      let best = null, bl = 0;
      CORSI.forEach(x => x.keys.forEach(kk => { if (kk.length >= 6 && k.includes(kk) && kk.length > bl) { best = x; bl = kk.length; } }));
      c = equivalente(best);
    }
    if (c) out.add(c);
  });
  return out;
}

// Testo delle manovre svolte → manovre previste riconosciute
// testo = colonne delle manovre svolte; descrizioni = descrizione della registrazione e del Piano di Sicurezza
function trovaManovre(testo, corsiAtt, descrizioni, lista = MANOVRE) {
  const out = new Set();
  if (!testo && !descrizioni) return out;
  const nk = chiaveTesto(testo), nd = chiaveTesto(descrizioni);
  lista.forEach(m => {
    const nelleManovre = !!testo && ((m.kFull.length >= 6 && nk.includes(m.kFull)) || (m.kBase.length >= 10 && nk.includes(m.kBase)) ||
      (m.reUid && m.reUid.test(testo)) || (m.corsi.some(c => corsiAtt.has(c)) && m.kMan.length >= 6 && nk.includes(m.kMan)));
    // (C): vale anche se è scritta nella descrizione di un collettivo o di un individuale
    const nelleDescrizioni = m.lettera === 'C' && !!descrizioni && m.kBase.length >= 10 && nd.includes(m.kBase);
    if (nelleManovre || nelleDescrizioni) out.add(m);
  });
  return out;
}

function elaboraElenco(rows) {
  const head = (rows[0] || []).map(h => (h || '').trim());
  colElenco = {};
  Object.entries(COL_ELENCO).forEach(([k, re]) => { colElenco[k] = head.findIndex(h => re.test(h)); });
  PERSONE = new Map();
  NOME_A_CF = new Map();
  if (colElenco.nome < 0) { diag.elenco = { righe: rows.length, persone: 0, errore: 'colonna "Cognome Nome" non trovata' }; return; }
  const g = (r, k) => colElenco[k] >= 0 ? val(r[colElenco[k]]) : '';
  let n = 0, corsiNonTrovati = new Set();
  rows.slice(1).forEach(r => {
    const { nome, cf } = separaNome(r[colElenco.nome]);
    if (nome.length < 3 || NOME_NON_REALE.test(nome)) return;
    const key = cf ? 'cf:' + cf : 'n:' + normKey(nome);
    const nk = normKey(nome);
    if (cf) NOME_A_CF.set(nk, NOME_A_CF.has(nk) && NOME_A_CF.get(nk) !== key ? '*' : key);
    const p = persona(key, nome);
    p.inElenco = true; n++;
    if (!p.originaleElenco) p.originaleElenco = val(r[colElenco.nome]).replace(/\s+/g, ' ');
    const com = nomeComando(g(r, 'comando'));
    if (com) p.comandi.set(com, (p.comandi.get(com) || 0) + 100);   // l'Elenco vale più delle registrazioni
    if (g(r, 'qualifica')) p.qualifica = g(r, 'qualifica');
    g(r, 'corsi').split(/\n|;|,/).map(v => v.trim()).filter(Boolean).forEach(v => {
      const c = trovaCorsi(v);
      if (c.size) c.forEach(x => p.corsiPossesso.add(x));
      else { p.corsiTxt.push(v); corsiNonTrovati.add(v); }
    });
  });
  diag.elenco = { righe: rows.length - 1, persone: n, corsiNonTrovati: [...corsiNonTrovati] };
}

function elaboraPiano(piano) {
  const headers = piano.length ? Object.keys(piano[0]) : [];
  const trova = (regole, esclusi) => { for (const r of regole) { const h = headers.find(h => r.test(h) && !(esclusi && esclusi.test(h))); if (h) return h; } return null; };
  colPiano = {
    comando: trova([/organizzat/i, /^comando/i], /funzione|appartenenza/i),
    squadra: trova([/^squadra$/i, /squadra/i], /sottosquadre/i),
    tipologia: trova([/^tipologia addestramento/i, /tipologia/i]),
    inizio: trova([/giorno ed ora inizio/i, /inizio/i]),
    fine: trova([/giorno ed ora fine/i, /\bfine\b/i]),
    descr: trova([/descrizione manovre/i, /descrizione/i]),
    area: trova([/area di addestramento/i]),
    manovre: headers.filter(h => PIANO_MANOVRE.test(h))
  };
  let lista = [];
  piano.forEach((row, i) => {
    const d = colPiano.inizio ? parseData(row[colPiano.inizio]) : null;
    if (!d) return;
    const com = val(row[colPiano.comando]), tip = val(row[colPiano.tipologia]);
    if (/\btest\d*\b/i.test(com + ' ' + tip)) return;
    lista.push({
      i, data: d, giorno: giornoKey(d), comandoKey: comandoKey(com) || 'nonindicato', comando: nomeComando(com),
      squadra: val(row[colPiano.squadra]), tipologia: tip,
      inizio: val(row[colPiano.inizio]), fine: val(row[colPiano.fine]),
      ore: oreTra(row[colPiano.inizio], row[colPiano.fine]),
      descr: val(row[colPiano.descr]), area: val(row[colPiano.area]),
      manovre: colPiano.manovre.map(h => val(row[h])).filter(Boolean).join('\n')
    });
  });
  let duplicati = 0;
  if (FILTRA_DUPLICATI) {
    const ultimo = new Map();
    lista.forEach((a, i) => ultimo.set(`${a.giorno}|${a.comandoKey}|${squadraKey(a.squadra)}|${normKey(a.tipologia)}`, i));
    const tenere = new Set(ultimo.values());
    duplicati = lista.length - tenere.size;
    lista = lista.filter((a, i) => tenere.has(i));
  }
  const idx3 = new Map(), idx2 = new Map();
  lista.forEach(p => {
    push(idx2, p.giorno + '|' + p.comandoKey, p);
    if (p.squadra) push(idx3, p.giorno + '|' + p.comandoKey + '|' + squadraKey(p.squadra), p);
  });
  PIANI = lista;
  diag.piano = { righe: piano.length, validi: lista.length, duplicati };
  return { idx3, idx2 };
}

function elaboraReg(reg, pianoIdx) {
  const head = (reg[0] || []).map(h => (h || '').trim());
  colReg = {};
  Object.entries(COL_REG).forEach(([k, [lettera, re]]) => {
    const i = head.findIndex(h => re.test(h));
    colReg[k] = i >= 0 ? i : letterIdx(lettera);
  });
  // "fine" non deve prendere "Giorno ed Ora Inizio"... ma neanche altre colonne con "fine" nel testo
  const iFine = head.findIndex(h => /giorno ed ora fine/i.test(h));
  if (iFine >= 0) colReg.fine = iFine;
  const iIni = head.findIndex(h => /giorno ed ora inizio/i.test(h));
  if (iIni >= 0) colReg.inizio = iIni;
  colReg.manovre = head.map((h, i) => REG_MANOVRE.test(h) ? i : -1).filter(i => i >= 0);
  if (!colReg.manovre.length) colReg.manovre = [letterIdx('N'), letterIdx('O')];

  let righe = 0, scartate = 0, senzaData = 0, collSenzaPiano = 0, nonAttivita = 0, duplicate = 0;
  // Inserimenti duplicati: lo stesso addestramento o intervento registrato più volte dalla stessa persona
  // (stesso Piano di Sicurezza; oppure stesso giorno, orari, tipologia, Comando, squadra, numero intervento e descrizione).
  // Si conta una volta sola e resta l'ultima registrazione inviata (come nei Libretti SAF E-R).
  const idPiano = new Map(), chiaviAtt = new Map();
  const chiaveAtt = a => a.giorno + '|' + a.tipo + '|' + (a.piano && !a.diGruppo
    ? 'p' + (idPiano.has(a.piano) ? idPiano.get(a.piano) : idPiano.set(a.piano, idPiano.size).get(a.piano))
    : normKey((a.inizio && a.fine
      ? [a.inizio, a.fine, a.tipologia, a.organizzatoreRaw, a.team, a.catInt, a.numInt]   // stessi orari: correzione o reinvio
      : [a.tipologia, a.organizzatoreRaw, a.team, a.catInt, a.numInt, a.descr, a.descrInt, a.manovreTxt]).join(' ')));
  const g = (r, k) => val(r[colReg[k]]);
  reg.slice(1).forEach(r => {
    const { nome, cf } = separaNome(g(r, 'nome'));
    if (!nome && !g(r, 'cronologiche')) return;
    righe++;
    if (nome.length < 3 || NOME_NON_REALE.test(nome)) { scartate++; return; }

    // Tipo: si incrociano più colonne.
    //  D "Che cosa vuoi fare?": "2a - CONFERMA presenza addestramento collettivo odierno",
    //    "2b - REGISTRAZIONE addestramenti e interventi INDIVIDUALI", "3 - STAMPA/INVIO Registro…" (non è un'attività)
    //  I "Attività": "Addestramento" / "Intervento" (per le 2b)
    //  L tipologia individuale, P/R categoria e numero intervento
    const cosa = g(r, 'cosa'), attiv = g(r, 'attivita');
    let tipo;
    if (/collettiv/i.test(cosa)) tipo = 'collettivo';
    else if (/^intervent/i.test(attiv)) tipo = 'intervento';
    else if (/^addestr/i.test(attiv) || g(r, 'tipInd')) tipo = 'individuale';
    else if (g(r, 'numInt') || g(r, 'catInt')) tipo = 'intervento';
    else if (/stampa|invio|registro individuale/i.test(cosa)) { nonAttivita++; return; }
    else if (g(r, 'inizio') || g(r, 'descr')) tipo = 'altro';
    else if (!cosa && g(r, 'organizzatore')) tipo = 'collettivo';
    else { nonAttivita++; return; }

    // Data: collettivo "odierno" → H se è una data, altrimenti giorno di compilazione (A);
    // individuali e interventi → Giorno ed Ora Inizio (J), altrimenti A. La colonna V non si usa.
    const data = tipo === 'collettivo'
      ? (parseData(g(r, 'dataColl')) || parseData(g(r, 'inizio')) || parseData(g(r, 'cronologiche')))
      : (parseData(g(r, 'inizio')) || parseData(g(r, 'fine')) || parseData(g(r, 'dataColl')) || parseData(g(r, 'cronologiche')));
    if (!data) { senzaData++; return; }

    const a = {
      tipo, data, anno: data.getFullYear(), giorno: giornoKey(data), cosa: attiv || cosa,
      organizzatore: nomeComando(g(r, 'organizzatore')), organizzatoreRaw: g(r, 'organizzatore'), appartenenzaRaw: g(r, 'appartenenza'),
      team: g(r, 'team'), ics: g(r, 'ics'),
      attivita: g(r, 'attivita'), descr: g(r, 'descr'),
      inizio: g(r, 'inizio'), fine: g(r, 'fine'),
      ore: oreTra(g(r, 'inizio'), g(r, 'fine')), oreDa: 'registrazione',
      tipologia: '', manovreTxt: colReg.manovre.map(i => val(r[i])).filter(Boolean).join('\n'),
      catInt: g(r, 'catInt'), descrInt: g(r, 'descrInt'), numInt: g(r, 'numInt'),
      piano: null, pianiMultipli: false
    };

    if (tipo === 'collettivo') {
      const k2 = a.giorno + '|' + comandoKey(g(r, 'organizzatore'));
      let cand = (a.team && pianoIdx.idx3.get(k2 + '|' + squadraKey(a.team))) || pianoIdx.idx2.get(k2) || [];
      if (cand.length > 1 && a.attivita) {
        const ka = normKey(a.attivita);
        const f = cand.filter(p => normKey(p.tipologia).includes(ka) || ka.includes(normKey(p.tipologia)));
        if (f.length) cand = f;
      }
      if (cand.length) {
        const p = cand[cand.length - 1];
        a.piano = p; a.pianiMultipli = cand.length > 1;
        a.tipologia = p.tipologia;
        if (a.ore == null && p.ore != null) { a.ore = p.ore; a.oreDa = 'piano'; a.inizio = p.inizio; a.fine = p.fine; }
        if (p.manovre) a.manovreTxt = [a.manovreTxt, p.manovre].filter(Boolean).join('\n');
        if (!a.descr) a.descr = p.descr;
      } else {
        collSenzaPiano++;
        a.tipologia = a.attivita;
      }
    } else if (tipo === 'individuale') {
      a.tipologia = g(r, 'tipInd') || a.attivita;
    } else if (tipo === 'altro') {
      a.tipologia = g(r, 'tipInd') || a.attivita;
    }

    // Corsi di Formazione collegati
    a.corsi = trovaCorsi(a.tipologia);
    a.corsiTip = new Set(a.corsi);   // corsi dalla sola tipologia (per il libretto)
    // Interventi: categorie accorpate ("SAF (...), TAS (...)") divise una per una
    a.cats = tipo === 'intervento' ? splitCategorie(a.catInt).map(infoCategoria) : [];
    a.manovre = trovaManovre(a.manovreTxt, a.corsi, [a.descr, a.piano && a.piano.descr].filter(Boolean).join('\n'));
    // una manovra riconosciuta collega l'attività al suo corso solo se la sigla è di un corso solo
    if (!a.corsi.size) a.manovre.forEach(m => { if (m.corsi.length === 1 && tipo !== 'intervento') a.corsi.add(m.corsi[0]); });
    if (!a.corsi.size && tipo !== 'intervento') a.categoria = trovaCategoria(a.tipologia);
    // "Addestramento provinciale di gruppo": è un addestramento di gruppo, conta come collettivo (come nel Report individuale)
    if ((tipo === 'individuale' || tipo === 'altro') && RE_DI_GRUPPO.test(a.manovreTxt + '\n' + a.descr)) {
      a.tipo = 'collettivo';
      a.diGruppo = true;
    }
    // (N): attività generiche riconosciute (non sono manovre previste)
    a.generiche = tipo === 'intervento' ? new Set() : trovaManovre(a.manovreTxt, a.corsi, '', MANOVRE_N);
    // (C) (es. "Addestramento provinciale di gruppo"): fatta da ogni addestramento collettivo del corso
    if (a.tipo === 'collettivo') a.corsi.forEach(c => c.previste.forEach(m => { if (m.lettera === 'C') a.manovre.add(m); }));

    const p = persona(chiavePersona(nome, cf), nome);
    const orig = g(r, 'nome').replace(/\s+/g, ' ');
    p.originali.set(orig, (p.originali.get(orig) || 0) + 1);
    const app = nomeComando(g(r, 'appartenenza'));
    if (app) p.comandi.set(app, (p.comandi.get(app) || 0) + 1);
    const kDup = p.key + '#' + chiaveAtt(a), giaVista = chiaviAtt.get(kDup);
    if (giaVista) {
      duplicate++; p.duplicate = (p.duplicate || 0) + 1;
      a.duplicati = (giaVista.duplicati || 1) + 1;   // quante volte è stato registrato
      p.att[p.att.indexOf(giaVista)] = a;
    } else p.att.push(a);
    chiaviAtt.set(kDup, a);
  });
  const piuFrequente = m => [...m.entries()].sort((x, y) => y[1] - x[1])[0]?.[0] || '';
  PERSONE.forEach(p => { p.nome = piuFrequente(p.grafie); p.comando = piuFrequente(p.comandi); DI_TUTTI.forEach(c => p.corsiPossesso.add(c)); });
  const perTipo = {};
  PERSONE.forEach(p => p.att.forEach(a => { perTipo[a.tipo] = (perTipo[a.tipo] || 0) + 1; }));
  diag.reg = { righe, scartate, senzaData, collSenzaPiano, nonAttivita, duplicate, perTipo, persone: PERSONE.size };
}

/* =====================================================================
   CALCOLI (come nel Report individuale)
   ===================================================================== */
const nonIntervento = a => a.tipo !== 'intervento';
function somma(lista) {
  const giorni = new Set(lista.map(a => a.giorno));
  return {
    n: lista.length, giorni: giorni.size,
    ore: lista.reduce((s, a) => s + (a.ore || 0), 0),
    senzaOre: lista.filter(a => a.ore == null).length
  };
}

function riepilogoAnno(att, y) {
  const lista = att.filter(a => a.anno === y);
  const add = lista.filter(nonIntervento);
  return {
    tot: somma(add),
    coll: somma(add.filter(a => a.tipo === 'collettivo')),
    ind: somma(add.filter(a => a.tipo === 'individuale')),
    altro: somma(add.filter(a => a.tipo === 'altro')),
    int: somma(lista.filter(a => a.tipo === 'intervento')),
    mesi: Array.from({ length: 12 }, (_, m) => add.filter(a => a.data.getMonth() === m).reduce((s, a) => s + (a.ore || 0), 0))
  };
}

function riepilogoCorsi(p, y) {
  const att = p.att;
  const coinvolti = new Set(p.corsiPossesso);
  const inFinestra = (a, c) => a.anno <= y && a.anno >= y - c.anniPrima;
  att.forEach(a => a.corsi.forEach(c => { if (inFinestra(a, c)) coinvolti.add(c); }));
  return [...coinvolti].map(c => {
    const nel = att.filter(a => a.corsi.has(c) && inFinestra(a, c));
    const add = nel.filter(nonIntervento);
    const coll = add.filter(a => a.tipo === 'collettivo');
    const ore = add.reduce((s, a) => s + (a.ore || 0), 0);
    const oreColl = coll.reduce((s, a) => s + (a.ore || 0), 0);
    const oreAnno = add.filter(a => a.anno === y).reduce((s, a) => s + (a.ore || 0), 0);
    const fatte = new Map();
    // le manovre (C) valgono in qualunque addestramento della persona nel periodo (collettivo o individuale,
    // anche di un'altra tipologia); le altre solo nelle attività del corso
    const nelCorso = new Set(nel);
    att.filter(a => a.tipo !== 'intervento' && inFinestra(a, c)).forEach(a => a.manovre.forEach(m => {
      if (!m.corsi.includes(c)) return;
      if (!nelCorso.has(a) && m.lettera !== 'C') return;
      const f = fatte.get(m) || { n: 0, ultima: null };
      f.n++; if (!f.ultima || a.data > f.ultima) f.ultima = a.data;
      fatte.set(m, f);
    }));
    // addestramenti del corso senza nessuna manovra prevista riconosciuta (anche quelli con sole voci (N)):
    // "addestramenti senza documentazione correlata" (in tutte le tipologie con manovre previste)
    const vari = c.previste.length ? add.filter(a => ![...a.manovre].some(m => m.corsi.includes(c))).sort((a, b) => a.data - b.data) : [];
    const collMin = c.oreMin != null && c.collPct ? c.oreMin * c.collPct : null;
    let stato = 'nd';
    if (c.oreMin != null) stato = ore >= c.oreMin - 1e-6 && (collMin == null || oreColl >= collMin - 1e-6) ? 'ok' : 'ko';
    return {
      c, ore, oreColl, oreAnno, collMin, stato,
      giorni: new Set(add.map(a => a.giorno)).size,
      nAtt: add.length, nInt: nel.length - add.length, fatte, vari,
      dal: y - c.anniPrima, possesso: p.corsiPossesso.has(c)
    };
  }).sort((a, b) => a.c.ordine - b.c.ordine);
}

// Settori: corsi + ore di addestramento e interventi dell'anno
// Requisiti per Categoria (es. SAF):
//   ore svolte   = addestramenti della categoria + interventi della categoria (come "Totale Categoria" del libretto)
//   ore richieste = somma delle "Ore Minime" dei corsi in possesso della categoria
//   collettive   = somma delle quote collettive richieste dai corsi in possesso
//   periodo      = il più lungo tra i "Delta anni" dei corsi in possesso (es. AVANZATO -1 → anche l'anno prima)
function riepilogoSettori(att, corsi, y) {
  const ordine = new Map();
  [...CORSI].sort((a, b) => a.ordine - b.ordine).forEach(c => { const s = settoreDi(c); if (!ordine.has(s)) ordine.set(s, c.ordine); });
  const settori = new Map();
  const get = s => { if (!settori.has(s)) settori.set(s, { nome: s, ordine: ordine.has(s) ? ordine.get(s) : 9e9, righe: [] }); return settori.get(s); };
  corsi.forEach(r => get(settoreDi(r.c)).righe.push(r));
  // categorie con soli interventi o attività senza corso
  att.forEach(a => {
    if (a.anno > y) return;
    if (a.tipo === 'intervento') a.cats.forEach(i => { if (a.anno === y) get(i.label); });
    else if (!a.corsi.size && a.categoria && a.anno === y) get(a.categoria);
  });
  const ore = l => l.reduce((t, a) => t + (a.ore || 0), 0);
  return [...settori.values()].map(st => {
    const req = st.righe.filter(r => r.possesso && r.c.oreMin);
    // ogni attività conta nel periodo della sua tipologia (Delta anni), come nel libretto; interventi: solo l'anno scelto
    const anniPrima = Math.max(0, ...st.righe.map(r => r.c.anniPrima));
    const dal = y - anniPrima;
    const base = a => [...(a.corsiTip.size ? a.corsiTip : a.corsi)].filter(c => settoreDi(c) === st.nome);
    const add = att.filter(a => {
      if (a.tipo === 'intervento' || a.anno > y) return false;
      const cc = base(a);
      if (cc.length) return cc.some(c => a.anno >= y - c.anniPrima);
      return !a.corsi.size && a.categoria === st.nome && a.anno === y;
    });
    const int = att.filter(a => a.tipo === 'intervento' && a.anno === y && a.cats.some(i => i.label === st.nome));
    const oreAdd = ore(add), oreInt = ore(int), oreColl = ore(add.filter(a => a.tipo === 'collettivo'));
    const tot = oreAdd + oreInt;
    const minTot = req.reduce((t, r) => t + r.c.oreMin, 0);
    const collMinTot = req.reduce((t, r) => t + (r.c.collPct ? r.c.oreMin * r.c.collPct : 0), 0);
    let stato = 'nd';
    if (minTot > 0) stato = tot >= minTot - 1e-6 && oreColl >= collMinTot - 1e-6 ? 'ok' : 'ko';
    const manca = Math.max(0, minTot - tot, collMinTot - oreColl);
    const anno = l => ore(l.filter(a => a.anno === y));
    const senzaTip = add.filter(a => !a.corsi.size);
    return { ...st, req, anniPrima, dal, add, int, senzaTip, oreSenzaTip: ore(senzaTip), oreAdd, oreInt, oreColl, tot, minTot, collMinTot, stato, manca,
      totAnno: anno(add) + anno(int) };
  }).sort((a, b) => a.ordine - b.ordine || a.nome.localeCompare(b.nome, 'it'));
}

  const n = parseInt(m[1], 16), c = [n >> 16, (n >> 8) & 255, n & 255];
  return '#' + c.map(v => Math.round(v * quota + 255 * (1 - quota)).toString(16).padStart(2, '0')).join('');

function elaboraResponsabili(rows) {
  RESP = new Map();
  if (!rows || rows.length < 4) { diag.resp = { righe: rows ? rows.length : 0, errore: 'tabella non letta' }; return; }
  const iHead = rows.findIndex(r => /^ruolo$/i.test(val(r[0])));
  if (iHead < 0) { diag.resp = { righe: rows.length, errore: 'riga "Ruolo / Settore" non trovata' }; return; }
  const enti = rows[iHead].map(v => val(v));
  const dirRow = iHead >= 2 ? rows[iHead - 2] : [];
  enti.forEach((e, j) => {
    if (j < 2 || !e) return;
    const k = comandoKey(e), d = val(dirRow[j]);
    if (!NOME_ENTE.has(k)) NOME_ENTE.set(k, e);
    if (d && /^direzione/i.test(d) && !k.startsWith('direzione')) DIREZIONE_DI.set(k, d);
  });
  let n = 0;
  rows.slice(iHead + 1).forEach(r => {
    const ruolo = val(r[0]), settore = val(r[1]);
    const rk = /provinciale/i.test(ruolo) ? 'rop' : /regionale/i.test(ruolo) ? 'ror' : /funzionario/i.test(ruolo) ? 'fds' : /staff/i.test(ruolo) ? 'staff' : '';
    if (!rk || !settore) return;
    enti.forEach((e, j) => {

      const nomi = val(r[j]).split(/\n|;/).map(t => t.trim()).filter(Boolean);
      if (nomi.length) { RESP.set(`${rk}|${normKey(settore)}|${comandoKey(e)}`, nomi); n++; }

  diag.resp = { righe: rows.length, celle: n };
}

function schedaPersona(p, c, y) {
  const r = riepilogoCorsi(p, y).find(x => x.c === c);
  const cat = c.categoria;
  const con = p.corsiPossesso.has(c);
  const altri = [...p.corsiPossesso].filter(x => x !== c && x.categoria === cat && !(DI_TUTTI.includes(x) && !x.oreMin)).sort((a, b) => a.ordine - b.ordine);
  const v = valutaTipologia(p.att, r, c, y, con);
  const s = Object.assign(v, { p, c, r, con, altri, attivo: !!(r && r.nAtt > 0), nAtt: r ? r.nAtt : 0, dal: y - c.anniPrima });
  // Dettaglio: attività della tipologia nel periodo, interventi del settore, manovre previste mancanti
  s.attivita = p.att.filter(a => a.tipo !== 'intervento' && a.corsi.has(c) && a.anno <= y && a.anno >= y - c.anniPrima).sort((a, b) => a.data - b.data);
  s.interventi = v.intv.slice().sort((a, b) => a.data - b.data);
  s.mancanti = c.previste.filter(m => !(r && r.fatte.has(m)));
  s.fatteList = r ? [...r.fatte.keys()] : [];
  s.vari = r ? r.vari : [];
  return s;
}

// Stato di una tipologia (corso) per un nominativo: stessa logica nel Report Individuale e nel Report Collettivo
// (foglio Stampa_Report_Collettivo, colonna M: R, Ar, A, V)
//   ore svolte = addestramenti della tipologia nel periodo + interventi del settore (se INTERVENTI_NEL_TOTALE)
//   na = senza corso · ko = sotto il 75% · quasi = tra il 75% e il 100% · man = da verificare · ok = idoneo
function valutaTipologia(att, r, c, y, con) {
  const cat = c.categoria;
  // interventi del settore nel periodo della tipologia (gli interventi non hanno tipologia)
  const intv = att.filter(a => a.tipo === 'intervento' && a.anno <= y && a.anno >= y - c.anniPrima && a.cats.some(i => i.label === cat));
  const oreInt = intv.reduce((t, a) => t + (a.ore || 0), 0);
  const ore = r ? r.ore : 0, oreColl = r ? r.oreColl : 0;
  const v = {
    intv, int: oreInt, nInt: intv.length, coll: oreColl, ind: ore - oreColl, oreColl,
    tot: ore + (INTERVENTI_NEL_TOTALE ? oreInt : 0),
    minTot: con && c.oreMin ? c.oreMin : 0,
    collMin: con && c.oreMin && c.collPct ? c.oreMin * c.collPct : 0,
    fatte: r ? r.fatte.size : 0, prev: c.previste.length, motivi: []
  };
  v.pct = v.minTot ? v.tot / v.minTot : null;
  const eps = 1e-4, indMin = v.minTot - v.collMin;
  if (!con) v.stato = 'na';
  else if (v.tot < v.minTot - eps) v.stato = v.tot < v.minTot * SOGLIA_QUASI - eps ? 'ko' : 'quasi';
  else {
    if (v.ind + (INTERVENTI_NEL_TOTALE ? v.int : 0) < indMin - eps) v.motivi.push('individuali sotto ' + fmtHM(indMin));
    if (v.coll < v.collMin - eps) v.motivi.push('collettive sotto ' + fmtHM(v.collMin));
    if (v.prev && v.fatte < v.prev) v.motivi.push(`mancano ${v.prev - v.fatte} manovre`);
    v.stato = v.motivi.length ? 'man' : 'ok';
  }
  return v;
}

// Personale di un Comando (o della Direzione come ente): con il corso / senza corso
function personaleEnte(k, c, y, tutti) {
  const schede = (PER_ENTE.get(k) || []).map(p => schedaPersona(p, c, y));
  const ord = (a, b) => a.p.nome.localeCompare(b.p.nome, 'it');
  const con = schede.filter(s => s.con).sort(ord);
  const senza = schede.filter(s => !s.con && s.attivo).sort(ord);
  const altri = tutti ? schede.filter(s => !s.con && !s.attivo).sort(ord) : [];
  const conta = Object.fromEntries(Object.keys(STATI).map(x => [x, con.filter(s => s.stato === x).length]));
  const l = [...con, ...senza];
  const vari = l.reduce((t, s) => t + s.vari.length, 0);
  const ore = { coll: l.reduce((t, s) => t + s.coll, 0), ind: l.reduce((t, s) => t + s.ind, 0), int: l.reduce((t, s) => t + s.int, 0), tot: l.reduce((t, s) => t + s.tot, 0) };
  return { k, nome: NOME_ENTE.get(k) || k, con, senza, altri, conta, totale: schede.length, ore, vari,
    collettivi: collettiviOrganizzati(k, c, y), collPrec: collettiviOrganizzati(k, c, y - 1) };
}
// Addestramenti collettivi della tipologia organizzati dall'ente (Piani di Sicurezza)
function collettiviOrganizzati(k, c, y) {
  const l = PIANI.filter(p => p.data.getFullYear() === y && p.comandoKey === k && corsiPiano(p).has(c));
  return { n: l.length, ore: l.reduce((t, p) => t + (p.ore || 0), 0) };
}

  if (!p.corsi) p.corsi = trovaCorsi(p.tipologia);

}

    if (state.ente && !state.ente.startsWith('direzione')) state.ente = comandoKey(direzioneDi(state.ente) || '');
    ENTI_LISTA = dirs.map(d => { const k = comandoKey(d); return { k, nome: d, gruppo: 'Direzioni', n: nPers(k) + comandiDi(d).reduce((t, c) => t + nPers(c), 0) }; });
  } else {
    // Comandi raggruppati per Direzione; anche la Direzione come ente (il suo personale)
    const enti = new Set([...DIREZIONE_DI.keys(), ...PER_ENTE.keys()]);
    Object.keys(ORGANIGRAMMA).forEach(d => enti.add(comandoKey(d)));
    if (state.ente && !enti.has(state.ente)) state.ente = '';
    ENTI_LISTA = [...enti].map(k => ({ k, nome: NOME_ENTE.get(k) || k, gruppo: direzioneDi(k) || 'Altri enti', n: nPers(k) }))
      .sort((a, b) => a.nome.localeCompare(b.nome, 'it'));   // ordine alfabetico
  }
  enteInput.placeholder = state.tipo === 'direzione' ? 'Scrivi la Direzione…' : 'Scrivi il Comando…';
  enteInput.value = state.ente ? (NOME_ENTE.get(state.ente) || '') : '';
  enteInput.disabled = false;
}

/* Casella Comando / Direzione: si scrive, compare l'elenco filtrato */
let dropVoci = [], dropAtt = -1;
const chiaveRicerca = t => normKey(String(t || '').replace(/^\s*(comando|direzione)\b/i, ''));
function apriDrop(tutto) {
  if (enteInput.disabled) return;
  const scelto = state.ente && enteInput.value === (NOME_ENTE.get(state.ente) || '');
  const q = tutto || scelto ? '' : chiaveRicerca(enteInput.value);
  dropVoci = ENTI_LISTA.filter(e => !q || chiaveRicerca(e.nome).includes(q) || normKey(e.gruppo).includes(q));
  // prima chi inizia con il testo scritto
  if (q) dropVoci.sort((a, b) => (chiaveRicerca(b.nome).startsWith(q) - chiaveRicerca(a.nome).startsWith(q)) || ENTI_LISTA.indexOf(a) - ENTI_LISTA.indexOf(b));
  dropAtt = dropVoci.length === 1 || (q && dropVoci.length) ? 0 : -1;
  let html = '';
  dropVoci.forEach((e, i) => {
    html += `<div class="opt${e.n ? '' : ' zero'}${e.k === state.ente ? ' sel' : ''}${i === dropAtt ? ' act' : ''}" role="option" data-i="${i}">${esc(e.nome)}<small>${e.n} in PUMA${state.tipo === 'comando' && !e.k.startsWith('direzione') ? ' · ' + esc(e.gruppo.replace(/^Direzione\s+/, '')) : ''}</small></div>`;
  });
  enteDrop.innerHTML = html || '<div class="vuoto">Nessun ente trovato</div>';
  enteDrop.hidden = false;
  enteInput.setAttribute('aria-expanded', 'true');
  if (!q) { const s = enteDrop.querySelector('.opt.sel'); if (s) s.scrollIntoView({ block: 'center' }); else enteDrop.scrollTop = 0; }
  else enteDrop.scrollTop = 0;
}
function chiudiDrop() { enteDrop.hidden = true; enteInput.setAttribute('aria-expanded', 'false'); }
function evidenzia(i) {
  const opts = enteDrop.querySelectorAll('.opt');
  if (!opts.length) return;
  dropAtt = Math.max(0, Math.min(opts.length - 1, i));
  opts.forEach((o, j) => o.classList.toggle('act', j === dropAtt));
  opts[dropAtt].scrollIntoView({ block: 'nearest' });
}
function scegliEnte(e) {
  state.ente = e ? e.k : '';
  enteInput.value = e ? e.nome : '';
  chiudiDrop();
  disegna();
  document.getElementById('content').scrollTop = 0;
}
enteDrop.addEventListener('mousedown', ev => {
  const o = ev.target.closest('.opt');
  if (!o) return;
  ev.preventDefault();
  scegliEnte(dropVoci[+o.dataset.i]);
  enteInput.blur();
});
enteInput.addEventListener('focus', () => { enteInput.select(); apriDrop(true); });
enteInput.addEventListener('click', () => { if (enteDrop.hidden) apriDrop(true); });
enteInput.addEventListener('input', () => apriDrop(false));
enteInput.addEventListener('keydown', ev => {
  if (ev.key === 'ArrowDown') { ev.preventDefault(); if (enteDrop.hidden) apriDrop(true); evidenzia(dropAtt + 1); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); evidenzia(dropAtt - 1); }
  else if (ev.key === 'Escape') { chiudiDrop(); enteInput.value = state.ente ? NOME_ENTE.get(state.ente) || '' : ''; }
  else if (ev.key === 'Enter') {
    ev.preventDefault();
    if (!enteDrop.hidden && dropAtt >= 0 && dropVoci[dropAtt]) { scegliEnte(dropVoci[dropAtt]); enteInput.blur(); }
  }
});
// uscendo senza scegliere, torna il nome dell'ente già scelto
enteInput.addEventListener('blur', () => setTimeout(() => { chiudiDrop(); enteInput.value = state.ente ? NOME_ENTE.get(state.ente) || '' : ''; }, 150));
document.getElementById('ente-x').addEventListener('click', () => { scegliEnte(null); enteInput.focus(); });

function preparaAnni() {
  const anni = new Set([ANNO_OGGI]);
  PERSONE.forEach(p => p.att.forEach(a => { if (a.anno >= 2020 && a.anno <= ANNO_OGGI + 1) anni.add(a.anno); }));
  const lista = [...anni].sort((a, b) => b - a);
  if (!lista.includes(state.anno)) state.anno = ANNO_OGGI;
  annoSelect.innerHTML = lista.map(y => `<option value="${y}"${y === state.anno ? ' selected' : ''}>${y}</option>`).join('');
}

function aggiornaUrl() {
  const q = new URLSearchParams(), c = corsoScelto();
  if (state.tipo === 'direzione') q.set('tipo', 'direzione');

/* ---------------- dettaglio delle attività di un nominativo ---------------- */
// Manovra in breve: "III-26" (Ciclo-codice); il nome intero nel suggerimento e nella legenda
const codiceMan = m => m.ciclo && m.codice ? `${m.ciclo}-${m.codice}` : (m.codice || m.uid || m.manovra);
const nomeMan = m => `${m.ciclo ? m.ciclo + ' Ciclo - ' : ''}${m.codice ? m.codice + ' - ' : ''}${m.manovra}`;
const dataBreve = d => d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: '2-digit' });
const enteBreve = t => String(t || '').replace(/^\s*comando\s+(vv\.?\s*f\.?\s*)?(di\s+)?/i, '').replace(/^\s*direzione\s+(regionale\s+)?/i, 'Dir. ');
const TIPO_ATT = { collettivo: 'Collettivo', individuale: 'Individuale', intervento: 'Intervento', altro: 'Altro' };
// dettaglio aperto: come la casella "Dettaglio attività", salvo i nominativi aperti/chiusi con un clic
const dettaglioAperto = s => state.dettaglio !== state.invertite.has(s.p.key);
const haDettaglio = s => s.attivita.length || s.interventi.length || s.fatteList.length || s.vari.length || (s.con && s.mancanti.length);
// manovre del corso riconosciute in un'attività
const manovreAtt = (a, c) => [...a.manovre].filter(m => m.corsi.includes(c));
const ordManovre = (a, b) => (a.ciclo || '').localeCompare(b.ciclo || '') || (parseInt(a.codice, 10) || 0) - (parseInt(b.codice, 10) || 0);

// Dati del dettaglio, uguali per pagina e PDF:
//   attività svolte (collettivi, individuali, interventi) in ordine di data
//   manovre previste: fatte (quante volte, ultima data) / da fare
function datiDettaglio(s) {
  const att = [...s.attivita, ...s.interventi].sort((a, b) => a.data - b.data).map(a => {
    const tipo = a.tipo === 'collettivo' || a.tipo === 'individuale' || a.tipo === 'intervento' ? a.tipo : 'altro';
    let info = '';
    if (tipo === 'collettivo' && a.diGruppo) info = 'di gruppo (registrato come individuale)' + (a.organizzatore || a.appartenenzaRaw ? ' · ' + enteBreve(a.organizzatoreRaw || a.appartenenzaRaw) : '');
    else if (tipo === 'collettivo') info = enteBreve(a.organizzatoreRaw || a.organizzatore) + (a.team ? ' · sq. ' + a.team : '');
    else if (tipo === 'intervento') info = [a.numInt ? 'n. ' + a.numInt : '', (a.descrInt || '').slice(0, 70)].filter(Boolean).join(' · ');
    else info = (a.descr || a.tipologia || '').replace(/\s+/g, ' ').slice(0, 70);
    // attività generica: nessuna manovra prevista; le voci (N) riconosciute come descrizione
    const vario = s.vari.includes(a);
    const generiche = vario ? [...(a.generiche || [])].map(m => m.manovra.replace(RE_LETTERA_MANOVRA, '')) : [];
    if (a.duplicati > 1) info += ` · registrato ${a.duplicati} volte (contato una)`;
    return { data: dataBreve(a.data), prima: a.anno !== state.anno, tipo, ore: a.ore == null ? '—' : fmtHM(a.ore), info, vario, generiche,
      descr: String(a.descr || (a.piano && a.piano.descr) || a.tipologia || '').replace(/\s+/g, ' ').slice(0, 80), manovre: tipo === 'intervento' ? [] : manovreAtt(a, s.c).sort(ordManovre) };
  });
  const fatte = (s.r ? [...s.r.fatte.entries()] : []).map(([m, f]) => ({ m, n: f.n, ultima: f.ultima })).sort((a, b) => ordManovre(a.m, b.m));
  const daFare = s.con ? s.mancanti.slice().sort(ordManovre) : [];
  const vari = att.filter(a => a.vario);
  return { att, fatte, daFare, vari };
}
function dettaglioHtml(s) {
  const D = datiDettaglio(s);
  const mc = m => `<span class="mc" title="${esc(nomeMan(m))}">${esc(codiceMan(m))}</span>`;
  let h = `<div class="det-grid"><div class="det-col">`;

    h += `<ul class="ml">${D.vari.map(a => `<li class="gen"><b>${esc(a.data)}</b> ${esc(a.generiche.length ? a.generiche.join(', ') : a.descr || a.info || TIPO_ATT[a.tipo])} <i>${esc(TIPO_ATT[a.tipo])} · ${esc(a.ore)}</i></li>`).join('')}</ul>`;
  }
  return h + `</div></div>`;
}

function testoDettaglio(s) {

function requisitoTxt(c, y) {
  if (!c.oreMin) return 'nessun minimo di ore';
  return `${fmtHM(c.oreMin)} h${c.anniPrima ? ` in ${c.anniPrima + 1} anni (${periodoDi(c, y)})` : ` nel ${y}`}${c.collPct ? `, di cui ${Math.round(c.collPct * 100)}% collettive` : ''}${c.previste.length ? ` · ${c.previste.length} manovre previste` : ''}`;
}
function noteHtml(c, y) {
  return `<div class="note-box solo-schermo"><b>Come si calcola</b><ul>
    <li>Requisito di ${esc(c.tipologia)}: ${requisitoTxt(c, y)}.</li>
    <li>Ore svolte = addestramenti collettivi e individuali di questa tipologia${INTERVENTI_NEL_TOTALE ? ` + interventi del settore ${esc(c.categoria)}` : ''}, nel periodo ${periodoDi(c, y)}. Gli interventi non hanno una tipologia: si contano per settore, come nel Libretto.</li>
    <li>Colori e stato come nel Report Collettivo del foglio: <b style="color:${STATI.ko.c}">Non idoneo</b> sotto il 75% delle ore previste · <b style="color:${STATI.quasi.c}">75% delle ore previste</b> tra il 75% e il 100% · <b style="color:${STATI.man.c}">Verificare</b> ore raggiunte ma individuali (con interventi) o collettive sotto la loro quota, oppure mancano manovre previste · <b style="color:${STATI.ok.c}">Idoneo</b> tutto raggiunto. OK% = ore svolte / ore previste.</li>
    <li>Manovre previste: quelle con (N) non sono manovre previste ma attività generiche (le ore contano); quelle con (C) (es. «Addestramento provinciale di gruppo») risultano fatte con ogni addestramento collettivo della tipologia, o se scritte in un altro addestramento collettivo o individuale. Le registrazioni individuali «Addestramento provinciale di gruppo» contano come collettive. In ogni tipologia con manovre previste, gli addestramenti senza nessuna manovra prevista riconosciuta sono segnalati come «addestramenti senza documentazione correlata».</li>
    <li>Con corso = il corso è tra quelli in possesso in Elenco_Filtrato${DI_TUTTI.includes(c) ? ' (questa tipologia la hanno tutti)' : ''}. Il Comando di ognuno è quello di appartenenza. Clic su un nominativo per il suo report individuale.</li>
  </ul></div>`;
}

function disegna() {
  if (!caricato) return;
  aggiornaUrl();
  const y = state.anno, c = corsoScelto(), k = state.ente;
  const nomeEnte = NOME_ENTE.get(k) || '';
  document.getElementById('periodo-label').textContent = [k ? nomeEnte : '', c ? c.tipologia : '', y].filter(Boolean).join(' · ');
  document.title = k ? `P.U.M.A. - Report collettivo ${nomeEnte} ${c ? SIGLA_BREVE(c) : ''} ${y}` : 'P.U.M.A. - Report collettivo';
  ULTIMO = null;
  [printBtn, pdfBtn, mailBtn].forEach(b => { b.disabled = !k || !c; });
  let html = DEBUG ? diagnostica() : '';
  if (!k || !c) {
    report.innerHTML = html + `<div class="msg">Scegli ${state.tipo === 'direzione' ? 'la Direzione' : 'il Comando'}, la tipologia e l'anno
      <small>${PERSONE.size.toLocaleString('it-IT')} persone in PUMA · ${state.tipo === 'direzione' ? 'il report della Direzione raggruppa tutto il personale dei suoi Comandi, Comando per Comando' : 'il report del Comando elenca il suo personale con e senza il corso, con le ore e lo stato del requisito'}</small></div>`;
    return;
  }
  if (state.tipo === 'comando') html += disegnaComando(k, c, y);
  else html += disegnaDirezione(k, c, y);
  report.innerHTML = html;
  report.querySelectorAll('tr.persona.apribile').forEach(tr => tr.addEventListener('click', ev => {
    if (ev.target.closest('a')) return;
    const k = tr.dataset.key;
    state.invertite.has(k) ? state.invertite.delete(k) : state.invertite.add(k);
    const chiudi = state.dettaglio === state.invertite.has(k);
    tr.classList.toggle('chiusa', chiudi);
    report.querySelectorAll(`tr.det[data-for="${CSS.escape(k)}"]`).forEach(d => { d.style.display = chiudi ? 'none' : ''; });
  }));
  report.querySelectorAll('table.riep tr[data-k]').forEach(tr => tr.addEventListener('click', () => {
    const el = document.getElementById('sez-' + tr.dataset.k);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
}

function testaEnte(titolo, c, y, righe) {
  return `<div class="ente-head"><div>
      <h3>${esc(titolo)} <span>· ${logoHtml(c.tipologia)}${esc(c.tipologia)}</span></h3>
      <div class="sub">${righe}<br>Requisito: <b>${requisitoTxt(c, y)}</b></div>
    </div><div class="anno-big">Anno di riferimento<b>${y}</b></div></div>`;
}

function disegnaComando(k, c, y) {
  const E = personaleEnte(k, c, y, state.tutti);
  const R = responsabiliDi('comando', k, c.categoria);
  const dir = direzioneDi(k);
  ULTIMO = { tipo: 'comando', k, nome: E.nome, c, y, enti: [E], R, dir };
  const firme = [['Visto del ROP', R.rop.map(senzaCf).join(', ')], ['Visto del ROR', R.ror.map(senzaCf).join(', ')]];
  let h = testaStampa(E.nome, c, y, firme);
  h += testaEnte(E.nome, c, y, `${dir && !k.startsWith('direzione') ? esc(dir) + ' · ' : ''}Settore ${esc(c.categoria)} · ${E.totale} persone in PUMA<br>
        ROP: <b>${elencoNomi(R.rop)}</b> · ROR: <b>${elencoNomi(R.ror)}</b> · Funzionario di settore: <b>${elencoNomi(R.fds)}</b>`);
  h += `<div class="solo-schermo">${tessere(E.conta, E.con.length, E.senza.length, E.collettivi, E.collPrec, y, E.vari)}</div>`;
  h += `<h4 class="sec">Personale ${y} <span>· clic su un nominativo per il report individuale</span></h4>`;
  h += legendaHtml() + tabellaPersonale(E, y, c);
  return h + legendaManovre(c) + noteHtml(c, y);
}

function disegnaDirezione(k, c, y) {
  const nomeDir = NOME_ENTE.get(k) || k;
  const keys = [k, ...comandiDi(nomeDir).sort((a, b) => (NOME_ENTE.get(a) || a).localeCompare(NOME_ENTE.get(b) || b, 'it'))];
  const enti = keys.map(x => personaleEnte(x, c, y, state.tutti));
  const R = responsabiliDi('direzione', k, c.categoria);
  ULTIMO = { tipo: 'direzione', k, nome: nomeDir, c, y, enti, R };
  const tot = { con: 0, senza: 0, totale: 0, conta: Object.fromEntries(Object.keys(STATI).map(x => [x, 0])), coll: { n: 0, ore: 0 }, collPrec: { n: 0, ore: 0 }, ore: 0, vari: 0 };
  enti.forEach(E => {
    tot.con += E.con.length; tot.senza += E.senza.length; tot.totale += E.totale; tot.ore += E.ore.tot; tot.vari += E.vari;
    Object.keys(STATI).forEach(x => { tot.conta[x] += E.conta[x]; });
    tot.coll.n += E.collettivi.n; tot.coll.ore += E.collettivi.ore; tot.collPrec.n += E.collPrec.n; tot.collPrec.ore += E.collPrec.ore;
  });
  ULTIMO.tot = tot;
  const firme = [['Visto del ROR', R.ror.map(senzaCf).join(', ')], R.fds.length ? ['Visto del Funzionario di settore', R.fds.map(senzaCf).join(', ')] : null].filter(Boolean);
  let h = testaStampa(nomeDir, c, y, firme);
  h += testaEnte(nomeDir, c, y, `Settore ${esc(c.categoria)} · ${keys.length - 1} Comandi · ${tot.totale} persone in PUMA<br>
        ROR: <b>${elencoNomi(R.ror)}</b>${R.fds.length ? ` · Funzionario di settore: <b>${elencoNomi(R.fds)}</b>` : ''}`);
  h += `<div class="solo-schermo">${tessere(tot.conta, tot.con, tot.senza, tot.coll, tot.collPrec, y, tot.vari)}</div>`;

  // Riepilogo Comando per Comando
  h += `<h4 class="sec">Riepilogo per Comando ${y} <span>· clic su una riga per andare al Comando</span></h4>${legendaHtml()}
    <div class="table-scroll"><table class="riep"><thead><tr><th>Comando</th><th>ROP</th><th>Personale in PUMA</th><th>Con corso</th>
    ${ORDINE_STATI.slice(0, 4).map(x => `<th>${pallino(x)}${STATI[x].t}</th>`).join('')}<th>Idonei</th><th>Senza corso con attività</th><th>Ore svolte</th><th>Collettivi organizzati</th></tr></thead><tbody>`;
  enti.forEach(E => {
    const rop = resp('rop', c.categoria, E.k);
    const n = E.con.length;
    const barre = n ? ORDINE_STATI.map(x => E.conta[x] ? `<i style="width:${E.conta[x] / n * 100}%;background:${STATI[x].c}" title="${STATI[x].t}: ${E.conta[x]}"></i>` : '').join('') : '';
    h += `<tr data-k="${E.k}"><td><b>${esc(E.nome)}</b></td><td>${rop.length ? esc(rop.map(senzaCf).join(', ')) : '<span class="sub-n">—</span>'}</td>
      <td class="n">${E.totale}</td><td class="n"><b>${n}</b></td>
      ${ORDINE_STATI.slice(0, 4).map(x => `<td class="n">${E.conta[x] || ''}</td>`).join('')}
      <td>${n ? `<div class="mini">${barre}</div><span class="sub-n">${Math.round(E.conta.ok / n * 100)}% idonei</span>` : '<span class="sub-n">—</span>'}</td>
      <td class="n">${E.senza.length || ''}</td>
      <td class="n">${E.ore.tot ? fmtHM(E.ore.tot) : '—'}</td><td class="n">${E.collettivi.n || '—'}${E.collettivi.n ? `<span class="sub-n">${fmtHM(E.collettivi.ore)}</span>` : ''}</td></tr>`;
  });
  h += `<tr class="tot"><td>Totale ${esc(nomeDir)}</td><td></td><td class="n">${tot.totale}</td><td class="n">${tot.con}</td>
    ${ORDINE_STATI.slice(0, 4).map(x => `<td class="n">${tot.conta[x]}</td>`).join('')}<td>${tot.con ? Math.round(tot.conta.ok / tot.con * 100) + '% idonei' : ''}</td>
    <td class="n">${tot.senza}</td><td class="n">${fmtHM(tot.ore)}</td><td class="n">${tot.coll.n}</td></tr></tbody></table></div>`;

  // Comando per Comando
  const vuoti = [];
  enti.forEach(E => {
    if (!E.con.length && !E.senza.length && !E.altri.length) { vuoti.push(E.nome); return; }
    const rop = resp('rop', c.categoria, E.k);
    h += `<div class="com-sez" id="sez-${E.k}"><h4 class="sec">${esc(E.nome)} <small>ROP: ${rop.length ? esc(rop.map(senzaCf).join(', ')) : 'non indicato'} · ${E.con.length} con corso · ${E.conta.ok} idonei · ${E.senza.length} senza corso</small></h4>
      ${tabellaPersonale(E, y, c)}</div>`;
  });
  if (vuoti.length) h += `<div class="note-box"><b>Nessuno con il corso o con attività di questa tipologia</b>: ${vuoti.map(esc).join(' · ')}</div>`;
  return h + legendaManovre(c) + noteHtml(c, y);
}

const SIGLA_ENTE = n => n.replace(/^comando\s+/i, '').replace(/^direzione\s+/i, 'DIR_').replace(/[^A-Za-z0-9_]+/g, '');
function nomeFilePdf(R) {
  const t = (R.c.sigla || normKey(SIGLA_BREVE(R.c))).replace(/[^A-Za-z0-9]+/g, '') || 'TIP';
  return `Report_Collettivo_${t}_${SIGLA_ENTE(R.nome)}_${R.y}.pdf`;
}
async function creaPdf() {

  yy += 17;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5);
  ['VIGILI DEL FUOCO', R.nome.toUpperCase()].forEach(t => { doc.text(testoPdf(t), W / 2, yy, { align: 'center' }); yy += 4.4; });
  doc.setFontSize(9.5);
  doc.text(testoPdf('REPORT COLLETTIVO - ' + c.tipologia), W / 2, yy, { align: 'center' }); yy += 6.5;
