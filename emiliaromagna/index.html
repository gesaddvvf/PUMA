<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P.U.M.A. - Libretti SAF</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/jpeg" href="https://gesaddvvf.github.io/PUMA/images/puma.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --gold: #ffd700; --ok: #66bb6a; --ko: #ef5350; --warn: #ffb74d; --rosso: #c62828; }
    * { scrollbar-width: thin; scrollbar-color: #555 #1e1e1e; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body { font-family: 'Comfortaa', cursive; background-color: #1e1e1e; color: #f0f0f0; display: flex; flex-direction: column; }

    /* ---------- HEADER (come le altre pagine PUMA) ---------- */
    #page-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;
      background-color: #1e1e1e; border-bottom: 1px solid #444; padding: 10px 16px; box-sizing: border-box; flex-shrink: 0;
    }
    #page-header h1 { font-size: 16px; color: var(--gold); margin: 0 0 2px 0; font-weight: bold; display: flex; align-items: center; gap: 6px; }
    #page-header .puma-icon { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
    #page-header .subtitle-divider { color: #666; }
    #page-header h2 { font-size: 13px; color: #ccc; font-weight: normal; margin: 0; }
    #page-header h2 b { color: var(--gold); }
    #meta-info { font-size: 11.5px; color: #999; margin-top: 4px; }
    #nav-buttons { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
    .nav-btn {
      display: inline-block; background-color: #2a2a2a; color: var(--gold); border: 1px solid var(--gold); border-radius: 4px; padding: 8px 14px;
      font-family: 'Comfortaa', cursive; font-weight: bold; font-size: 13px; text-decoration: none; transition: background-color 0.15s, color 0.15s;
    }
    .nav-btn:hover { background-color: var(--gold); color: #1e1e1e; }
    button.nav-btn { cursor: pointer; }
    button.nav-btn:disabled { opacity: 0.6; cursor: wait; }
    #refresh-btn.nav-btn { background-color: #c62828; color: #fff; border-color: #c62828; }
    #refresh-btn.nav-btn:hover { background-color: #e53935; border-color: #e53935; color: #fff; }
    #refresh-btn.nav-btn:disabled { background-color: #7f1d1d; border-color: #7f1d1d; }
    .badge-er { display: inline-block; background: var(--rosso); color: #fff; border-radius: 3px; padding: 1px 7px; font-size: 11px; margin-left: 4px; letter-spacing: .03em; }

    /* ---------- FILTRI ---------- */
    .filters {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 8px 16px; border-bottom: 1px solid #444; background-color: #232323; font-size: 12.5px; flex-shrink: 0;
    }
    .filters label.lbl { color: #aaa; }
    .filters input, .filters select {
      background: #1e1e1e; color: #f0f0f0; border: 1px solid #555; border-radius: 4px; padding: 6px 8px; font-family: 'Comfortaa', cursive; font-size: 12.5px;
    }
    .filters input:focus, .filters select:focus { outline: none; border-color: var(--gold); }
    .filters select { font-weight: bold; }
    #sel-op { min-width: 300px; max-width: 100%; }
    #cerca { width: 150px; }
    .filters label.chk { display: inline-flex; gap: 6px; align-items: center; color: #ccc; cursor: pointer; }
    .filters label.chk input { accent-color: var(--gold); }
    .azioni { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      background: #2a2a2a; color: var(--gold); border: 1px solid var(--gold); border-radius: 4px;
      padding: 6px 12px; font-family: 'Comfortaa', cursive; font-weight: bold; font-size: 12.5px; cursor: pointer;
    }
    .btn:hover { background: var(--gold); color: #1e1e1e; }
    .btn:disabled { opacity: .4; cursor: default; background: #2a2a2a; color: var(--gold); }
    .btn.primario { background: var(--gold); color: #1e1e1e; }
    .btn.primario:disabled { background: #2a2a2a; color: var(--gold); }
    @media (max-width: 700px) {
      #page-header { flex-direction: column; }
      #nav-buttons { width: 100%; }
      .nav-btn { flex: 1 1 40%; text-align: center; }
      .filters label.lbl, #meta-info { display: none; }
      .filters select, .filters input:not([type=checkbox]), #sel-op, #cerca { flex: 1 1 100%; min-width: 0; box-sizing: border-box; }
      .azioni { margin-left: 0; width: 100%; }
      .azioni .btn { flex: 1 1 45%; }
      .filters { padding: 6px 10px; gap: 6px; }
    }

    /* ---------- CONTENUTO ---------- */
    #content { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; box-sizing: border-box; }
    .wrap { max-width: 1180px; margin: 0 auto; }
    .msg {
      margin: 40px auto; max-width: 600px; text-align: center; color: var(--gold); border: 1px solid var(--gold);
      border-radius: 6px; padding: 16px 20px; font-weight: bold; line-height: 1.6; background: #232323;
    }
    .msg small { display: block; color: #aaa; font-weight: normal; margin-top: 6px; }
    .stato-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
    .st { background: #262626; border: 1px solid #3a3a3a; border-radius: 6px; padding: 8px 11px; }
    .st .k { color: #aaa; font-size: 11px; }
    .st .v { font-size: 20px; font-weight: bold; margin-top: 3px; }
    .st .v small { font-size: 12px; color: #aaa; font-weight: normal; }
    .st.ok { border-color: #2e5e30; } .st.ok .v { color: var(--ok); }
    .st.ko { border-color: #6b2b2b; } .st.ko .v { color: var(--ko); }
    .note-box { background: #2a2620; border: 1px solid #5a4a20; border-radius: 4px; padding: 10px 12px; font-size: 12px; line-height: 1.6; color: #ddd; margin: 0 0 14px; }
    .note-box b { color: var(--warn); }
    .note-box ul { margin: 4px 0 0; padding-left: 18px; }
    .debug-box { background: #2a2020; border: 1px solid #a33; border-radius: 4px; padding: 10px; font-size: 12px; margin-bottom: 12px; line-height: 1.5; white-space: pre-wrap; }

    /* ---------- ANTEPRIMA DEL LIBRETTO (foglio bianco, come il modulo) ---------- */
    .foglio {
      background: #fff; color: #000; border-radius: 3px; box-shadow: 0 4px 18px rgba(0,0,0,.5);
      padding: 18px 22px 22px; margin-bottom: 18px; font-family: 'Times New Roman', Times, serif; font-size: 12.5px; line-height: 1.35;
      overflow-x: auto;
    }
    .foglio.basico { font-family: Arial, Helvetica, sans-serif; font-size: 11.5px; }
    .foglio .dir { text-align: center; color: #e00000; font-weight: bold; font-size: 15px; margin-bottom: 10px; }
    .foglio .tit { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-weight: bold; font-size: 13px; margin-bottom: 6px; }
    .foglio .campo { border-bottom: 1px solid #000; padding: 0 6px; font-weight: bold; }
    .foglio .riga-op { margin-bottom: 8px; }
    .foglio .ciclo { font-weight: bold; margin: 12px 0 2px; }
    .foglio .mn { margin-bottom: 4px; }
    .foglio table { border-collapse: collapse; width: 100%; min-width: 760px; font-family: inherit; font-size: 11.5px; margin-bottom: 4px; }
    .foglio th, .foglio td { border: 1px solid #000; padding: 3px 5px; color: #000; background: #fff; vertical-align: middle; }
    .foglio th { font-weight: bold; text-align: center; }
    .foglio td.c { text-align: center; }
    .foglio td.n { text-align: right; white-space: nowrap; }
    .foglio td.tot { text-align: right; font-weight: bold; }
    .foglio td.vuota { color: #999; }
    .foglio tr.sotto td.tot { color: #c00; }
    .foglio .box { display: inline-block; width: 11px; height: 11px; border: 1px solid #000; line-height: 10px; text-align: center; font-size: 10px; font-weight: bold; font-family: Arial, sans-serif; }
    .foglio .gen { color: #666; font-size: 10.5px; margin-top: 8px; }
    .foglio .gen-titolo { color: #444; font-size: 11px; font-style: italic; margin: 10px 0 0; }
    /* ---------- MODIFICA A VIDEO ---------- */
    #mod-btn.attivo { background: #2e7d32; border-color: #2e7d32; color: #fff; }
    .foglio .ed { cursor: text; outline: none; }
    .foglio td.ed:hover, .foglio span.ed:hover { background: #fffbe0; }
    .foglio td.ed:focus, .foglio span.ed:focus { background: #fff6bf; box-shadow: inset 0 0 0 2px #e0a800; }
    .foglio.in-modifica td.ed:empty::after { content: '·'; color: #ccc; }
    .foglio span.ed { display: inline-block; min-width: 120px; }
    .foglio td.err, .foglio td.err:focus { background: #ffe0e0; box-shadow: inset 0 0 0 2px #e53935; }
    .foglio button.box { padding: 0; background: #fff; color: #000; cursor: pointer; }
    .foglio button.box:hover { background: #fff6bf; }
    .foglio th.azn, .foglio td.azn { width: 52px; white-space: nowrap; text-align: center; border-color: #ddd; }
    .foglio .mini { border: 1px solid #999; background: #f4f4f4; color: #333; border-radius: 3px; width: 20px; height: 20px; padding: 0; margin: 0 1px; cursor: pointer; font-size: 11px; line-height: 18px; }
    .foglio .mini:hover { background: #ffd700; border-color: #b8860b; }
    .foglio .mini.rm:hover { background: #ffcdd2; border-color: #c62828; color: #c62828; }
    .mini-btn { border: 1px solid #b8860b; background: #fff8d6; color: #5a4300; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-family: Arial, sans-serif; font-size: 12px; }
    .mini-btn:hover { background: #ffd700; }
    .mod-bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: #fff8d6; border: 1px solid #e0c060; border-radius: 4px; padding: 6px 10px; margin: -6px 0 12px; font-family: Arial, sans-serif; font-size: 12px; color: #5a4300; }
    .op-titolo { color: var(--gold); font-size: 15px; margin: 4px 0 10px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .op-titolo small { color: #aaa; font-size: 12px; font-weight: normal; }
  </style>
</head>
<body>
<header id="page-header">
  <div>
    <h1><img class="puma-icon" src="https://gesaddvvf.github.io/PUMA/images/puma.jpg" alt="PUMA">PUMA <span class="subtitle-divider">–</span> Direzione Regionale Emilia-Romagna <span class="badge-er">VV.F. E-R</span></h1>
    <h2>Libretti individuali dei mantenimenti SAF: <b id="op-nome">—</b></h2>
    <div id="meta-info">Dati caricati: <span id="last-update">—</span></div>
  </div>
  <div id="nav-buttons">
    <button class="nav-btn" id="refresh-btn" type="button">⟳ Aggiorna</button>
    <a class="nav-btn" href="https://sites.google.com/view/pumavvf/home-page">Homepage P.U.M.A.</a>
    <a class="nav-btn" href="https://gesaddvvf.github.io/PUMA/reportindividuale.html">Report Individuale</a>
  </div>
</header>

<div class="filters">
  <label class="lbl" for="sel-tipo">Libretto</label>
  <select id="sel-tipo" aria-label="Libretto">
    <option value="AVA">SAF Avanzato (biennio)</option>
    <option value="BAS">SAF Basico (anno solare)</option>
    <option value="SFA">SFA – elenco attività (anno solare)</option>
  </select>
  <label class="lbl" for="sel-periodo" id="lbl-periodo">Biennio</label>
  <select id="sel-periodo" aria-label="Periodo"></select>
  <label class="chk" id="allega-wrap" title="Il libretto SAF Avanzato è corredato dai libretti SAF Basico degli anni del biennio"><input type="checkbox" id="chk-allega" checked> con i libretti SAF Basico</label>
  <div class="azioni">
    <button class="btn" id="mod-btn" type="button" disabled>✎ Modifica</button>
    <button class="btn primario" id="pdf-btn" type="button" disabled>⬇ Scarica PDF</button>
  </div>
</div>

<div id="content"><div class="wrap" id="report"><div class="msg">Caricamento dati…</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
/* =====================================================================
   LETTURA DEI DATI PUMA
   Stessa configurazione e stesse regole del Report Individuale
   (reportindividuale.html): se lì cambia qualcosa, va cambiato anche qui.
   ===================================================================== */
/* =====================================================================
   CONFIGURAZIONE
   ===================================================================== */
const SHEET_ID      = "1WHGKaawomU_jMuO6FnwzYidou-fmpc0ndeE0aiEMYP4"; // PUMA VVF Database Personale
const GID_REG       = "2031805821";   // Registrazione_Attivita_Semplificata: una persona per riga
const GID_PIANO     = "1495276384";   // Piano_Di_Sicurezza: un addestramento collettivo per riga
const GID_MANOVRE   = "605866354";    // Manovre_PREVISTE: A2:F
const GID_FORMAZIONE = "1631986002";  // Formazione: requisiti per corso
const GID_ELENCO    = "84413100";     // Elenco_Filtrato: corsi in possesso di ogni persona

// Elenco_Filtrato: si leggono SOLO queste colonne (e-mail e cellulare non vengono letti)
const COL_ELENCO = {
  nome:      /cognome nome/i,
  comando:   /appartenenza/i,
  qualifica: /^qualifica$/i,
  corsi:     /corsi in possesso/i
};
// Codice fiscale dentro "Cognome Nome - Codice Fiscale": identifica la persona (anche tra omonimi)
const RE_CF = /\b[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]\b/i;

// Registrazione_Attivita_Semplificata: colonna trovata dall'intestazione; se manca, si usa la lettera.
const COL_REG = {
  cronologiche:  ['A', /informazioni cronologiche|timestamp/i],
  appartenenza:  ['B', /appartenenza/i],
  nome:          ['C', /personale partecipante|nominativo/i],
  cosa:          ['D', /che cosa vuoi fare/i],
  organizzatore: ['E', /organizzatore/i],
  team:          ['F', /^team$|^squadra$/i],
  ics:           ['G', /incident command/i],
  dataColl:      ['H', /data addestramento collettivo/i],
  attivita:      ['I', /^attivit[àa]$/i],
  inizio:        ['J', /inizio/i],
  fine:          ['K', /fine/i],
  tipInd:        ['L', /tipologia addestramento individuale/i],
  descr:         ['M', /^descrizione attivit/i],
  catInt:        ['P', /categoria.*intervento/i],
  descrInt:      ['Q', /breve descrizione/i],
  numInt:        ['R', /numero intervento/i],
  data:          ['V', /^data$/i]
};
// Colonne con le manovre svolte: tutte quelle "Attività addestrativa svolta (…)"
const REG_MANOVRE = /attivit[àa] addestrativa svolta\s*\(/i;
// Piano_Di_Sicurezza: colonne con le manovre previste
const PIANO_MANOVRE = /^manovre\b.*previste/i;

// Corsi che hanno TUTTI (in possesso anche se non scritti in Elenco_Filtrato)
const CORSI_DI_TUTTI = ['SAF (Speleo Alpino Fluviale) Competenze primarie', 'TPSS (Tecniche di Primo Soccorso Sanitario)'];
// Corsi da contare come un altro: tipologia registrata → tipologia del libretto
const CORSI_EQUIVALENTI = { 'SAF (Speleo Alpino Fluviale) SAF1A': 'SAF (Speleo Alpino Fluviale) Competenze primarie' };

// Registrazioni da scartare (prove)
const NOME_NON_REALE = /\b(test\d*|prova\d*|demo|esempio|fake)\b|^x+$|^-+$|^\.+$/i;   // anche TEST1, TEST2, TEST3…
// Durata massima credibile di un'attività (ore): oltre, l'orario è considerato sbagliato
const ORE_MAX = 168;
// Duplicati in Piano_Di_Sicurezza: stesso giorno + Comando + squadra + tipologia → resta l'ultimo inserito
const FILTRA_DUPLICATI = true;

/* ===================================================================== */
const URLP = new URLSearchParams(location.search);
const DEBUG = URLP.has('debug');
const ANNO_OGGI = new Date().getFullYear();
const MESI_BREVI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const csvUrl = gid => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const isNA = v => /^#?N\/[AD]$|^#(REF|VALUE|ERROR|NAME)!?/i.test((v || '').trim());
const val = v => { const t = String(v == null ? '' : v).trim(); return isNA(t) ? '' : t; };
const letterIdx = l => l.toUpperCase().split('').reduce((n, c) => n * 26 + c.charCodeAt(0) - 64, 0) - 1;
const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function normKey(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
}
function comandoKey(s) {
  let t = (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  t = t.replace(/vigili del fuoco|v\.?v\.?f\.?|\bcomando\b|\bprovinciale\b|\bdi\b|\bdel\b|\bdella\b|\bdei\b/g, ' ');
  t = t.replace(/[^a-z0-9]/g, '');
  // "Direzione Regionale Emilia-Romagna" = "Direzione Emilia Romagna" = "Direzione Interregionale …"
  if (t.includes('direzione')) t = 'direzione' + t.replace(/direzione|interregionale|regionale/g, '');
  return t;
}
function squadraKey(s) {
  return normKey((s || '').replace(/\bsquadra\b|\bsq\.?|\bteam\b/gi, ' ')) || 'nonindicata';
}
function nomeComando(s) {
  const t = (s || '').trim();
  if (!t) return '';
  if (/^(comando|direzione)/i.test(t)) return t;
  return 'Comando ' + t;
}

// "15/01/2026", "15/01/2026 08:30:00", "2026-01-15T08:30", "Date(2026,0,15,8,30,0)"
function parseDataOra(v) {
  const t = (v || '').trim();
  let m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[\sT,]+(\d{1,2})[:.](\d{2})(?:[:.](\d{2}))?)?/);
  if (m) {
    const y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
    return { d: new Date(y, +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)), ora: m[4] != null };
  }
  m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[\sT]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) return { d: new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)), ora: m[4] != null };
  m = t.match(/Date\((\d{4}),(\d{1,2}),(\d{1,2})(?:,(\d{1,2}),(\d{1,2})(?:,(\d{1,2}))?)?/);
  if (m) return { d: new Date(+m[1], +m[2], +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)), ora: m[4] != null };
  return null;
}
const parseData = v => { const r = parseDataOra(v); return r ? new Date(r.d.getFullYear(), r.d.getMonth(), r.d.getDate()) : null; };
const giornoKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtData = d => d.toLocaleDateString('it-IT', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtOra = d => d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

// Ore tra inizio e fine; null se mancano gli orari o la durata non è credibile
function oreTra(inizio, fine) {
  const a = parseDataOra(inizio), b = parseDataOra(fine);
  if (!a || !b || !a.ora || !b.ora) return null;
  const h = (b.d - a.d) / 3600000;
  return h > 0 && h <= ORE_MAX ? h : null;
}
// Ore in formato hh:mm, come nel libretto (12:00, 108:00)
function fmtHM(h) {
  if (h == null) return '—';
  const m = Math.round(h * 60);
  return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
}
const fmtH = h => h == null ? '—' : fmtHM(h) + ' h';

// "Ore Minime (in giorni)": durata di Google Sheets → 1 = 24 ore. Accetta anche "36:00:00".
function parseOreMin(v) {
  const t = val(v);
  if (!t) return null;
  let m = t.match(/^(\d+):(\d{2})(?::(\d{2}))?$/);
  if (m) return +m[1] + +m[2] / 60 + (m[3] ? +m[3] / 3600 : 0);
  m = t.replace(',', '.').match(/-?\d+(\.\d+)?/);
  if (!m) return null;
  const n = parseFloat(m[0]);
  return n > 0 ? n * 24 : null;
}
// "Collettive (in %)": "50%", "50", "0,5" → 0.5
function parsePct(v) {
  const t = val(v);
  if (!t) return null;
  const m = t.replace(',', '.').match(/\d+(\.\d+)?/);
  if (!m) return null;
  let n = parseFloat(m[0]);
  if (t.includes('%') || n > 1) n = n / 100;
  return n >= 0 && n <= 1 ? n : null;
}
const siNo = v => /^(si|sì|s|true|vero|x|1|yes)$/i.test(val(v));

/* =====================================================================
   PERSONE: "COGNOME NOME - CODICE FISCALE" → nome visibile + chiave
   ===================================================================== */
function separaNome(raw) {
  const t = val(raw).replace(/\s+/g, ' ');
  const m = t.match(RE_CF);
  const cf = m ? m[0].toUpperCase() : '';
  const nome = (m ? t.replace(m[0], ' ') : t).replace(/\s*[-–|,;]\s*$/, '').replace(/^\s*[-–|,;]\s*/, '').replace(/\s+/g, ' ').trim();
  return { nome, cf };
}
let NOME_A_CF = new Map();   // nome normalizzato → chiave CF (solo se il nome è unico)
function chiavePersona(nome, cf) {
  if (cf) return 'cf:' + cf;
  const k = normKey(nome);
  const c = NOME_A_CF.get(k);
  return c && c !== '*' ? c : 'n:' + k;
}
function persona(key, nome) {
  if (!PERSONE.has(key)) PERSONE.set(key, { key, grafie: new Map(), originali: new Map(), originaleElenco: '', comandi: new Map(), qualifica: '', corsiPossesso: new Set(), corsiTxt: [], inElenco: false, att: [] });
  const p = PERSONE.get(key);
  if (nome) p.grafie.set(nome, (p.grafie.get(nome) || 0) + 1);
  return p;
}

/* =====================================================================
   DATI
   ===================================================================== */
let PERSONE = new Map();   // chiave nome → { nome, comandi: Map, att: [] }
let CORSI = [];            // righe di Formazione (un corso = una Tipologia)
let CATEGORIE = [];        // colonna Categoria di Formazione, nell'ordine del foglio
let EQUIVALENTE = new Map(); // corso → corso con cui si conta (es. SAF1A → Competenze primarie)
let DI_TUTTI = [];           // corsi in possesso di tutti
const equivalente = c => (c && EQUIVALENTE.get(c)) || c;
let LOGHI = new Map();     // nome tipologia normalizzato → SVG del logo

let MANOVRE = [];          // righe di Manovre_PREVISTE
let colReg = {}, colPiano = {}, colElenco = {}, diag = {};

function scaricaCsv(gid, header) {
  return new Promise((resolve, reject) => {
    Papa.parse(csvUrl(gid) + '&_=' + Date.now(), {
      download: true, header, skipEmptyLines: true,
      complete: r => resolve(r.data), error: err => reject(err)
    });
  });
}

function elaboraFormazione(rows) {
  const hi = rows.findIndex(r => r.some(c => /^sigla$/i.test((c || '').trim())));
  const head = hi >= 0 ? rows[hi].map(c => (c || '').trim()) : [];
  const ix = re => head.findIndex(h => re.test(h));
  const c = {
    sigla: ix(/^sigla$/i), tipologia: ix(/^tipologia$/i), categoria: ix(/^categoria$/i), prof: ix(/corsi\s*\(profilazione\)/i),
    delta: ix(/delta anni/i), oreMin: ix(/ore minime/i), coll: ix(/collettive/i),
    soloReg: ix(/stampa solo registro/i), sovra: ix(/sovraordinazione/i)
  };
  const g = (r, k) => c[k] >= 0 ? val(r[c[k]]) : '';
  CORSI = [];
  rows.slice(hi + 1).forEach(r => {
    const sigla = g(r, 'sigla'), tipologia = g(r, 'tipologia');
    if (!tipologia) return;
    const corso = {
      id: CORSI.length, nome: tipologia, sigla, tipologia, categoria: g(r, 'categoria') || tipologia, prof: g(r, 'prof'),
      // "Delta anni per libretto": -1 = conta anche l'anno precedente, -2 = due anni prima… ; 0 o vuoto = solo l'anno scelto
      anniPrima: Math.max(0, -(parseInt(g(r, 'delta'), 10) || 0)),
      sovra: (() => { const n = parseFloat(g(r, 'sovra').replace(',', '.')); return isNaN(n) ? 999 : n; })(),
      oreMin: parseOreMin(g(r, 'oreMin')), collPct: parsePct(g(r, 'coll')),
      soloRegistro: siNo(g(r, 'soloReg')),
      // la Sigla NON identifica il corso (NBC = NBCR 0…3): si riconosce da Tipologia e da "Corsi (Profilazione)"
      keys: new Set([normKey(tipologia), normKey(g(r, 'prof'))].filter(k => k.length >= 2)),
      previste: []
    };
    CORSI.push(corso);
  });
  // Ordine dei corsi: Categoria (nell'ordine in cui compare in Formazione), poi Livello Sovraordinazione, poi Progressivo
  const ordCat = new Map();
  CORSI.forEach(x => { const k = normKey(x.categoria); if (!ordCat.has(k)) ordCat.set(k, ordCat.size); });
  CORSI.forEach(x => { x.ordine = ordCat.get(normKey(x.categoria)) * 1e6 + Math.min(x.sovra, 999) * 1e3 + x.id; });
  CATEGORIE = [...new Set(CORSI.map(x => x.categoria))];
  const perNome = n => CORSI.find(x => normKey(x.tipologia) === normKey(n));
  EQUIVALENTE = new Map();
  Object.entries(CORSI_EQUIVALENTI).forEach(([da, a]) => { const c1 = perNome(da), c2 = perNome(a); if (c1 && c2) EQUIVALENTE.set(c1, c2); });
  DI_TUTTI = CORSI_DI_TUTTI.map(perNome).filter(Boolean);
  diag.formazione = { intestazioni: hi + 1, corsi: CORSI.length, colonne: c };
}

function corsiDaSigla(t) {
  const k = normKey(t);
  if (!k) return [];
  const perSigla = [...new Set(CORSI.filter(c => normKey(c.sigla) === k).map(equivalente))];
  if (perSigla.length) return perSigla;
  const c = corsoDaChiave(k);
  return c ? [c] : [];
}
function corsoDaChiave(k) {
  return equivalente(CORSI.find(c => c.keys.has(k))) || null;
}

function elaboraManovre(rows) {
  MANOVRE = [];
  let senzaCorso = 0;
  rows.forEach(r => {
    const a = val(r[0]), uid = val(r[1]), cod = val(r[2]), ciclo = val(r[3]), man = val(r[4]), full = val(r[5]);
    if (!man && !full) return;
    if (/associazione/i.test(a) || /^manovra$/i.test(man)) return;   // intestazione
    const testo = full || [ciclo, cod, man].filter(Boolean).join(' ');
    const m = {
      corsoTxt: a, uid, codice: cod, ciclo, manovra: man || testo, testo,
      kFull: normKey(testo), kMan: normKey(man),
      reUid: uid && uid.length >= 2 ? new RegExp('(^|[^A-Za-z0-9])' + escRe(uid) + '($|[^A-Za-z0-9])', 'i') : null,
      corsi: corsiDaSigla(a)
    };
    if (m.corsi.length) m.corsi.forEach(c => c.previste.push(m)); else senzaCorso++;
    MANOVRE.push(m);
  });
  diag.manovre = { righe: MANOVRE.length, senzaCorso };
}

// Colore fisso per ogni Categoria (bordi, intestazione e righe tipologia)
const COLORI_CATEGORIA = [
  [/^saf/, '#ff9800'], [/^ssa/, '#29b6f6'], [/^usar/, '#8d6e63'], [/^tpss/, '#e53935'],
  [/^oso/, '#7e57c2'], [/^tas/, '#43a047'], [/^cfbt/, '#c2185b'], [/^nbcr/, '#fdd835'],
  [/^apr/, '#26a69a'], [/^cinofil|k9/, '#9e9d24'], [/^patentiterrestr/, '#5c6bc0'],
  [/^macchinemovimento|^mmt/, '#78909c'], [/^patentinautic/, '#00838f'],
  [/^formazionegenerale/, '#bdbdbd'], [/^varie/, '#9e9e9e']
];
function coloreCategoria(nome) {
  const k = normKey(nome);
  const c = COLORI_CATEGORIA.find(([re]) => re.test(k));
  return c ? c[1] : '#9e9e9e';
}

// Livelli del raggruppamento: Settore (es. SAF) → Categoria → Tipologia
const categoriaDi = c => c.categoria;
const settoreDi = categoriaDi;      // i requisiti sono raggruppati per Categoria (colonna C)
const tipologiaDi = c => c.tipologia;
// Testo che è una Categoria (es. "SAF (Speleo Alpino Fluviale)") e non una Tipologia
function trovaCategoria(t) {
  const k = normKey(t), k2 = senzaParentesi(t);
  if (!k) return '';
  return CATEGORIE.find(c => normKey(c) === k) || CATEGORIE.find(c => k2.length >= 2 && senzaParentesi(c) === k2) || '';
}
const senzaParentesi = t => normKey((t || '').replace(/\(.*?\)/g, ' '));

// "SAF (Speleo Alpino Fluviale), TAS (Topografia Applicata al Soccorso)" → due categorie
function splitCategorie(t) {
  return val(t).split(/\n|;|,(?![^()]*\))/).map(v => v.trim()).filter(Boolean);
}
// Categoria di intervento → categoria del libretto e settori dei requisiti
function infoCategoria(cat) {
  const label = trovaCategoria(cat) || cat;
  return { cat, label, settori: new Set([label]) };
}

// Testo di tipologia → corsi di Formazione
function trovaCorsi(testo) {
  const out = new Set();
  const t = val(testo);
  if (!t) return out;
  const tutto = corsoDaChiave(normKey(t));
  if (tutto) { out.add(tutto); return out; }
  t.split(/\n|;|,/).map(v => v.trim()).filter(Boolean).forEach(v => {
    const k = normKey(v);
    let c = corsoDaChiave(k) || corsoDaChiave(normKey(v.replace(/\(.*?\)/g, ' ')));
    if (!c) {
      let best = null, bl = 0;
      CORSI.forEach(x => x.keys.forEach(kk => { if (kk.length >= 6 && k.includes(kk) && kk.length > bl) { best = x; bl = kk.length; } }));
      c = equivalente(best);
    }
    if (c) out.add(c);
  });
  return out;
}

// Testo delle manovre svolte → manovre previste riconosciute
function trovaManovre(testo, corsiAtt) {
  const out = new Set();
  if (!testo) return out;
  const nk = normKey(testo);
  MANOVRE.forEach(m => {
    if ((m.kFull.length >= 6 && nk.includes(m.kFull)) || (m.reUid && m.reUid.test(testo)) ||
        (m.corsi.some(c => corsiAtt.has(c)) && m.kMan.length >= 6 && nk.includes(m.kMan))) out.add(m);
  });
  return out;
}

function elaboraElenco(rows) {
  const head = (rows[0] || []).map(h => (h || '').trim());
  colElenco = {};
  Object.entries(COL_ELENCO).forEach(([k, re]) => { colElenco[k] = head.findIndex(h => re.test(h)); });
  PERSONE = new Map();
  NOME_A_CF = new Map();
  if (colElenco.nome < 0) { diag.elenco = { righe: rows.length, persone: 0, errore: 'colonna "Cognome Nome" non trovata' }; return; }
  const g = (r, k) => colElenco[k] >= 0 ? val(r[colElenco[k]]) : '';
  let n = 0, corsiNonTrovati = new Set();
  rows.slice(1).forEach(r => {
    const { nome, cf } = separaNome(r[colElenco.nome]);
    if (nome.length < 3 || NOME_NON_REALE.test(nome)) return;
    const key = cf ? 'cf:' + cf : 'n:' + normKey(nome);
    const nk = normKey(nome);
    if (cf) NOME_A_CF.set(nk, NOME_A_CF.has(nk) && NOME_A_CF.get(nk) !== key ? '*' : key);
    const p = persona(key, nome);
    p.inElenco = true; n++;
    if (!p.originaleElenco) p.originaleElenco = val(r[colElenco.nome]).replace(/\s+/g, ' ');
    const com = nomeComando(g(r, 'comando'));
    if (com) p.comandi.set(com, (p.comandi.get(com) || 0) + 100);   // l'Elenco vale più delle registrazioni
    if (g(r, 'qualifica')) p.qualifica = g(r, 'qualifica');
    g(r, 'corsi').split(/\n|;|,/).map(v => v.trim()).filter(Boolean).forEach(v => {
      const c = trovaCorsi(v);
      if (c.size) c.forEach(x => p.corsiPossesso.add(x));
      else { p.corsiTxt.push(v); corsiNonTrovati.add(v); }
    });
  });
  diag.elenco = { righe: rows.length - 1, persone: n, corsiNonTrovati: [...corsiNonTrovati] };
}

function elaboraPiano(piano) {
  const headers = piano.length ? Object.keys(piano[0]) : [];
  const trova = (regole, esclusi) => { for (const r of regole) { const h = headers.find(h => r.test(h) && !(esclusi && esclusi.test(h))); if (h) return h; } return null; };
  colPiano = {
    comando: trova([/organizzat/i, /^comando/i], /funzione|appartenenza/i),
    squadra: trova([/^squadra$/i, /squadra/i], /sottosquadre/i),
    tipologia: trova([/^tipologia addestramento/i, /tipologia/i]),
    inizio: trova([/giorno ed ora inizio/i, /inizio/i]),
    fine: trova([/giorno ed ora fine/i, /\bfine\b/i]),
    descr: trova([/descrizione manovre/i, /descrizione/i]),
    area: trova([/area di addestramento/i]),
    manovre: headers.filter(h => PIANO_MANOVRE.test(h))
  };
  let lista = [];
  piano.forEach((row, i) => {
    const d = colPiano.inizio ? parseData(row[colPiano.inizio]) : null;
    if (!d) return;
    const com = val(row[colPiano.comando]), tip = val(row[colPiano.tipologia]);
    if (/\btest\d*\b/i.test(com + ' ' + tip)) return;
    lista.push({
      i, data: d, giorno: giornoKey(d), comandoKey: comandoKey(com) || 'nonindicato', comando: nomeComando(com),
      squadra: val(row[colPiano.squadra]), tipologia: tip,
      inizio: val(row[colPiano.inizio]), fine: val(row[colPiano.fine]),
      ore: oreTra(row[colPiano.inizio], row[colPiano.fine]),
      descr: val(row[colPiano.descr]), area: val(row[colPiano.area]),
      manovre: colPiano.manovre.map(h => val(row[h])).filter(Boolean).join('\n'),
      manCol: Object.fromEntries(colPiano.manovre.map(h => [h, val(row[h])]))
    });
  });
  let duplicati = 0;
  if (FILTRA_DUPLICATI) {
    const ultimo = new Map();
    lista.forEach((a, i) => ultimo.set(`${a.giorno}|${a.comandoKey}|${squadraKey(a.squadra)}|${normKey(a.tipologia)}`, i));
    const tenere = new Set(ultimo.values());
    duplicati = lista.length - tenere.size;
    lista = lista.filter((a, i) => tenere.has(i));
  }
  const idx3 = new Map(), idx2 = new Map();
  lista.forEach(p => {
    push(idx2, p.giorno + '|' + p.comandoKey, p);
    if (p.squadra) push(idx3, p.giorno + '|' + p.comandoKey + '|' + squadraKey(p.squadra), p);
  });
  diag.piano = { righe: piano.length, validi: lista.length, duplicati };
  return { idx3, idx2 };
}

function elaboraReg(reg, pianoIdx) {
  const head = (reg[0] || []).map(h => (h || '').trim());
  colReg = {};
  Object.entries(COL_REG).forEach(([k, [lettera, re]]) => {
    const i = head.findIndex(h => re.test(h));
    colReg[k] = i >= 0 ? i : letterIdx(lettera);
  });
  // "fine" non deve prendere "Giorno ed Ora Inizio"... ma neanche altre colonne con "fine" nel testo
  const iFine = head.findIndex(h => /giorno ed ora fine/i.test(h));
  if (iFine >= 0) colReg.fine = iFine;
  const iIni = head.findIndex(h => /giorno ed ora inizio/i.test(h));
  if (iIni >= 0) colReg.inizio = iIni;
  colReg.manovre = head.map((h, i) => REG_MANOVRE.test(h) ? i : -1).filter(i => i >= 0);
  if (!colReg.manovre.length) colReg.manovre = [letterIdx('N'), letterIdx('O')];

  let righe = 0, scartate = 0, senzaData = 0, collSenzaPiano = 0, nonAttivita = 0;
  const g = (r, k) => val(r[colReg[k]]);
  reg.slice(1).forEach(r => {
    const { nome, cf } = separaNome(g(r, 'nome'));
    if (!nome && !g(r, 'cronologiche')) return;
    righe++;
    if (nome.length < 3 || NOME_NON_REALE.test(nome)) { scartate++; return; }

    // Tipo: si incrociano più colonne.
    //  D "Che cosa vuoi fare?": "2a - CONFERMA presenza addestramento collettivo odierno",
    //    "2b - REGISTRAZIONE addestramenti e interventi INDIVIDUALI", "3 - STAMPA/INVIO Registro…" (non è un'attività)
    //  I "Attività": "Addestramento" / "Intervento" (per le 2b)
    //  L tipologia individuale, P/R categoria e numero intervento
    const cosa = g(r, 'cosa'), attiv = g(r, 'attivita');
    let tipo;
    if (/collettiv/i.test(cosa)) tipo = 'collettivo';
    else if (/^intervent/i.test(attiv)) tipo = 'intervento';
    else if (/^addestr/i.test(attiv) || g(r, 'tipInd')) tipo = 'individuale';
    else if (g(r, 'numInt') || g(r, 'catInt')) tipo = 'intervento';
    else if (/stampa|invio|registro individuale/i.test(cosa)) { nonAttivita++; return; }
    else if (g(r, 'inizio') || g(r, 'descr')) tipo = 'altro';
    else if (!cosa && g(r, 'organizzatore')) tipo = 'collettivo';
    else { nonAttivita++; return; }

    // Data: collettivo "odierno" → H se è una data, altrimenti giorno di compilazione (A);
    // individuali e interventi → Giorno ed Ora Inizio (J), altrimenti A. La colonna V non si usa.
    const data = tipo === 'collettivo'
      ? (parseData(g(r, 'dataColl')) || parseData(g(r, 'inizio')) || parseData(g(r, 'cronologiche')))
      : (parseData(g(r, 'inizio')) || parseData(g(r, 'fine')) || parseData(g(r, 'dataColl')) || parseData(g(r, 'cronologiche')));
    if (!data) { senzaData++; return; }

    const a = {
      tipo, data, anno: data.getFullYear(), giorno: giornoKey(data), cosa: attiv || cosa,
      organizzatore: nomeComando(g(r, 'organizzatore')), organizzatoreRaw: g(r, 'organizzatore'), appartenenzaRaw: g(r, 'appartenenza'),
      team: g(r, 'team'), ics: g(r, 'ics'),
      attivita: g(r, 'attivita'), descr: g(r, 'descr'),
      inizio: g(r, 'inizio'), fine: g(r, 'fine'),
      ore: oreTra(g(r, 'inizio'), g(r, 'fine')), oreDa: 'registrazione',
      tipologia: '', manovreTxt: colReg.manovre.map(i => val(r[i])).filter(Boolean).join('\n'),
      manCol: Object.fromEntries(colReg.manovre.map(i => [head[i] || ('col' + i), val(r[i])])),
      catInt: g(r, 'catInt'), descrInt: g(r, 'descrInt'), numInt: g(r, 'numInt'),
      piano: null, pianiMultipli: false
    };

    if (tipo === 'collettivo') {
      const k2 = a.giorno + '|' + comandoKey(g(r, 'organizzatore'));
      let cand = (a.team && pianoIdx.idx3.get(k2 + '|' + squadraKey(a.team))) || pianoIdx.idx2.get(k2) || [];
      if (cand.length > 1 && a.attivita) {
        const ka = normKey(a.attivita);
        const f = cand.filter(p => normKey(p.tipologia).includes(ka) || ka.includes(normKey(p.tipologia)));
        if (f.length) cand = f;
      }
      if (cand.length) {
        const p = cand[cand.length - 1];
        a.piano = p; a.pianiMultipli = cand.length > 1;
        a.tipologia = p.tipologia;
        if (a.ore == null && p.ore != null) { a.ore = p.ore; a.oreDa = 'piano'; a.inizio = p.inizio; a.fine = p.fine; }
        if (p.manovre) a.manovreTxt = [a.manovreTxt, p.manovre].filter(Boolean).join('\n');
        if (!a.descr) a.descr = p.descr;
      } else {
        collSenzaPiano++;
        a.tipologia = a.attivita;
      }
    } else if (tipo === 'individuale') {
      a.tipologia = g(r, 'tipInd') || a.attivita;
    } else if (tipo === 'altro') {
      a.tipologia = g(r, 'tipInd') || a.attivita;
    }

    // Corsi di Formazione collegati
    a.corsi = trovaCorsi(a.tipologia);
    a.corsiTip = new Set(a.corsi);   // corsi dalla sola tipologia (per il libretto)
    // Interventi: categorie accorpate ("SAF (...), TAS (...)") divise una per una
    a.cats = tipo === 'intervento' ? splitCategorie(a.catInt).map(infoCategoria) : [];
    a.manovre = trovaManovre(a.manovreTxt, a.corsi);
    // una manovra riconosciuta collega l'attività al suo corso solo se la sigla è di un corso solo
    if (!a.corsi.size) a.manovre.forEach(m => { if (m.corsi.length === 1 && tipo !== 'intervento') a.corsi.add(m.corsi[0]); });
    if (!a.corsi.size && tipo !== 'intervento') a.categoria = trovaCategoria(a.tipologia);

    const p = persona(chiavePersona(nome, cf), nome);
    const orig = g(r, 'nome').replace(/\s+/g, ' ');
    p.originali.set(orig, (p.originali.get(orig) || 0) + 1);
    const app = nomeComando(g(r, 'appartenenza'));
    if (app) p.comandi.set(app, (p.comandi.get(app) || 0) + 1);
    p.att.push(a);
  });
  const piuFrequente = m => [...m.entries()].sort((x, y) => y[1] - x[1])[0]?.[0] || '';
  PERSONE.forEach(p => { p.nome = piuFrequente(p.grafie); p.comando = piuFrequente(p.comandi); DI_TUTTI.forEach(c => p.corsiPossesso.add(c)); });
  const perTipo = {};
  PERSONE.forEach(p => p.att.forEach(a => { perTipo[a.tipo] = (perTipo[a.tipo] || 0) + 1; }));
  diag.reg = { righe, scartate, senzaData, collSenzaPiano, nonAttivita, perTipo, persone: PERSONE.size };
}

/* =====================================================================
   DIREZIONE REGIONALE EMILIA-ROMAGNA – CONFIGURAZIONE DEI LIBRETTI
   ===================================================================== */
const JSPDF_URL     = "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js";
const AUTOTABLE_URL = "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js";

// Operatore della pagina: impronta SHA-256 del codice fiscale (il codice fiscale non è scritto nel sorgente pubblico)
const OPERATORE_CF_SHA256 = 'bc757ce3ef86ac88ec76f3aacddd5b3a7b0c4962f14c00bc93ca48777d90433d';

// Comandi della Direzione: nome stampato nel libretto → chiavi riconosciute (comandoKey)
const COMANDI_ER = [
  ['Direzione Regionale Emilia-Romagna', ['direzioneemiliaromagna', 'direzioneer']],
  ['Bologna', ['bologna']],
  ['Ferrara', ['ferrara']],
  ['Forlì-Cesena', ['forlicesena', 'forliecesena']],
  ['Modena', ['modena']],
  ['Parma', ['parma']],
  ['Piacenza', ['piacenza']],
  ['Ravenna', ['ravenna']],
  ['Reggio Emilia', ['reggioemilia', 'reggionellemilia']],

// Il primo biennio dei mantenimenti SAF Avanzato (Circolare DCF n. 01/2025); i successivi ogni 2 anni
const BIENNIO_INIZIALE = 2025;
const PRIMO_ANNO = 2023;          // primo anno proposto nei menu

// Ore di un addestramento con più manovre: divise tra le manovre (così il totale non conta due volte le stesse ore).
// false = ogni manovra riporta le ore intere dell'addestramento.

// Colonne delle manovre (intestazioni di Piano_Di_Sicurezza e Registrazione_Attivita_Semplificata)
const RE_COL_AVANZATO = /avanzat/i;    // "Manovre SAF Avanzato previste"

// Responsabile dell'addestramento: partecipante dello stesso addestramento collettivo
// con questo ruolo nella colonna "Incident Command System" (in ordine di preferenza)
const RUOLI_RESPONSABILE = [/responsabile.*addestr/i, /direttore.*(addestr|eserc)/i, /\bresponsabile\b/i, /\bdirettore\b/i, /team\s*leader|capo\s*squadra|caposquadra|\bleader\b/i];

// "In sede" / "Fuori sede" dall'Area di Addestramento del Piano di Sicurezza
const RE_IN_SEDE = /\bsede\b|caserma|distaccamento|castello di manovra|torre di manovra|campo prove|\bscuola\b/i;

// MODELLO SAF AVANZATO (Allegato 6): cicli e manovre come da Manuale SAF Avanzato
const CICLI_AVA = [
  { n: 'I', man: [

// MODELLO SAF BASICO (Allegato 4): manovre obbligatorie, raggruppate per tempo minimo
const VOCI_BAS = [
  { gruppo: 0, testo: 'Esecuzione di nodi e ancoraggi', re: /\bnod[io]\b|ancoragg/i },
  { gruppo: 0, testo: 'Calata e recupero', re: /calata|recupero/i },

  { gruppo: 1, testo: 'Svincolo e accompagnamento con l’impiego di paranco', re: /svincol|accompagnament|paranc/i },
  { gruppo: 1, testo: 'Progressione dal basso', re: /progressione dal basso|dal basso/i },
  // gli addestramenti COLLETTIVI SAF Basico senza manovre indicate vanno qui
  { gruppo: 2, testo: 'Addestramento provinciale di gruppo su scenari urbano/industriali o naturali', re: /provincial|di gruppo|scenari/i, collettivi: true }
];
// SFA (Soccorso Fluviale Alluvionale): nessun modello di libretto, elenco semplice delle attività
const RE_SFA = /\bSFA\b|fluviale[\s-]*alluvional|alluvional/i;
const GRUPPI_BAS = [6, 6, 12];   // ore minime di ciascun gruppo
const ORE_MIN_BAS = 24;

/* =====================================================================
   UTILITÀ
   ===================================================================== */
const fmtGiorno = d => d ? d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
const fmtOre = h => h == null ? '' : fmtHM(h);
const sommaOre = l => l.reduce((s, v) => s + (v.ore || 0), 0);
const biennioLabel = y => `${y}–${y + 1}`;
const filePart = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
const tagliaTesto = (s, n) => { const t = (s || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n - 1).trimEnd() + '…' : t; };

function comandoER(testo) {
  const k = comandoKey(testo);
  if (!k) return null;
  const c = COMANDI_ER.find(([, keys]) => keys.includes(k));
  return c ? c[0] : null;
}
// Comando ER della persona (il più frequente tra quelli della Direzione)
function comandoPersonaER(p) {
  const cp = comandoER(p.comando);
  if (cp) return cp;
  const l = [...p.comandi.entries()].map(([c, n]) => [comandoER(c), n]).filter(x => x[0]).sort((a, b) => b[1] - a[1]);
  return l.length ? l[0][0] : null;
}

// Livello SAF di un corso di Formazione
function livelloCorso(c) {
  if (!c) return null;
  const t = [c.categoria, c.tipologia, c.prof].join(' ');
  if (!/\bsaf\b|speleo/i.test(t)) return null;
  if (/avanzat/i.test(t) || /^ava$/i.test(c.sigla)) return 'AVA';
  if (/basic/i.test(t) || /^bas$/i.test(c.sigla)) return 'BAS';
  return null;
}
const livelliPossesso = p => new Set([...p.corsiPossesso].map(livelloCorso).filter(Boolean));
const testoColonne = (manCol, re) => Object.entries(manCol || {}).filter(([h, v]) => re.test(h) && v).map(([, v]) => v).join('\n');
const eSaf = t => /^saf/.test(normKey(t));

/* ---------- Manovre SAF Avanzato scritte nel modulo ---------- */
const ROMANI = { I: 'I', II: 'II', III: 'III', IV: 'IV', '1': 'I', '2': 'II', '3': 'III', '4': 'IV' };
const NUMERI_AVA = new Set(CICLI_AVA.flatMap(c => c.man.map(m => m[0])));
// "I Ciclo - 31 - Teleferica…", "Ciclo II - 27 …", "31 - Teleferica…", o solo la descrizione
function manovreAva(testo) {
  const out = [], visti = new Set();
  const add = (ciclo, n) => { n = +n; if (!NUMERI_AVA.has(n)) return; const k = (ciclo || '?') + '|' + n; if (visti.has(k)) return; visti.add(k); out.push({ ciclo: ciclo || null, n }); };
  const t = val(testo);
  if (!t) return out;
  let m;
  const re1 = /\b(IV|III|II|I|[1-4])\s*[°ºª]?\s*Ciclo\s*[-–:.]?\s*(?:Scheda\s*|n\.?\s*)?(\d{1,2})\b/gi;
  const re2 = /\bCiclo\s*(IV|III|II|I|[1-4])\b\s*[-–:.]?\s*(?:Scheda\s*|n\.?\s*)?(\d{1,2})\b/gi;
  while ((m = re1.exec(t))) add(ROMANI[m[1].toUpperCase()], m[2]);
  while ((m = re2.exec(t))) add(ROMANI[m[1].toUpperCase()], m[2]);
  // numeri senza ciclo, a inizio riga o dopo una virgola: "31 - Teleferica…"
  const re3 = /(?:^|[\n,;])\s*(?:Scheda\s*|n\.?\s*)?(\d{2})\s*[-–:.)]\s*\S/g;
  while ((m = re3.exec(t))) if (![...visti].some(k => k.endsWith('|' + +m[1]))) add(null, m[1]);
  // solo descrizione, senza numero
  const nk = normKey(t);
  CICLI_AVA.forEach(c => c.man.forEach(([n, d]) => {
    const kd = normKey(d);
    if (kd.length >= 12 && nk.includes(kd) && ![...visti].some(k => k.endsWith('|' + n))) add(null, n);
  }));
  return out;
}
// Ciclo di una manovra: quello scritto, se la manovra ne fa parte; altrimenti dal semestre della data
function cicloDi(m, data, y1) {
  const conN = CICLI_AVA.filter(c => c.man.some(x => x[0] === m.n));
  if (m.ciclo && conN.some(c => c.n === m.ciclo)) return m.ciclo;
  if (conN.length === 1) return conN[0].n;
  const sem = Math.max(0, Math.min(3, (data.getFullYear() - y1) * 2 + (data.getMonth() >= 6 ? 1 : 0)));
  const perData = CICLI_AVA[sem];
  return conN.includes(perData) ? perData.n : conN[0].n;
}

/* ---------- Classificazione di un'attività ---------- */
function eSfa(a) {
  const testi = [a.tipologia, a.attivita, a.catInt, ...[...a.corsi].map(c => [c.tipologia, c.sigla, c.prof].join(' '))];
  return testi.some(t => RE_SFA.test(t || '')) || Object.entries(a.manCol || {}).some(([h, v]) => v && RE_SFA.test(h));
}
function analizza(a) {
  if (a._er) return a._er;
  const liv = new Set([...a.corsi].map(livelloCorso).filter(Boolean));
  const txtAva = [testoColonne(a.manCol, RE_COL_AVANZATO), a.piano ? testoColonne(a.piano.manCol, RE_COL_AVANZATO) : ''].filter(Boolean).join('\n');
  const txtBas = [testoColonne(a.manCol, RE_COL_BASICO), a.piano ? testoColonne(a.piano.manCol, RE_COL_BASICO) : ''].filter(Boolean).join('\n');
  const manAva = manovreAva(txtAva);
  const interventoSaf = a.tipo === 'intervento' && (a.cats || []).some(c => eSaf(c.label) || eSaf(c.cat));
  const ava = a.tipo !== 'intervento' && (liv.has('AVA') || manAva.length > 0);
  const bas = a.tipo !== 'intervento' && (liv.has('BAS') || !!txtBas);
  const sfa = eSfa(a);
  const safGenerico = a.tipo !== 'intervento' && !ava && !bas && !sfa && !!a.categoria && eSaf(a.categoria);
  return (a._er = { ava, bas, manAva, txtBas, interventoSaf: interventoSaf && !sfa, safGenerico, sfa });
}

// Attività della persona, senza doppie registrazioni dello stesso addestramento
function attivitaPersona(p) {
  const viste = new Map();
  p.att.forEach(a => {
    const k = a.giorno + '|' + a.tipo + '|' + (a.piano ? 'p' + a.piano.i : normKey([a.tipologia, a.descr, a.numInt, a.inizio].join(' ')));
    viste.set(k, a);          // resta l'ultima registrazione
  });
  return [...viste.values()].sort((x, y) => x.data - y.data || String(x.inizio).localeCompare(String(y.inizio)));
}

/* ---------- Responsabile e sede ---------- */
let PARTECIPANTI = new Map();   // addestramento collettivo (Piano) → [{ p, ics }]
function preparaPartecipanti() {
  PARTECIPANTI = new Map();
  PERSONE.forEach(p => p.att.forEach(a => { if (a.piano) push(PARTECIPANTI, a.piano, { p, ics: a.ics }); }));
}
const nomeConQualifica = p => [p.qualifica, p.nome].filter(Boolean).join(' ');
function responsabileDi(a) {
  if (!a.piano) return '';
  const part = PARTECIPANTI.get(a.piano) || [];
  for (const re of RUOLI_RESPONSABILE) {
    const r = [...new Set(part.filter(x => re.test(x.ics || '')).map(x => x.p))];
    if (r.length) return r.map(nomeConQualifica).join(', ');
  }
  return '';
}
function sedeDi(a) {
  const area = a.piano ? a.piano.area : '';
  if (!area) return null;
  return RE_IN_SEDE.test(area) ? 'in' : 'fuori';
}
function voce(a, ore) {
  return { a, data: a.data, ore, sede: sedeDi(a), resp: responsabileDi(a) };
}
// Breve descrizione per le righe "altre attività / interventi"
function descrizioneBreve(a) {
  const tip = (a.tipologia || '').replace(/SAF\s*\(Speleo Alpino Fluviale\)\s*/i, 'SAF ').trim();
  if (a.tipo === 'intervento') {
    const t = ['Intervento' + (a.numInt ? ' n. ' + a.numInt : ''), a.descrInt].filter(Boolean).join(' – ');
    return tagliaTesto(t, 140);
  }
  const tipoTxt = a.tipo === 'collettivo' ? 'Addestramento collettivo' : a.tipo === 'individuale' ? 'Addestramento individuale' : 'Attività';
  return tagliaTesto([tipoTxt + (tip ? ' ' + tip : ''), a.descr].filter(Boolean).join(' – '), 140);
}

/* =====================================================================
   COMPOSIZIONE DEI LIBRETTI
   ===================================================================== */
function libroAvanzato(p, y1) {
  const y2 = y1 + 1;
  const cicli = CICLI_AVA.map(c => ({ n: c.n, righe: c.man.map(([n, d]) => ({ n, d, voci: [] })) }));
  const altre = [];
  attivitaPersona(p).filter(a => a.anno === y1 || a.anno === y2).forEach(a => {
    const an = analizza(a);
    if (an.manAva.length) {
      const quota = a.ore == null ? null : a.ore / (DIVIDI_ORE_TRA_MANOVRE ? an.manAva.length : 1);
      an.manAva.forEach(m => {
        const c = cicli.find(x => x.n === cicloDi(m, a.data, y1));
        c.righe.find(r => r.n === m.n).voci.push(voce(a, quota));
      });
    } else if (an.ava || an.interventoSaf) {
      altre.push({ ...voce(a, a.ore), descr: descrizioneBreve(a) });
    }
  });
  cicli.forEach(c => { c.tot = c.righe.reduce((s, r) => s + sommaOre(r.voci), 0); });
  const totAltre = sommaOre(altre);
  return {
    tipo: 'AVA', p, y1, y2, periodo: biennioLabel(y1), comando: comandoPersonaER(p) || p.comando || '',
    cicli, altre, totAltre, tot: cicli.reduce((s, c) => s + c.tot, 0) + totAltre,
    nAtt: cicli.reduce((s, c) => s + c.righe.reduce((t, r) => t + r.voci.length, 0), 0) + altre.length
  };
}

function libroBasico(p, y) {
  const voci = VOCI_BAS.map(v => ({ ...v, voci: [] }));
  const altre = [];
  attivitaPersona(p).filter(a => a.anno === y).forEach(a => {
    const an = analizza(a);
    if (an.txtBas) {
      // una manovra per riga (o separate da virgole)
      const righe = an.txtBas.split(/\n|;|,(?![^()]*\))/).map(s => s.trim()).filter(Boolean);
      const trovate = new Set(), nonTrovate = [];
      righe.forEach(t => { const v = voci.find(x => x.re.test(t)); if (v) trovate.add(v); else nonTrovate.push(t); });
      if (a.tipo === 'collettivo' && !trovate.size) trovate.add(voci.find(v => v.collettivi));
      const nQuote = trovate.size + (nonTrovate.length ? 1 : 0);
      const quota = a.ore == null ? null : a.ore / (DIVIDI_ORE_TRA_MANOVRE ? Math.max(1, nQuote) : 1);
      trovate.forEach(v => v.voci.push(voce(a, quota)));
      if (nonTrovate.length) altre.push({ ...voce(a, quota), descr: tagliaTesto(nonTrovate.join(', '), 140) });
    } else if (an.bas && a.tipo === 'collettivo') {
      voci.find(v => v.collettivi).voci.push(voce(a, a.ore));
    } else if (an.bas || an.interventoSaf || an.safGenerico) {
      altre.push({ ...voce(a, a.ore), descr: descrizioneBreve(a) });
    }
  });
  const totObbl = voci.reduce((s, v) => s + sommaOre(v.voci), 0);
  const totGruppi = GRUPPI_BAS.map((_, g) => voci.filter(v => v.gruppo === g).reduce((s, v) => s + sommaOre(v.voci), 0));
  return {
    tipo: 'BAS', p, y, periodo: String(y), comando: comandoPersonaER(p) || p.comando || '',
    voci, altre, totObbl, totGruppi, totAltre: sommaOre(altre), tot: totObbl + sommaOre(altre),
    nAtt: voci.reduce((s, v) => s + v.voci.length, 0) + altre.length
  };
}

function libroSfa(p, y) {
  const righe = attivitaPersona(p).filter(a => a.anno === y && analizza(a).sfa).map(a => {
    const man = Object.entries(a.manCol || {}).filter(([h, v]) => v && RE_SFA.test(h)).map(([, v]) => v)
      .concat(a.piano ? Object.entries(a.piano.manCol || {}).filter(([h, v]) => v && RE_SFA.test(h)).map(([, v]) => v) : []);
    const tipo = { collettivo: 'Addestramento collettivo', individuale: 'Addestramento individuale', intervento: 'Intervento' }[a.tipo] || 'Attività';
    const base = a.tipo === 'intervento' ? descrizioneBreve(a) : (a.descr || (a.tipologia || '').replace(/SAF\s*\(Speleo Alpino Fluviale\)\s*/i, 'SAF '));
    return { ...voce(a, a.ore), tipo, descr: tagliaTesto(base + (man.length ? ' – Manovre: ' + man.join(', ') : ''), 220) };
  });
  return { tipo: 'SFA', p, y, periodo: String(y), comando: comandoPersonaER(p) || p.comando || '', righe, tot: sommaOre(righe), nAtt: righe.length };
}

// Libretti di un operatore per la scelta corrente
function libriOperatore(p) {
  if (state.tipo === 'AVA') {
    const l = [libroAvanzato(p, state.periodo)];
    if (state.allega) l.push(libroBasico(p, state.periodo), libroBasico(p, state.periodo + 1));
    return l;
  }
  if (state.tipo === 'SFA') return [libroSfa(p, state.periodo)];
  return [libroBasico(p, state.periodo)];
}

// L'operatore della pagina: quello con il codice fiscale indicato in OPERATORE_CF_SHA256
async function sha256(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
async function trovaOperatore() {
  for (const p of PERSONE.values()) {
    if (!p.key.startsWith('cf:')) continue;
    if (await sha256(p.key.slice(3).toUpperCase()) === OPERATORE_CF_SHA256) return { p, com: comandoPersonaER(p) || p.comando || '' };
  }
  return null;
}

function aggiornaUrl() {

    u.searchParams.set('libretto', { AVA: 'avanzato', BAS: 'basico', SFA: 'sfa' }[state.tipo]);
    u.searchParams.set('anno', state.periodo);
    if (state.tipo === 'AVA' && !state.allega) u.searchParams.set('allega', '0'); else u.searchParams.delete('allega');
    history.replaceState(null, '', u);
  } catch (e) { /* indirizzo non modificabile: nessun problema */ }
}

/* ---------- Libretto modificabile ----------
   Ogni libretto diventa un "modello" di soli testi (date, ore, responsabili…).
   Le modifiche fatte a video si salvano nel browser (localStorage) e valgono
   per anteprima e PDF finché non si sceglie «Ripristina dati PUMA». */
const PREFISSO_SALVATAGGI = 'puma-er-libretto|';
const chiaveModello = M => `${PREFISSO_SALVATAGGI}${M.tipo}|${M.periodo}`;
function leggiSalvato(k) { try { const t = localStorage.getItem(k); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function salvaModello(M) {
  M.modificato = new Date().toISOString();
  try { localStorage.setItem(chiaveModello(M), JSON.stringify(M)); return true; } catch (e) { return false; }
}
function cancellaSalvato(k) { try { localStorage.removeItem(k); } catch (e) { /* niente */ } }

const vTesto = v => ({ data: v ? fmtGiorno(v.data) : '', ore: v ? fmtOre(v.ore) : '', sede: v ? v.sede : null, resp: v ? v.resp || '' : '' });
const vuota = () => ({ data: '', ore: '', sede: null, resp: '' });
function modello(L) {
  const base = { tipo: L.tipo, periodo: L.periodo, comando: L.comando, operatore: nomeConQualifica(L.p), modificato: null };
  if (L.tipo === 'AVA') return Object.assign(base, {
    cicli: L.cicli.map(c => ({ n: c.n, righe: c.righe.map(r => ({ n: r.n, d: r.d, voci: r.voci.map(vTesto) })) })),
    altre: L.altre.map(a => Object.assign(vTesto(a), { descr: a.descr }))
  });
  if (L.tipo === 'BAS') return Object.assign(base, {
    voci: L.voci.map(v => ({ gruppo: v.gruppo, testo: v.testo, voci: v.voci.map(vTesto) })),
    altre: L.altre.map(a => Object.assign(vTesto(a), { descr: a.descr }))
  });
  return Object.assign(base, { righe: L.righe.map(r => Object.assign(vTesto(r), { tipo: r.tipo, descr: r.descr })) });
}

// Ore scritte a mano: "6:00", "6", "6,5", "1.30" (= 1 ora e 30 se c'è il punto con 2 cifre? no: 1,3 ore) → ore decimali
function parseOre(t) {
  const s = String(t || '').trim().replace(/\s*h$/i, '');
  if (!s) return 0;
  let m = s.match(/^(\d+)[:.](\d{2})$/);
  if (m && s.includes(':')) return +m[1] + Math.min(59, +m[2]) / 60;
  m = s.replace(',', '.').match(/^\d+(\.\d+)?$/);
  return m ? parseFloat(s.replace(',', '.')) : NaN;
}
const sommaT = l => l.reduce((s, v) => s + (parseOre(v.ore) || 0), 0);
const piena = v => !!(v && (v.data || v.ore || v.resp || v.descr || v.sede));
function calcolaTotali(M) {
  if (M.tipo === 'AVA') {
    M.cicli.forEach(c => { c.tot = c.righe.reduce((s, r) => s + sommaT(r.voci), 0); });
    M.totAltre = sommaT(M.altre);
    M.tot = M.cicli.reduce((s, c) => s + c.tot, 0) + M.totAltre;
    M.nAtt = M.cicli.reduce((s, c) => s + c.righe.reduce((t, r) => t + r.voci.filter(piena).length, 0), 0) + M.altre.filter(piena).length;
  } else if (M.tipo === 'BAS') {
    M.totGruppi = GRUPPI_BAS.map((_, g) => M.voci.filter(v => v.gruppo === g).reduce((s, v) => s + sommaT(v.voci), 0));
    M.totObbl = M.totGruppi.reduce((s, v) => s + v, 0);
    M.tot = M.totObbl + sommaT(M.altre);
    M.nAtt = M.voci.reduce((s, v) => s + v.voci.filter(piena).length, 0) + M.altre.filter(piena).length;
  } else {
    M.tot = sommaT(M.righe);
    M.nAtt = M.righe.filter(piena).length;
  }
  return M;
}

let MODELLI = new Map();   // chiave → modello mostrato
// Libretti dell'operatore per la scelta corrente: versione modificata a mano se c'è, altrimenti dati PUMA
function modelliOperatore(p) {
  return libriOperatore(p).map(L => {
    const m = modello(L);
    const salvato = leggiSalvato(chiaveModello(m));
    const M = calcolaTotali(salvato && salvato.tipo === m.tipo ? salvato : m);
    MODELLI.set(chiaveModello(M), M);
    return M;
  });
}

// Lettura/scrittura con percorso "cicli.0.righe.3.voci.1.ore" (crea le righe che mancano)
function scrivi(M, percorso, valore) {
  const parti = percorso.split('.');
  let o = M;
  for (let i = 0; i < parti.length - 1; i++) {
    const k = /^\d+$/.test(parti[i]) ? +parti[i] : parti[i];
    if (o[k] == null) {
      if (Array.isArray(o)) while (o.length < k) o.push(vuota());
      o[k] = /^\d+$/.test(parti[i + 1]) ? [] : vuota();
    }
    o = o[k];
  }
  o[parti[parti.length - 1]] = valore;
}
function leggi(M, percorso) {
  return percorso.split('.').reduce((o, k) => (o == null ? undefined : o[/^\d+$/.test(k) ? +k : k]), M);
}

// Si ridisegna quando si esce da una cella modificata (spunte, numeri di riga, avviso).
// Se si sta toccando/cliccando qualcosa, si aspetta il rilascio (altrimenti il clic andrebbe perso).
let premendo = false, rinvia = false;
report.addEventListener('pointerdown', () => { premendo = true; });
document.addEventListener('pointerup', () => {
  premendo = false;
  if (!rinvia) return;
  rinvia = false;
  setTimeout(() => ridisegnaTornando(document.activeElement, false), 0);
});
report.addEventListener('focusout', e => {
  if (ridisegnando) return;            // la cella è sparita perché il libretto si sta ridisegnando
  const el = e.target.closest('[data-p]');
  const foglio = el && el.closest('.foglio');
  if (!foglio || !foglio.dataset.cambiato) return;
  // ore scritte come "4" o "1,5" → "4:00", "1:30"
  const M = modelloDi(el);
  if (M && el.dataset.p.endsWith('.ore')) {
    const v = leggi(M, el.dataset.p), h = parseOre(v);
    if (v && !isNaN(h) && v !== fmtOre(h)) { scrivi(M, el.dataset.p, fmtOre(h)); salvaModello(M); }
  }
  if (premendo) { rinvia = true; return; }
  const prossima = e.relatedTarget;
  setTimeout(() => ridisegnaTornando(prossima, true), 0);
});
// ridisegna e rimette il cursore nella cella in cui si stava andando
function ridisegnaTornando(prossima, selezionaTutto) {
  const cella = prossima && prossima.closest && prossima.closest('[data-p]');
  const dove = cella && cella.closest('.foglio') ? [cella.closest('.foglio').dataset.k, cella.dataset.p] : null;
  ridisegnaFermo();
  if (!dove) return;
  const t = report.querySelector(`.foglio[data-k="${CSS.escape(dove[0])}"] [data-p="${CSS.escape(dove[1])}"]`);
  if (!t) return;
  t.focus();
  const r = document.createRange();
  r.selectNodeContents(t);
  if (!selezionaTutto) r.collapse(false);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}

  const M = modelloDi(b);
  if (b.dataset.reset) {
    if (!confirm('Tolgo le modifiche fatte a mano a questo libretto e torno ai dati PUMA?')) return;
    cancellaSalvato(b.dataset.reset);
    return ridisegnaFermo();
  }
  if (!M) return;
  if (b.dataset.sede) {
    const v = leggi(M, b.dataset.sede);
    const nuovo = v && v.sede === b.dataset.v ? null : b.dataset.v;
    scrivi(M, b.dataset.sede + '.sede', nuovo);
  } else if (b.dataset.add) {
    const lista = leggi(M, b.dataset.add);
    const i = +b.dataset.i;
    const nuova = b.dataset.add === 'righe' ? Object.assign(vuota(), { tipo: '', descr: '' }) : b.dataset.add === 'altre' ? Object.assign(vuota(), { descr: '' }) : vuota();
    if (i < 0) lista.push(nuova);
    else { if (!lista.length) lista.push(vuota()); lista.splice(i + 1, 0, nuova); }
  } else if (b.dataset.rm) {
    const lista = leggi(M, b.dataset.rm);
    const i = +b.dataset.i;
    if (lista[i] && piena(lista[i]) && !confirm('Tolgo questa riga dal libretto?')) return;
    lista.splice(i, 1);
  } else return;
  salvaModello(M);
  ridisegnaFermo();
});

function caricaScript(src) {
  return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('Impossibile caricare ' + src)); document.head.appendChild(s); });
}
async function caricaJsPdf() {
  if (!(window.jspdf && window.jspdf.jsPDF)) await caricaScript(JSPDF_URL);
  if (!window.jspdf.jsPDF.API.autoTable) await caricaScript(AUTOTABLE_URL);
}
const PW = 297, PH = 210, MX = 12;                // A4 orizzontale, margini laterali
const LARGH = PW - 2 * MX;
const ROSSO = [224, 0, 0];

// Testo con parti in grassetto: [[testo, grassetto], …] a capo automatico
function paragrafo(doc, parti, x, y, w, size, lh) {
  doc.setFontSize(size);
  const font = doc.getFont().fontName;
  const parole = [];
  parti.forEach(([t, b]) => t.split(/(\s+)/).forEach(s => { if (s) parole.push([s, b]); }));
  let cx = x, righe = 0;
  const spazio = () => { doc.setFont(font, 'normal'); return doc.getTextWidth(' '); };
  parole.forEach(([s, b]) => {
    if (/^\s+$/.test(s)) { if (cx > x) cx += spazio(); return; }
    doc.setFont(font, b ? 'bold' : 'normal');
    const wd = doc.getTextWidth(s);
    if (cx + wd > x + w && cx > x) { righe++; cx = x; }
    doc.text(s, cx, y + righe * lh);
    cx += wd + (b ? 0.3 : 0);   // margine dopo il grassetto (alcuni lettori usano un Times più largo)
  });
  doc.setFont(font, 'normal');
  return y + (righe + 1) * lh;
}
function campo(doc, etichetta, valore, x, y, w, size) {
  const font = doc.getFont().fontName;
  doc.setFontSize(size); doc.setFont(font, 'normal');
  doc.text(etichetta, x, y);
  const xs = x + doc.getTextWidth(etichetta) + 1.5;
  doc.setFont(font, 'bold');
  doc.text(valore || '', xs + 1, y);
  doc.setLineWidth(0.2);
  doc.line(xs, y + 1, xs + w, y + 1);
  doc.setFont(font, 'normal');
  return xs + w;
}
function casella(doc, x, y, segno) {
  doc.setLineWidth(0.25); doc.setDrawColor(0);
  doc.rect(x, y, 3.2, 3.2);
  if (segno) { doc.setLineWidth(0.35); doc.line(x + 0.6, y + 0.6, x + 2.6, y + 2.6); doc.line(x + 2.6, y + 0.6, x + 0.6, y + 2.6); }
}
// celle con casella: { content: '', box: true/false } → disegnata al centro della cella
function disegnaCaselle(doc) {
  return data => {
    const r = data.cell.raw;
    if (r && typeof r === 'object' && 'box' in r) {
      casella(doc, data.cell.x + data.cell.width / 2 - 1.6, data.cell.y + data.cell.height / 2 - 1.6, r.box);
    }
  };
}
const cBox = (segno, extra) => Object.assign({ content: '', box: !!segno }, extra || {});
function piede(doc, testo) {
  doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(120);
  doc.text(testo, MX, PH - 5);

function numeraPagine(doc, da, a, testoPiede) {
  for (let i = da; i <= a; i++) {
    doc.setPage(i);
    doc.setFont('times', 'normal'); doc.setFontSize(10); doc.setTextColor(0);
    doc.text(String(i - da + 1), PW - MX, PH - 6, { align: 'right' });
    piede(doc, testoPiede);
  }
}

  doc.setFont('helvetica', 'normal'); doc.text('Il dichiarante _______________________________   Data _______________', 90, y);
  y += 8;
  doc.text('Le firme apposte di seguito attestano esclusivamente la presa visione del presente libretto.', MX, y);
  y += 8;
  y = spazio(doc, y, 20, nuova);
  [['Responsabile Operativo Provinciale SAF', MX + 2], ['Funzionario Responsabile del settore SAF Provinciale', MX + LARGH / 2 + 10]].forEach(([t, x]) => {
    doc.setFont('helvetica', 'bold'); doc.text(t, x, y);
    doc.setFont('helvetica', 'normal');
    doc.text('Nome e Cognome: ____________________________', x, y + 7);
    doc.text('Firma: _______________________  Data: ______________', x, y + 14);
  });
}

function pdfSfa(doc, L) {
  let y = 13;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(0);
  const t = 'ELENCO DELLE ATTIVITÀ SFA (SOCCORSO FLUVIALE ALLUVIONALE) - ANNO SOLARE ';
  doc.text(t, MX, y);
  const xa = MX + doc.getTextWidth(t);
  doc.text(L.periodo, xa + 3, y);
  doc.setLineWidth(0.2); doc.line(xa + 1, y + 1, xa + 30, y + 1);
  y += 7;
  doc.setFont('helvetica', 'normal');
  const xe = campo(doc, 'Comando di', L.comando, MX, y, 50, 9);
  campo(doc, 'Operatore (Qualifica, Cognome e Nome)', L.operatore, xe + 3, y, 95, 9);
  y += 6;
  const larg = [10, 22, 34, 0, 13, 13, 16, 62];
  larg[3] = LARGH - larg.reduce((s, v) => s + v, 0);
  const body = L.righe.map((r, i) => [String(i + 1), r.data, r.tipo, r.descr, cBox(r.sede === 'in'), cBox(r.sede === 'fuori'), r.ore, r.resp]);
  if (!body.length) body.push([{ content: "Nessuna attività SFA registrata in PUMA nell'anno", colSpan: 8, styles: { halign: 'center', textColor: 110 } }]);
  doc.autoTable(Object.assign(stileTab('helvetica', 8), {
    startY: y, margin: { left: MX, right: MX, top: 14, bottom: 14 },
    head: [['N.', 'Data', 'Tipo', 'Descrizione', 'Sede', 'Fuori\nSede', 'Ore', 'Responsabile Addestramento (Qualifica,\nCognome e Nome)']],
    body,
    foot: [[{ content: 'Totale ore', colSpan: 6, styles: { halign: 'right' } }, { content: fmtOre(L.tot), styles: { halign: 'center' } }, '']],
    columnStyles: Object.fromEntries(larg.map((w, i) => [i, { cellWidth: w, halign: [0, 1, 4, 5, 6].includes(i) ? 'center' : 'left' }])),
    showHead: 'everyPage', showFoot: 'lastPage', rowPageBreak: 'avoid',
    didDrawCell: disegnaCaselle(doc)
  }));
  y = spazio(doc, doc.lastAutoTable.finalY + 12, 12, () => 20);
  doc.setFontSize(9);
  doc.text('Firma _______________________________     Data _______________', PW - MX, y, { align: 'right' });
}

// Un PDF con i libretti di uno o più operatori; ogni libretto inizia su una pagina nuova e ha la sua numerazione
async function creaPdf(operatori, nomeFile) {
  await caricaJsPdf();
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
  doc.setProperties({ title: nomeFile.replace(/\.pdf$/, ''), author: 'PUMA – Direzione Regionale VV.F. Emilia-Romagna', creator: 'PUMA' });
  const firma = firmaGenerato();
  let primo = true;
  operatori.forEach(o => {
    modelliOperatore(o.p).forEach(L => {
      if (!primo) doc.addPage();
      primo = false;
      const da = doc.internal.getNumberOfPages();
      if (L.tipo === 'AVA') pdfAvanzato(doc, L); else if (L.tipo === 'SFA') pdfSfa(doc, L); else pdfBasico(doc, L);
      numeraPagine(doc, da, doc.internal.getNumberOfPages(), firma);
      doc.setPage(doc.internal.getNumberOfPages());
    });
  });
  doc.save(nomeFile);
}
function nomeFileBase() {
  if (state.tipo === 'SFA') return `Elenco_SFA_${state.periodo}`;
  return `Libretto_SAF_${state.tipo === 'AVA' ? 'Avanzato_' + state.periodo + '-' + (state.periodo + 1) : 'Basico_' + state.periodo}`;
}
async function scarica(btn, operatori, nomeFile) {
  const testo = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ Creo il PDF…';
  try { await creaPdf(operatori, nomeFile); }
  catch (err) { console.error(err); alert('Non è stato possibile creare il PDF: ' + err.message); }
  finally { btn.textContent = testo; btn.disabled = false; }
}
pdfBtn.addEventListener('click', () => {
  if (OPERATORE) scarica(pdfBtn, [OPERATORE], `${nomeFileBase()}_${filePart(OPERATORE.p.nome)}.pdf`);
});

/* =====================================================================
   CARICAMENTO E EVENTI
   ===================================================================== */
async function caricaDati() {
  if (loading) return;
  loading = true;
  refreshBtn.disabled = true; refreshBtn.textContent = '⟳ Caricamento…';
  if (!caricato) report.innerHTML = '<div class="msg">Caricamento dati…</div>';
  try {
    const [reg, piano, manovre, formazione, elenco] = await Promise.all([
      scaricaCsv(GID_REG, false), scaricaCsv(GID_PIANO, true), scaricaCsv(GID_MANOVRE, false),
      scaricaCsv(GID_FORMAZIONE, false), scaricaCsv(GID_ELENCO, false)
    ]);
    diag = {};
    elaboraFormazione(formazione);
    elaboraManovre(manovre);
    elaboraElenco(elenco);
    elaboraReg(reg, elaboraPiano(piano));
    preparaPartecipanti();
    OPERATORE = await trovaOperatore();
    caricato = true;
    document.getElementById('last-update').textContent = new Date().toLocaleString('it-IT');
    document.getElementById('op-nome').textContent = OPERATORE ? [OPERATORE.p.qualifica, OPERATORE.p.nome, OPERATORE.com].filter(Boolean).join(' · ') : 'operatore non trovato';
    disegna();
  } catch (err) {
    console.error(err);
    report.innerHTML = `<div class="msg">Errore nel caricamento dei dati PUMA.<small>${esc(err.message || err)}</small></div>`;
  } finally {
    loading = false; refreshBtn.disabled = false; refreshBtn.textContent = '⟳ Aggiorna';
  }
}

selTipo.addEventListener('change', () => { state.tipo = selTipo.value; state.periodo = null; preparaMenuPeriodo(); disegna(); });
selPeriodo.addEventListener('change', () => { state.periodo = +selPeriodo.value; disegna(); });
chkAllega.addEventListener('change', () => { state.allega = chkAllega.checked; disegna(); });
refreshBtn.addEventListener('click', caricaDati);

preparaMenuPeriodo();
caricaDati();
