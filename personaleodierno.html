<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P.U.M.A. - Riepilogo Presenze Odierne</title>
  <link rel="icon" type="image/jpeg" href="https://gesaddvvf.github.io/PUMA/images/puma.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Comfortaa', cursive;
      background-color: #1e1e1e;
      color: #f0f0f0;
      padding: 0;
      box-sizing: border-box;
    }

    .page-content {
      padding: 16px;
      box-sizing: border-box;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid #444;
      padding: 10px 16px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 17px;
      color: #ffd700;
      margin: 0 0 2px 0;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .puma-icon {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .subtitle-divider {
      color: #666;
    }

    h2 {
      font-size: 14px;
      color: #ccc;
      font-weight: normal;
      margin: 0 0 4px 0;
    }

    #today-date {
      color: #ffd700;
      font-weight: bold;
      text-transform: capitalize;
    }

    #meta-info {
      font-size: 12px;
      color: #999;
      margin-bottom: 16px;
    }

    #status {
      font-size: 13px;
      color: #999;
      padding: 20px 0;
    }

    /* ---------- TABELLA ---------- */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 6px;
      border: 1px solid #3a3a3a;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 900px;
      /* Font di sistema per i dati: più leggibile del Comfortaa a corpo piccolo */
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13.5px;
      line-height: 1.4;
    }

    thead th {
      background-color: #262626;
      color: #ffd700;
      text-align: left;
      font-size: 11.5px;
      font-weight: 600;
      padding: 10px;
      border-bottom: 2px solid #ffd700;
      position: sticky;
      top: 0;
      vertical-align: bottom;
    }

    tbody td {
      padding: 10px;
      border-bottom: 1px solid #2f2f2f;
      vertical-align: middle;
    }

    tbody tr:nth-child(even) {
      background-color: #222;
    }

    tbody tr:nth-child(odd) {
      background-color: #1c1c1c;
    }

    tbody tr:hover {
      background-color: #2c2c2c;
    }

    td.comando {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }

    td.cell-multiline {
      white-space: pre-line;
    }

    td.cell-vuota {
      color: #666;
    }

    td.tipologia-cell {
      max-width: 240px;
    }

    /* Colonna logo a inizio riga: dimensione fissa */
    th.logo-col,
    td.logo-cell {
      width: 52px;
      padding: 8px 6px 8px 12px;
    }

    .logo-stack {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .logo-att {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      display: block;
    }

    .logo-att svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Orari: ora in evidenza, data piccola sotto */
    td.orario {
      white-space: nowrap;
    }

    .dt-ora {
      display: block;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #fff;
    }

    .dt-data {
      display: block;
      font-size: 11px;
      color: #999;
    }

    .badge-sicurezza {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 3px;
      font-weight: 700;
      font-size: 10.5px;
      white-space: nowrap;
      letter-spacing: 0.4px;
    }

    .badge-effettuato {
      background-color: #000;
      color: #2ecc40;
      border: 1px solid #2ecc40;
    }

    .badge-da-effettuare {
      background-color: #ff3b30;
      color: #000;
    }

    a.map-link {
      display: inline-block;
      margin-top: 6px;
      font-size: 11.5px;
      color: #ffd700;
      text-decoration: none;
      border-bottom: 1px dotted #ffd700;
    }

    a.map-link:hover {
      color: #fff;
      border-bottom-color: #fff;
    }

    /* Piano da effettuare: tinta leggera + barra rossa a sinistra */
    tbody tr.row-da-effettuare {
      background-color: #2e1513 !important;
    }

    tbody tr.row-da-effettuare:hover {
      background-color: #3a1a17 !important;
    }

    tbody tr.row-da-effettuare td:first-child {
      box-shadow: inset 4px 0 0 #ff3b30;
    }

    details.nominativi-list summary {
      cursor: pointer;
      color: #ffd700;
      outline: none;
      font-weight: 600;
      white-space: nowrap;
    }

    details.nominativi-list summary:hover {
      text-decoration: underline;
    }

    .nominativi-content {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .persona-item {
      background-color: #2a2a2a;
      border-left: 3px solid #ffd700;
      border-radius: 3px;
      padding: 6px 10px;
      font-size: 12.5px;
      line-height: 1.5;
    }

    /* Versione compatta per i responsabili: niente riquadro */
    .persona-item.compact {
      background: none;
      border-left: none;
      padding: 0;
    }

    .persona-nome {
      display: block;
      font-weight: 600;
      color: #f0f0f0;
    }

    .persona-cf {
      display: inline-block;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px;
      color: #888;
      margin-right: 12px;
    }

    .persona-item.compact .persona-cf {
      display: block;
      margin: 1px 0 0 0;
    }

    .tel-link {
      color: #f0f0f0;
      text-decoration: none;
      border-bottom: 1px dotted #999;
      cursor: pointer;
      white-space: nowrap;
    }

    .tel-link:hover {
      color: #ffd700;
      border-bottom-color: #ffd700;
    }

    #refresh-btn {
      background-color: #ffd700;
      color: #1e1e1e;
      border: none;
      border-radius: 4px;
      padding: 6px 14px;
      font-family: 'Comfortaa', cursive;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      margin-left: 8px;
    }

    #refresh-btn:hover {
      opacity: 0.85;
    }

    #nav-buttons {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .nav-btn {
      display: inline-block;
      background-color: #2a2a2a;
      color: #ffd700;
      border: 1px solid #ffd700;
      border-radius: 4px;
      padding: 8px 16px;
      font-family: 'Comfortaa', cursive;
      font-weight: bold;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .nav-btn:hover {
      background-color: #ffd700;
      color: #1e1e1e;
    }

    /* Pulsante espandi/comprimi: esiste solo su telefono */
    th.toggle-col,
    td.toggle-cell {
      display: none;
    }

    .toggle-btn {
      width: 100%;
      background-color: #262626;
      color: #ffd700;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 8px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-btn:focus-visible {
      outline: 2px solid #ffd700;
      outline-offset: 2px;
    }

    /* Squadra: evidenziata in giallo, subito leggibile accanto al comando */
    td.squadra-cell {
      color: #ffd700;
      font-weight: 700;
      font-size: 14px;
    }

    /* Schermi stretti: scheda compatta (logo, comando, squadra, piano) + dettagli espandibili */
    @media (max-width: 700px) {
      .header-top {
        flex-direction: column;
      }

      #nav-buttons {
        width: 100%;
      }

      .nav-btn {
        flex: 1;
        text-align: center;
      }

      .page-content {
        padding: 12px;
      }

      .table-wrapper {
        overflow-x: visible;
        border: none;
      }

      table {
        min-width: 0;
      }

      thead {
        display: none;
      }

      tbody {
        display: block;
      }

      tbody tr {
        display: grid;
        grid-template-columns: 48px 1fr auto;
        column-gap: 12px;
        row-gap: 2px;
        align-items: center;
        margin-bottom: 10px;
        padding: 10px 12px;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
      }

      tbody tr.row-da-effettuare {
        border-left: 4px solid #ff3b30;
      }

      tbody tr.row-da-effettuare td:first-child {
        box-shadow: none;
      }

      tbody td {
        display: block;
        padding: 0;
        border: none;
        min-width: 0;
      }

      td.sum::before {
        display: none;
      }

      /* Riepilogo */
      td.logo-cell {
        grid-column: 1;
        grid-row: 1 / span 2;
        align-self: start;
        width: 48px;
        padding: 0;
      }

      .logo-stack {
        flex-direction: column;
      }

      td.comando {
        grid-column: 2;
        grid-row: 1;
        font-size: 15px;
      }

      td.sicurezza-cell {
        grid-column: 3;
        grid-row: 1;
        text-align: right;
      }

      td.squadra-cell {
        grid-column: 2 / span 2;
        grid-row: 2;
        font-size: 14px;
        color: #ffd700;
        font-weight: 700;
      }

      td.toggle-cell {
        display: block;
        grid-column: 1 / -1;
        grid-row: 3;
        margin-top: 10px;
      }

      /* Dettagli: nascosti finché la scheda non è espansa */
      td.extra {
        display: none;
        grid-column: 1 / -1;
        padding: 8px 0;
        border-top: 1px solid #2f2f2f;
      }

      tr.expanded td.extra {
        display: block;
      }

      td.extra::before {
        content: attr(data-label);
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #ffd700;
        margin-bottom: 3px;
      }

      td.tipologia-cell {
        max-width: none;
      }

      td.orario .dt-ora,
      td.orario .dt-data {
        display: inline;
        margin-right: 6px;
      }
    }
  </style>
</head>

<body>

  <header class="header-top">
    <div>
      <h1><img class="puma-icon" src="https://gesaddvvf.github.io/PUMA/images/puma.jpg" alt="PUMA">PUMA <span class="subtitle-divider">–</span> Piattaforma Unificata Monitoraggio Addestramenti</h1>
      <h2>Riepilogo presenze odierne <span id="today-date"></span></h2>
    </div>
    <div id="nav-buttons">
      <a class="nav-btn" href="https://gesaddvvf.github.io/PUMA/trainingmaprealtime.html" id="btn-mappa">Mappa Real Time ➡</a>
      <a class="nav-btn" href="https://sites.google.com/view/pumavvf/home-page" id="btn-puma">Homepage P.U.M.A.</a>
    </div>
  </header>

  <div class="page-content">
    <div id="meta-info">Ultimo aggiornamento: <span id="last-update">—</span><button id="refresh-btn">Aggiorna
        ora</button></div>

    <div id="status">Caricamento dati in corso...</div>
    <div class="table-wrapper" id="table-wrapper" style="display:none;">
      <table>
        <thead>
          <tr id="thead-row"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script>
    const SHEET_ID = "1WHGKaawomU_jMuO6FnwzYidou-fmpc0ndeE0aiEMYP4";
    const GID = "243050594";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
    const HEADER_ROW_INDEX = 3; // riga 4 del foglio = indice 3 (0-based)
    const START_COL = 1;        // colonna B

    // Loghi delle tipologie di addestramento (loghi.json nel repo PUMA)
    const LOGHI_URL = "https://gesaddvvf.github.io/PUMA/images/loghi/loghi.json";

    const statusEl = document.getElementById('status');
    const wrapperEl = document.getElementById('table-wrapper');
    const theadRow = document.getElementById('thead-row');
    const tbody = document.getElementById('tbody');
    const lastUpdateEl = document.getElementById('last-update');

    // true solo al primo caricamento: nei refresh successivi la tabella resta visibile
    let firstLoad = true;

    // ---------- LOGHI ----------
    // Indice di ricerca: per ogni logo, più chiavi normalizzate (nome completo, nome senza parentesi, sigla)
    let loghiIndex = [];

    function normKey(s) {
      return (s || '')
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '');
    }

    const loghiReady = fetch(LOGHI_URL, { cache: 'no-cache' })
      .then(r => r.ok ? r.json() : {})
      .then(data => {
        Object.values(data).forEach(l => {
          const keys = new Set([
            normKey(l.nome),
            normKey((l.nome || '').replace(/\(.*?\)/g, ' ')),
            normKey(l.sigla)
          ]);
          keys.forEach(k => { if (k) loghiIndex.push({ k, svg: l.svg, nome: l.nome }); });
        });
      })
      .catch(err => console.warn('Loghi non caricati:', err));

    // Cerca il logo per un testo: prima corrispondenza esatta, poi la chiave più lunga contenuta nel testo
    function findLogo(text) {
      const t = normKey(text);
      if (!t || loghiIndex.length === 0) return null;
      const exact = loghiIndex.find(e => e.k === t);
      if (exact) return exact;
      let best = null;
      loghiIndex.forEach(e => {
        if (e.k.length >= 5 && t.includes(e.k) && (!best || e.k.length > best.k.length)) best = e;
      });
      return best;
    }

    function logoEl(entry) {
      const span = document.createElement('span');
      span.className = 'logo-att';
      span.title = entry.nome;
      span.innerHTML = entry.svg;
      return span;
    }

    // Separa le voci di tipologia (una per riga o separate da ;)
    function splitVoci(raw) {
      return (raw || '').split(/\n|;/).map(v => v.trim()).filter(Boolean);
    }

    // Cella logo: un logo per ogni tipologia, "Altro" se non riconosciuta, PSM se piano mancante
    function renderLogoCell(td, tipologiaRaw, ok, daEffettuare) {
      const stack = document.createElement('div');
      stack.className = 'logo-stack';
      let entries = [];
      if (daEffettuare) {
        const psm = findLogo('Piano di Sicurezza Mancante');
        if (psm) entries.push(psm);
      } else {
        const seen = new Set();
        splitVoci(tipologiaRaw).forEach(v => {
          const l = findLogo(v) || findLogo('Altro');
          if (l && !seen.has(l.nome)) { seen.add(l.nome); entries.push(l); }
        });
        if (entries.length === 0 && ok) {
          const altro = findLogo('Altro');
          if (altro) entries.push(altro);
        }
      }
      entries.forEach(e => stack.appendChild(logoEl(e)));
      td.appendChild(stack);
    }
    // ---------- FINE LOGHI ----------

    // ---------- ORARI ----------
    // "24/09/2026 08:30:00" → ora grande + data piccola ("oggi" se è la data odierna)
    function renderDateTime(td, raw) {
      const val = (raw || '').trim();
      if (!val) {
        td.classList.add('cell-vuota');
        td.textContent = '—';
        return;
      }
      const m = val.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:\s+(\d{1,2})[:.](\d{2}))?/);
      const t = val.match(/(\d{1,2})[:.](\d{2})/);
      let ora = '', data = '';
      if (m) {
        const oggi = new Date();
        const anno = m[3].length === 2 ? 2000 + parseInt(m[3], 10) : parseInt(m[3], 10);
        const isOggi = parseInt(m[1], 10) === oggi.getDate() &&
          parseInt(m[2], 10) === oggi.getMonth() + 1 &&
          anno === oggi.getFullYear();
        data = isOggi ? 'oggi' : `${m[1].padStart(2, '0')}/${m[2].padStart(2, '0')}/${anno}`;
        if (m[4]) ora = `${m[4].padStart(2, '0')}:${m[5]}`;
      } else if (t) {
        ora = `${t[1].padStart(2, '0')}:${t[2]}`;
      }
      if (!ora && !data) {
        td.textContent = val;
        return;
      }
      if (ora) {
        const o = document.createElement('span');
        o.className = 'dt-ora';
        o.textContent = ora;
        td.appendChild(o);
      }
      if (data) {
        const d = document.createElement('span');
        d.className = ora ? 'dt-data' : 'dt-ora';
        d.textContent = data;
        td.appendChild(d);
      }
    }
    // ---------- FINE ORARI ----------

    function findColIndex(headers, keyword) {
      return headers.findIndex(h => h && h.toLowerCase().includes(keyword.toLowerCase()));
    }

    // Interpreta il valore booleano esportato da Google Sheets (VERO/FALSO, TRUE/FALSE, 1/0)
    function isTrueValue(val) {
      const v = (val || '').trim().toLowerCase();
      return v === 'vero' || v === 'true' || v === '1' || v === 'sì' || v === 'si';
    }

    // Colonne (per parola chiave nell'intestazione) da non mostrare in tabella
    const HIDDEN_COL_KEYWORDS = ['codice', 'coord', 'presenti'];

    // Parole chiave per le colonne (cercate nell'intestazione del foglio)
    const TIPOLOGIA_KEYWORD = 'tipologia addestramento';
    const INIZIO_KEYWORD = 'ora inizio';   // "Giorno ed Ora Inizio"
    const FINE_KEYWORD = 'ora fine';       // "Giorno ed Ora Fine"
    const RESP_ADD_KEYWORD = 'responsabile addestramento';
    const RESP_TEC_KEYWORD = 'responsabile tecnico';
    const SQUADRA_KEYWORD = 'squadra';

    // Layout a schede compatte su telefono
    const MOBILE_MQ = window.matchMedia('(max-width: 700px)');

    // Intestazioni brevi per le colonne gestite dalla pagina
    const LABELS = {
      logo: '',
      tipologia: 'Tipologia addestramento',
      inizio: 'Inizio',
      fine: 'Fine',
      respAdd: 'Resp. addestramento (IC)',
      respTec: 'Resp. tecnico manovre'
    };

    // Pulisce l'intestazione da emoji/pallini iniziali (es. "⚪Funzione Comando ...")
    function cleanHeader(h) {
      return (h || '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
    }

    // Copia un numero di telefono negli appunti al click, con un piccolo feedback visivo
    function copyPhone(el, number) {
      const original = el.innerHTML;
      const done = (ok) => {
        el.innerHTML = ok ? '✅ Copiato!' : '⚠️ Errore copia';
        setTimeout(() => { el.innerHTML = original; }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(number).then(() => done(true)).catch(() => done(false));
      } else {
        try {
          const ta = document.createElement('textarea');
          ta.value = number;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          done(true);
        } catch (e) {
          done(false);
        }
      }
    }

    // Genera un elemento cliccabile "copia numero" invece di un link "chiama"
    function telSpan(num) {
      return `<span class="tel-link" onclick="copyPhone(this, '${num}')" title="Clicca per copiare il numero">📞 ${num}</span>`;
    }

    // Trasforma il testo grezzo "> Nome   CF: ...   Tel. ..." in un elenco di card leggibili
    // compact = true per i responsabili: nome, telefono e CF senza riquadro
    function renderNominativi(raw, compact) {
      const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const persone = [];
      let current = null;

      lines.forEach(line => {
        if (line.startsWith('>')) {
          current = { nome: line.replace(/^>\s*/, ''), cf: '', tel: '' };
          persone.push(current);
        } else if (current) {
          const cfMatch = line.match(/^CF:\s*(.+)$/i);
          const telMatch = line.match(/^Tel\.?\s*(.+)$/i);
          if (cfMatch) current.cf = cfMatch[1].trim();
          else if (telMatch) current.tel = telMatch[1].trim();
        }
      });

      if (persone.length === 0) return `<div class="persona-item${compact ? ' compact' : ''}">${raw}</div>`;

      return persone.map(p => {
        const cfHtml = p.cf ? `<span class="persona-cf">CF: ${p.cf}</span>` : '';
        const telHtml = p.tel ? telSpan(p.tel) : '';
        if (compact) {
          return `<div class="persona-item compact"><span class="persona-nome">${p.nome}</span>${telHtml}${cfHtml}</div>`;
        }
        return `<div class="persona-item"><span class="persona-nome">${p.nome}</span>${cfHtml}${telHtml}</div>`;
      }).join('');
    }

    // Estrae la prima coppia di coordinate decimali da un testo (es. "Coordinate Addestramento: 41.397205, 14.048347")
    function extractLatLng(raw) {
      const match = (raw || '').match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
      if (!match) return null;
      return { lat: match[1], lng: match[2] };
    }

    const MAPPA_URL = "https://gesaddvvf.github.io/PUMA/trainingmaprealtime.html";

    function loadData() {
      if (firstLoad) {
        statusEl.style.display = 'block';
        statusEl.textContent = 'Caricamento dati in corso...';
        wrapperEl.style.display = 'none';
      }

      Papa.parse(CSV_URL + '&_=' + Date.now(), {
        download: true,
        header: false,
        skipEmptyLines: false,
        complete: function (results) {
          const rows = results.data;
          const headerRow = rows[HEADER_ROW_INDEX] || [];

          // --- Salva lo stato prima di ricostruire la tabella ---
          const openKeys = new Set(
            Array.from(tbody.querySelectorAll('details.nominativi-list[open]')).map(d => d.dataset.key)
          );
          // Schede espanse su telefono, per mantenerle aperte dopo il refresh
          const expandedKeys = new Set(
            Array.from(tbody.querySelectorAll('tr.expanded')).map(t => t.dataset.key)
          );
          const scrollX = window.scrollX;
          const scrollY = window.scrollY;
          const tableScrollLeft = wrapperEl.scrollLeft;

          // Trova l'ultima colonna con un'intestazione valida
          let endCol = START_COL;
          for (let i = headerRow.length - 1; i >= START_COL; i--) {
            if (headerRow[i] && headerRow[i].trim() !== '') { endCol = i; break; }
          }

          const allHeaders = headerRow.slice(START_COL, endCol + 1);
          const dataRows = rows.slice(HEADER_ROW_INDEX + 1)
            .filter(r => r[START_COL] && r[START_COL].trim() !== '');

          const absIdx = (keyword) => {
            const rel = findColIndex(allHeaders, keyword);
            return rel >= 0 ? START_COL + rel : -1;
          };

          const sicurezzaColAbs = absIdx('sicurezza');
          const nominativiColAbs = absIdx('nominativi');
          const presentiColAbs = absIdx('presenti');   // nascosta, serve per il conteggio
          const coordColAbs = absIdx('coord');         // nascosta, serve per la mappa
          const tipologiaColAbs = absIdx(TIPOLOGIA_KEYWORD);
          const inizioColAbs = absIdx(INIZIO_KEYWORD);
          const fineColAbs = absIdx(FINE_KEYWORD);
          const respAddColAbs = absIdx(RESP_ADD_KEYWORD);
          const respTecColAbs = absIdx(RESP_TEC_KEYWORD);
          let squadraColAbs = absIdx(SQUADRA_KEYWORD);
          if ([respAddColAbs, respTecColAbs, tipologiaColAbs, START_COL].includes(squadraColAbs)) squadraColAbs = -1;

          // Colonne visibili "del foglio" (escluse nascoste e quelle gestite a parte)
          const visibleCols = [];
          for (let i = START_COL; i <= endCol; i++) {
            const h = (headerRow[i] || '').toLowerCase();
            if (HIDDEN_COL_KEYWORDS.some(k => h.includes(k))) continue;
            if ([tipologiaColAbs, inizioColAbs, fineColAbs, respAddColAbs, respTecColAbs].includes(i)) continue;
            visibleCols.push(i);
          }

          // Ordine fisso in testa: Comando | Squadra | Piano di sicurezza
          const headCols = [visibleCols.shift()];
          [squadraColAbs, sicurezzaColAbs].forEach(i => {
            const p = visibleCols.indexOf(i);
            if (i >= 0 && p >= 0) { visibleCols.splice(p, 1); headCols.push(i); }
          });
          visibleCols.unshift(...headCols);

          // Ordine: Logo | Comando | Squadra | Piano sicurezza | Tipologia | Inizio | Fine | Responsabili | resto del foglio
          const cols = visibleCols.map(i => ({ kind: 'sheet', abs: i, header: cleanHeader(headerRow[i]) }));
          const extraCols = [{ kind: 'tipologia', header: LABELS.tipologia }];
          if (inizioColAbs >= 0) extraCols.push({ kind: 'dt', abs: inizioColAbs, header: LABELS.inizio });
          if (fineColAbs >= 0) extraCols.push({ kind: 'dt', abs: fineColAbs, header: LABELS.fine });
          if (respAddColAbs >= 0) extraCols.push({ kind: 'resp', abs: respAddColAbs, header: LABELS.respAdd });
          if (respTecColAbs >= 0) extraCols.push({ kind: 'resp', abs: respTecColAbs, header: LABELS.respTec });
          const sicPos = cols.findIndex(c => c.abs === sicurezzaColAbs);
          if (sicPos >= 0) cols.splice(sicPos + 1, 0, ...extraCols);
          else cols.push(...extraCols);
          cols.unshift({ kind: 'logo', header: LABELS.logo });
          cols.push({ kind: 'toggle', header: '' }); // pulsante dettagli (solo telefono)

          // Header
          theadRow.innerHTML = '';
          cols.forEach(c => {
            const th = document.createElement('th');
            th.textContent = c.header;
            if (c.kind === 'logo') th.className = 'logo-col';
            if (c.kind === 'toggle') th.className = 'toggle-col';
            theadRow.appendChild(th);
          });

          lastUpdateEl.textContent = new Date().toLocaleTimeString('it-IT');
          firstLoad = false;

          // Body
          tbody.innerHTML = '';
          if (dataRows.length === 0) {
            wrapperEl.style.display = 'none';
            statusEl.style.display = 'block';
            statusEl.textContent = 'Nessuna presenza registrata al momento.';
            return;
          }

          // Contatore per rendere univoca la chiave se lo stesso comando compare più volte
          const keyCount = {};

          dataRows.forEach(row => {
            const tr = document.createElement('tr');
            const hasSicurezza = sicurezzaColAbs >= 0;
            const ok = hasSicurezza && isTrueValue(row[sicurezzaColAbs]);
            const daEffettuare = hasSicurezza && !ok;

            const comando = (row[START_COL] || '').trim();
            keyCount[comando] = (keyCount[comando] || 0) + 1;
            const rowKey = `${comando}|${keyCount[comando]}`;
            tr.dataset.key = rowKey;
            if (expandedKeys.has(rowKey)) tr.classList.add('expanded');

            const coordRaw = coordColAbs >= 0 ? (row[coordColAbs] || '') : '';
            const tipologiaRaw = ok && tipologiaColAbs >= 0 ? (row[tipologiaColAbs] || '').trim() : '';

            let firstSheetCol = true;

            cols.forEach(c => {
              const td = document.createElement('td');
              td.setAttribute('data-label', c.header || '');

              if (c.kind === 'toggle') {
                td.classList.add('toggle-cell');
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'toggle-btn';
                const setLabel = open => {
                  btn.textContent = open ? 'Nascondi dettagli ▴' : 'Mostra dettagli ▾';
                  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                };
                setLabel(tr.classList.contains('expanded'));
                btn.addEventListener('click', () => setLabel(tr.classList.toggle('expanded')));
                td.appendChild(btn);

              } else if (c.kind === 'logo') {
                td.classList.add('logo-cell');
                renderLogoCell(td, tipologiaRaw, ok, daEffettuare);

              } else if (c.kind === 'tipologia') {
                // Solo testo, una voce per riga (valorizzata solo con piano effettuato)
                td.classList.add('tipologia-cell', 'cell-multiline');
                const voci = splitVoci(tipologiaRaw);
                if (voci.length === 0) { td.classList.add('cell-vuota'); td.textContent = '—'; }
                else td.textContent = voci.join('\n');

              } else if (c.kind === 'dt') {
                // Inizio / Fine in colonne separate (valorizzate solo con piano effettuato)
                td.classList.add('orario');
                renderDateTime(td, ok ? row[c.abs] : '');

              } else if (c.kind === 'resp') {
                // Responsabili: valorizzati solo se il piano di sicurezza è stato effettuato
                const val = ok ? (row[c.abs] || '').trim() : '';
                if (!val) {
                  td.classList.add('cell-vuota');
                  td.textContent = '—';
                } else if (/^\s*>/m.test(val)) {
                  const content = document.createElement('div');
                  content.className = 'nominativi-content';
                  content.style.marginTop = '0';
                  content.innerHTML = renderNominativi(val, true);
                  td.appendChild(content);
                } else {
                  td.classList.add('cell-multiline');
                  td.textContent = val;
                }

              } else if (c.abs === nominativiColAbs) {
                const val = (row[c.abs] || '').trim();
                const count = presentiColAbs >= 0 ? (row[presentiColAbs] || '').trim() : '';
                const details = document.createElement('details');
                details.className = 'nominativi-list';
                details.dataset.key = rowKey;
                if (openKeys.has(rowKey)) details.open = true; // mantiene aperte le schede già aperte
                const summary = document.createElement('summary');
                summary.textContent = `${count || '—'} presenti`;
                const content = document.createElement('div');
                content.className = 'nominativi-content';
                content.innerHTML = renderNominativi(val, false);
                details.appendChild(summary);
                details.appendChild(content);
                td.appendChild(details);

              } else if (c.abs === sicurezzaColAbs) {
                const badge = document.createElement('span');
                badge.className = 'badge-sicurezza ' + (ok ? 'badge-effettuato' : 'badge-da-effettuare');
                badge.textContent = ok ? 'EFFETTUATO' : 'DA EFFETTUARE';
                td.appendChild(badge);

                // Link "Apri nella mappa" solo se il piano di sicurezza è stato effettuato
                if (ok) {
                  const coords = extractLatLng(coordRaw);
                  if (coords) {
                    const mapLink = document.createElement('a');
                    mapLink.className = 'map-link';
                    mapLink.href = `${MAPPA_URL}?lat=${coords.lat}&lng=${coords.lng}&zoom=15`;
                    mapLink.textContent = '📍 Mappa';
                    td.appendChild(document.createElement('br'));
                    td.appendChild(mapLink);
                  }
                }

              } else {
                if (firstSheetCol) td.classList.add('comando');
                td.textContent = (row[c.abs] || '').trim();
              }

              // Riepilogo (sempre visibile) vs dettagli (espandibili su telefono)
              if (c.kind === 'sheet' && c.abs === squadraColAbs) td.classList.add('squadra-cell', 'cell-multiline');
              if (c.kind === 'sheet' && c.abs === sicurezzaColAbs) td.classList.add('sicurezza-cell');
              if (c.kind !== 'toggle') {
                const isSum = c.kind === 'logo' || td.classList.contains('comando') ||
                  td.classList.contains('squadra-cell') || td.classList.contains('sicurezza-cell');
                td.classList.add(isSum ? 'sum' : 'extra');
              }

              if (c.kind === 'sheet') firstSheetCol = false;
              tr.appendChild(td);
            });

            if (daEffettuare) tr.classList.add('row-da-effettuare');

            // Su telefono anche un tocco su logo/comando/squadra apre o chiude la scheda
            tr.addEventListener('click', e => {
              if (!MOBILE_MQ.matches) return;
              if (!e.target.closest('td.sum') || e.target.closest('a, .tel-link, details, button')) return;
              const btn = tr.querySelector('.toggle-btn');
              if (btn) btn.click();
            });
            tbody.appendChild(tr);
          });

          statusEl.style.display = 'none';
          wrapperEl.style.display = 'block';

          // Ripristina la posizione di scorrimento (pagina e tabella)
          wrapperEl.scrollLeft = tableScrollLeft;
          window.scrollTo(scrollX, scrollY);
        },
        error: function (err) {
          console.error(err);
          if (firstLoad) {
            statusEl.textContent = 'Errore nel caricamento dei dati. Riprova più tardi.';
          } else {
            lastUpdateEl.textContent += ' (ultimo aggiornamento fallito)';
          }
        }
      });
    }

    document.getElementById('refresh-btn').addEventListener('click', loadData);

    function setTodayDate() {
      const oggi = new Date();
      const formatted = oggi.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('today-date').textContent = `– ${formatted}`;
    }

    setTodayDate();
    // Primo caricamento dopo i loghi (se loghi.json non risponde, la tabella parte comunque senza loghi)
    loghiReady.then(loadData);
    // Auto-refresh ogni 60 secondi
    setInterval(loadData, 60000);
  </script>
</body>
