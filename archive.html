<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivio Direzioni VVF e Comandi</title>
    <style>
        :root {
            --primary-color: #ff5252;
            --primary-hover: #ff7979;
            --card-bg: #1e1e2f;
            --card-hover: #252538;
            --text-main: #f5f5f7;
            --text-muted: #a0a0b2;
            --border-color: #2a2a40;
            --highlight-bg: rgba(255, 82, 82, 0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent;
            color: var(--text-main);
            margin: 0;
            padding: 10px;
        }

        .layout-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Barra di ricerca bloccata in alto con sfondo completamente trasparente */
        .search-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: transparent;
            padding:10px 0px 0px 0;
            margin-bottom: 15px;
        }

        .search-box {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-box:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(255, 82, 82, 0.2);
        }

        .search-box::placeholder {
            color: var(--text-muted);
        }

        /* Fisarmonica Direzioni */
        .accordion-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .accordion-header {
            background-color: var(--card-bg);
            color: var(--text-main);
            padding: 16px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }

        .accordion-header:hover {
            background-color: var(--card-hover);
            color: var(--primary-color);
        }

        .accordion-header .arrow {
            font-size: 0.75rem;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }

        .accordion-item.open .accordion-header .arrow {
            transform: rotate(180deg);
            color: var(--primary-color);
        }

        .accordion-content {
            background-color: rgba(0, 0, 0, 0.15);
            border-top: 1px solid var(--border-color);
            padding: 10px 20px;
            display: none;
        }

        .accordion-item.open .accordion-content {
            display: block;
        }

        .command-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* Singolo Comando */
        .command-item {
            background: var(--card-hover);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .command-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .command-row:hover {
            background-color: rgba(255, 82, 82, 0.1);
        }

        .command-title {
            padding: 12px 15px;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.95rem;
            flex-grow: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .command-title::after {
            content: '\25BC';
            font-size: 0.65rem;
            color: var(--text-muted);
            transition: transform 0.3s ease;
            margin-left: 10px;
        }

        .command-item.open .command-title::after {
            transform: rotate(180deg);
            color: var(--primary-color);
        }

        .command-title.matched {
            background-color: var(--highlight-bg);
            border-radius: 6px;
        }

        /* Pulsante quadratino per Google Drive esterno */
        .external-link-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 8px;
            margin-right: 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            text-decoration: none;
            z-index: 2;
        }

        .external-link-btn:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #ffffff;
        }

        /* Contenitore anteprima incorporata (sotto al comando) */
        .embedded-preview-container {
            max-height: 400px;
            overflow-y: auto;
            background: #fff;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .command-item.open .embedded-preview-container {
            display: block;
        }

        .embedded-preview-container iframe {
            width: 100%;
            height: 350px;
            border: none;
            display: block;
        }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            display: none;
            font-size: 1.1rem;
        }
    </style>
</head>

        data.forEach((group) => {
            const matchDirezione = group.direzione.toLowerCase().includes(query);
            const matchingComandi = group.comandi.filter(cmd => cmd.nome.toLowerCase().includes(query));

            if (query !== "" && !matchDirezione && matchingComandi.length === 0) {
                return;
            }

            visibleGroupsCount++;

            const itemDir = document.createElement('div');
            itemDir.className = 'accordion-item';
            if (query !== "") {
                itemDir.classList.add('open');
            }

            const headerDir = document.createElement('div');
            headerDir.className = 'accordion-header';
            headerDir.innerHTML = `<span>${group.direzione}</span><span class="arrow">&#9660;</span>`;
            
            const contentDir = document.createElement('div');
            contentDir.className = 'accordion-content';

            headerDir.onclick = () => {
                itemDir.classList.toggle('open');
            };

            const ul = document.createElement('ul');
            ul.className = 'command-list';

            const comandiDaMostrare = (query !== "" && !matchDirezione) ? matchingComandi : group.comandi;

            comandiDaMostrare.forEach(cmd => {
                const li = document.createElement('li');

                const commandItem = document.createElement('div');
                commandItem.className = 'command-item';

                if (query !== "" && cmd.nome.toLowerCase().includes(query)) {
                    commandItem.classList.add('open');
                    itemDir.classList.add('open');
                }

                const rowDiv = document.createElement('div');
                rowDiv.className = 'command-row';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'command-title';
                titleDiv.innerText = cmd.nome;

                if (query !== "" && cmd.nome.toLowerCase().includes(query)) {
                    titleDiv.classList.add('matched');
                }

                const driveUrl = `https://drive.google.com/drive/folders/${cmd.id}`;
                const extLink = document.createElement('a');
                extLink.className = 'external-link-btn';
                extLink.href = driveUrl;
                extLink.target = '_blank';
                extLink.title = "Apri cartella in Google Drive";
                extLink.innerHTML = `
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"></path>
                    </svg>
                `;
                extLink.onclick = (e) => {
                    e.stopPropagation();
                };

                rowDiv.appendChild(titleDiv);
                rowDiv.appendChild(extLink);
                commandItem.appendChild(rowDiv);

                const previewDiv = document.createElement('div');
                previewDiv.className = 'embedded-preview-container';

                let iframeLoaded = false;
                rowDiv.onclick = (e) => {
                    if (e.target.closest('.external-link-btn')) return;
                    
                    const isOpen = commandItem.classList.contains('open');
                    commandItem.classList.toggle('open', !isOpen);

                    if (!isOpen && !iframeLoaded) {
                        const embedUrl = `https://drive.google.com/embeddedfolderview?id=${cmd.id}#list`;
                        previewDiv.innerHTML = `<iframe src="${embedUrl}" allow="autoplay"></iframe>`;
                        iframeLoaded = true;
                    }
                };

                commandItem.appendChild(previewDiv);
                li.appendChild(commandItem);
                ul.appendChild(li);
            });

            contentDir.appendChild(ul);
            itemDir.appendChild(headerDir);
            itemDir.appendChild(contentDir);
            container.appendChild(itemDir);
        });

        const noResults = document.getElementById('noResults');
        if (visibleGroupsCount === 0) {
            noResults.style.display = 'block';
        } else {
            noResults.style.display = 'none';
        }
    }

    function filterData() {
        const input = document.getElementById('searchInput').value;
        renderAccordion(input);
    }

    renderAccordion();
</script>

</body>
</html>
